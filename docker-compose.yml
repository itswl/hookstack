# The whole family, one command:
#
#   docker compose up -d --build
#
# Four containers — the pipe, the brain, a downstream you can read, and a stub
# model so the paid routes are visible without a key or a bill.
#
#   you ──► hookrelay :8100 ──► hookjudge :8200 ──► hookrelay ──► sink
#           /hook/inbound            (judges)     /hook/judge-notify
#           /hook/alertmanager
#
# Production does NOT use this file — see deploy/docker-compose.prod.yml, which
# runs the pipe alone, bound to loopback, on the network of the platform it feeds.

name: hookstack

services:
  hookrelay:
    build: ./hookrelay
    container_name: hs-hookrelay
    environment:
      HOOKRELAY_HOST: 0.0.0.0
      HOOKRELAY_PORT: 8100
      HOOKRELAY_DB: /data/hookrelay.db
      HOOKRELAY_CONFIG: /etc/hookrelay/config.yaml
      HOOKRELAY_WORKER_INTERVAL: "0.5"
      HOOKRELAY_PLUGINS: /data/plugins
      # Where the escalation route delivers. Default: the sink wearing a
      # /probe-standin path, so the plain stack shows the escalation shape
      # without a model key. With `--profile probe`, set in .env:
      #   HOOKPROBE_EVENT_URL=http://hookprobe:8088/hooks/event
      HOOKPROBE_EVENT_URL: ${HOOKPROBE_EVENT_URL:-http://sink:9000/probe-standin}
    volumes:
      # Checked in and mounted read-only, so `up` needs no setup step. Point
      # HOOKRELAY_CONFIG at /data/config.yaml to use your own instead.
      - ${HOOKRELAY_CONFIG_FILE:-./hookrelay/examples/stack.yaml}:/etc/hookrelay/config.yaml:ro
      - relay-data:/data
    # The whole .env is injected, so a new ${NAME} in the config only needs a
    # line in .env — no compose edit, no forgotten passthrough.
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8100:8100"
    restart: unless-stopped
    depends_on:
      - sink

  hookjudge:
    build: ./hookjudge
    container_name: hs-hookjudge
    environment:
      HOOKJUDGE_HOST: 0.0.0.0
      HOOKJUDGE_PORT: 8200
      HOOKJUDGE_DB: /data/hookjudge.db
      # One outbound address, and it is the pipe. Fan-out is not its business.
      HOOKJUDGE_RETURN_URL: http://hookrelay:8100/hook/judge-notify
      HOOKJUDGE_WORKER_INTERVAL: "0.5"
      HOOKJUDGE_REUSE_WINDOW_SECONDS: "3600"
      # Defaults to the stub. Leaving these empty instead would send every
      # event to the rule floor, and `reuse` — which only ever follows an ai
      # verdict — would never happen, hiding half the cost policy.
      HOOKJUDGE_AI_BASE_URL: ${HOOKJUDGE_AI_BASE_URL:-http://stub-ai:8300/v1}
      HOOKJUDGE_AI_API_KEY: ${HOOKJUDGE_AI_API_KEY:-stub-key}
      HOOKJUDGE_AI_MODEL: ${HOOKJUDGE_AI_MODEL:-stub-4o-mini}
      HOOKJUDGE_AI_PRICE_IN_PER_1K: ${HOOKJUDGE_AI_PRICE_IN_PER_1K:-0.00015}
      HOOKJUDGE_AI_PRICE_OUT_PER_1K: ${HOOKJUDGE_AI_PRICE_OUT_PER_1K:-0.0006}
      # Direct self-alarm when a return goes dead — the pipe is the broken
      # link at that moment, so this posts straight to a bot/collector URL.
      HOOKJUDGE_ALARM_URL: ${HOOKJUDGE_ALARM_URL:-}
      HOOKJUDGE_ALARM_MIN_INTERVAL_SECONDS: ${HOOKJUDGE_ALARM_MIN_INTERVAL_SECONDS:-}
    volumes:
      - judge-data:/data
    ports:
      - "127.0.0.1:8200:8200"
    restart: unless-stopped
    depends_on:
      - stub-ai

  # The last link, otherwise invisible: `docker compose logs -f sink` is what
  # an operator would actually have received. Lays out Feishu cards; prints
  # anything else as JSON. Answers {"code": 0} so the ledger records `sent`.
  sink:
    image: python:3.14-slim
    container_name: hs-sink
    command: ["python", "-u", "/examples/sink.py"]
    volumes:
      - ./hookrelay/examples:/examples:ro
    restart: unless-stopped

  # Canned verdicts over a real OpenAI-compatible endpoint, so the client, the
  # JSON-in-content convention and the token accounting are all exercised. It
  # is not a model: it reports itself as `stub-4o-mini`. Put real credentials
  # in .env and it stops being used.
  stub-ai:
    image: python:3.14-slim
    container_name: hs-stub-ai
    command: ["python", "-u", "/examples/stub_ai.py"]
    volumes:
      # The brain's stand-in, so it lives with the brain — sink stands in for
      # the pipe's downstreams and lives with the pipe.
      - ./hookjudge/examples:/examples:ro
    restart: unless-stopped

  # The investigator is opt-in: it needs a real model key to be worth
  # starting, so the plain `up` stays hermetic. Join it to the family with:
  #   ANTHROPIC_API_KEY=sk-ant-... docker compose --profile probe up -d --build
  # High/critical alerts then ALSO get a deep read-only investigation, whose
  # report returns through the pipe's probe-notify door to the same channels.
  hookprobe:
    build: ./hookprobe
    container_name: hs-hookprobe
    profiles: ["probe"]
    environment:
      HOOKPROBE_TOKEN: ${HOOKPROBE_TOKEN:-}
      HOOKPROBE_RETURN_URL: http://hookrelay:8100/hook/probe-notify
      HOOKPROBE_MODEL: ${HOOKPROBE_MODEL:-claude-opus-5}
      # Budget breaker for the autonomous door: window spend >= budget means
      # new escalations are refused (with a report card saying why). 0 = off.
      HOOKPROBE_BUDGET_USD: ${HOOKPROBE_BUDGET_USD:-}
      HOOKPROBE_BUDGET_WINDOW_HOURS: ${HOOKPROBE_BUDGET_WINDOW_HOURS:-}
      # Case files and transcripts older than this are pruned daily. 0 keeps
      # everything — the case files are the agent's episodic memory.
      HOOKPROBE_RETENTION_DAYS: ${HOOKPROBE_RETENTION_DAYS:-}
      # Skill layers: "project" (distilled, on the volume) is always on;
      # add "user" to also load a host library mounted at
      # /data/home/.claude/skills. HOOKPROBE_SKILLS pins the session's
      # skill list (comma names or "all") so a big library cannot flood it.
      HOOKPROBE_SETTING_SOURCES: ${HOOKPROBE_SETTING_SOURCES:-}
      HOOKPROBE_SKILLS: ${HOOKPROBE_SKILLS:-}
      # Operator methodology appended to the system prompt (a file path;
      # default: {workdir}/system-prompt.md when present). Named subagent
      # roles come from a JSON file (name -> {description, prompt, ...}).
      HOOKPROBE_SYSTEM_PROMPT_APPEND: ${HOOKPROBE_SYSTEM_PROMPT_APPEND:-}
      HOOKPROBE_AGENTS_CONFIG: ${HOOKPROBE_AGENTS_CONFIG:-}
      # MCP servers config (three dialects accepted; env values are
      # secrets — keep the file mounted ro or on the volume):
      HOOKPROBE_MCP_CONFIG: ${HOOKPROBE_MCP_CONFIG:-}
      # Loop hygiene, all advisory (the boundary stays the bash guard):
      # nudge the agent after N identical calls, and cap how long any single
      # command may hang. 0 = off.
      HOOKPROBE_REPEAT_REMINDER_AT: ${HOOKPROBE_REPEAT_REMINDER_AT:-}
      HOOKPROBE_BASH_TIMEOUT_MS: ${HOOKPROBE_BASH_TIMEOUT_MS:-}
      HOOKPROBE_BASH_MAX_TIMEOUT_MS: ${HOOKPROBE_BASH_MAX_TIMEOUT_MS:-}
      # Direct self-alarm when report returns exhaust their retries:
      HOOKPROBE_ALARM_URL: ${HOOKPROBE_ALARM_URL:-}
      HOOKPROBE_ALARM_MIN_INTERVAL_SECONDS: ${HOOKPROBE_ALARM_MIN_INTERVAL_SECONDS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      # Any Anthropic-dialect provider works — point ANTHROPIC_BASE_URL at its
      # endpoint and map the engine's model aliases to that provider's models:
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${ANTHROPIC_DEFAULT_SONNET_MODEL:-}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${ANTHROPIC_DEFAULT_OPUS_MODEL:-}
      CLAUDE_CODE_SUBAGENT_MODEL: ${CLAUDE_CODE_SUBAGENT_MODEL:-}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-}
    volumes:
      - probe-data:/data
      # A host skills library as the read-only user layer — mount ONLY the
      # skills subdir, never the whole ~/.claude (credentials live there):
      # - ~/.claude/skills:/data/home/.claude/skills:ro
    ports:
      - "127.0.0.1:8088:8088"
    restart: unless-stopped
    depends_on:
      - hookrelay

  # A self-scraping Prometheus, so the investigator's prometheus MCP has
  # something real to query. Opt-in with the investigator; useless alone.
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: hs-prometheus
    profiles: ["probe"]
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

volumes:
  relay-data:
  judge-data:
  probe-data:
