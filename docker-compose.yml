services:
  hookrelay:
    build: .
    ports:
      - "8100:8100"
    volumes:
      # Directory holding config.yaml (+ optional plugins/); SQLite lives beside it.
      - ./data:/data
    environment:
      HOOKRELAY_PLUGINS: /data/plugins
      HOOKRELAY_ADMIN_TOKEN: ${HOOKRELAY_ADMIN_TOKEN:-}
      HOOKRELAY_READ_TOKEN: ${HOOKRELAY_READ_TOKEN:-}
      # Channel/source secrets referenced as ${NAME} in config.yaml:
      GRAFANA_HOOK_SECRET: ${GRAFANA_HOOK_SECRET:-}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_WEBHOOK_SECRET: ${FEISHU_WEBHOOK_SECRET:-}
      DINGTALK_WEBHOOK_URL: ${DINGTALK_WEBHOOK_URL:-}
      DINGTALK_WEBHOOK_SECRET: ${DINGTALK_WEBHOOK_SECRET:-}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-}
    restart: unless-stopped
    depends_on:
      - sink

  # Local no-token downstream: prints every delivery to its logs and answers
  # {"code": 0}. Point any generic channel at http://sink:9000/... and watch
  # `docker compose logs -f sink`.
  sink:
    image: python:3.14-slim
    command: ["python", "/examples/sink.py"]
    volumes:
      - ./examples:/examples:ro
    restart: unless-stopped
