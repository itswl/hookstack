# The whole family, one command:
#
#   docker compose up -d --build
#
# Four containers — the pipe, the brain, a downstream you can read, and a stub
# model so the paid routes are visible without a key or a bill.
#
#   you ──► hookrelay :8100 ──► hookjudge :8200 ──► hookrelay ──► sink
#           /hook/inbound            (judges)     /hook/judge-notify
#           /hook/alertmanager
#
# Production does NOT use this file — see deploy/docker-compose.prod.yml, which
# runs the pipe alone, bound to loopback, on WebhookWise's network.

name: hookstack

services:
  hookrelay:
    build: ./hookrelay
    container_name: hs-hookrelay
    environment:
      HOOKRELAY_HOST: 0.0.0.0
      HOOKRELAY_PORT: 8100
      HOOKRELAY_DB: /data/hookrelay.db
      HOOKRELAY_CONFIG: /etc/hookrelay/config.yaml
      HOOKRELAY_WORKER_INTERVAL: "0.5"
      HOOKRELAY_PLUGINS: /data/plugins
    volumes:
      # Checked in and mounted read-only, so `up` needs no setup step. Point
      # HOOKRELAY_CONFIG at /data/config.yaml to use your own instead.
      - ${HOOKRELAY_CONFIG_FILE:-./hookrelay/examples/stack.yaml}:/etc/hookrelay/config.yaml:ro
      - relay-data:/data
    # The whole .env is injected, so a new ${NAME} in the config only needs a
    # line in .env — no compose edit, no forgotten passthrough.
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8100:8100"
    restart: unless-stopped
    depends_on:
      - sink

  hookjudge:
    build: ./hookjudge
    container_name: hs-hookjudge
    environment:
      HOOKJUDGE_HOST: 0.0.0.0
      HOOKJUDGE_PORT: 8200
      HOOKJUDGE_DB: /data/hookjudge.db
      # One outbound address, and it is the pipe. Fan-out is not its business.
      HOOKJUDGE_RETURN_URL: http://hookrelay:8100/hook/judge-notify
      HOOKJUDGE_WORKER_INTERVAL: "0.5"
      HOOKJUDGE_REUSE_WINDOW_SECONDS: "3600"
      # Defaults to the stub. Leaving these empty instead would send every
      # event to the rule floor, and `reuse` — which only ever follows an ai
      # verdict — would never happen, hiding half the cost policy.
      HOOKJUDGE_AI_BASE_URL: ${HOOKJUDGE_AI_BASE_URL:-http://stub-ai:8300/v1}
      HOOKJUDGE_AI_API_KEY: ${HOOKJUDGE_AI_API_KEY:-stub-key}
      HOOKJUDGE_AI_MODEL: ${HOOKJUDGE_AI_MODEL:-stub-4o-mini}
      HOOKJUDGE_AI_PRICE_IN_PER_1K: ${HOOKJUDGE_AI_PRICE_IN_PER_1K:-0.00015}
      HOOKJUDGE_AI_PRICE_OUT_PER_1K: ${HOOKJUDGE_AI_PRICE_OUT_PER_1K:-0.0006}
    volumes:
      - judge-data:/data
    ports:
      - "127.0.0.1:8200:8200"
    restart: unless-stopped
    depends_on:
      - stub-ai

  # The last link, otherwise invisible: `docker compose logs -f sink` is what
  # an operator would actually have received. Lays out Feishu cards; prints
  # anything else as JSON. Answers {"code": 0} so the ledger records `sent`.
  sink:
    image: python:3.14-slim
    container_name: hs-sink
    command: ["python", "-u", "/examples/sink.py"]
    volumes:
      - ./hookrelay/examples:/examples:ro
    restart: unless-stopped

  # Canned verdicts over a real OpenAI-compatible endpoint, so the client, the
  # JSON-in-content convention and the token accounting are all exercised. It
  # is not a model: it reports itself as `stub-4o-mini`. Put real credentials
  # in .env and it stops being used.
  stub-ai:
    image: python:3.14-slim
    container_name: hs-stub-ai
    command: ["python", "-u", "/examples/stub_ai.py"]
    volumes:
      # The brain's stand-in, so it lives with the brain — sink stands in for
      # the pipe's downstreams and lives with the pipe.
      - ./hookjudge/examples:/examples:ro
    restart: unless-stopped

volumes:
  relay-data:
  judge-data:
