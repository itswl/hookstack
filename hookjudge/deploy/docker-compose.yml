# Standalone deployment — the brain alone, no family around it. Run from the
# repo root:
#
#   docker compose --env-file .env \
#     -f hookjudge/deploy/docker-compose.yml up -d --build
#
# `--env-file .env` matters: compose interpolates ${...} from the compose
# file's own directory by default, and the ${HOOKJUDGE_RETURN_URL:?} guard
# below must read the deployment root's .env instead.
#
# The return address is required, not defaulted: the judge has exactly one
# outbound door, and a brain that starts without it judges into the void.
# The AI credentials are optional on purpose — leave them empty and every
# event walks the free routes down to the rule floor, which is a working
# (if blunt) judge; set them and recovery/reuse/ai/rule becomes the cost
# policy it is meant to be.

name: hookjudge

services:
  hookjudge:
    build:
      context: ..
    image: hookjudge:latest
    container_name: hookjudge
    environment:
      HOOKJUDGE_HOST: 0.0.0.0
      HOOKJUDGE_PORT: 8200
      HOOKJUDGE_DB: /data/hookjudge.db
      HOOKJUDGE_RETURN_URL: ${HOOKJUDGE_RETURN_URL:?where verdicts go — your pipe's judge-notify door}
      # These publish port 8200 (below) to 0.0.0.0, so the door and the board are
      # reachable by anything that reaches the host. Forward the guards that
      # .env.example documents, or this deployment ingests unsigned events and
      # serves its whole ledger to anyone: INGEST_SECRET signs /events and
      # /feedback, RULING_SECRET the /rulings/ai door (empty = that door stays
      # shut), READ_TOKEN guards /status and /live (empty = the board is open —
      # tolerable ONLY behind loopback or a tunnel, which is why the port note
      # below matters). The root shadow compose already forwards all three.
      HOOKJUDGE_INGEST_SECRET: ${HOOKJUDGE_INGEST_SECRET:-}
      HOOKJUDGE_RULING_SECRET: ${HOOKJUDGE_RULING_SECRET:-}
      HOOKJUDGE_READ_TOKEN: ${HOOKJUDGE_READ_TOKEN:-}
      HOOKJUDGE_WORKER_INTERVAL: "0.5"
      HOOKJUDGE_REUSE_WINDOW_SECONDS: ${HOOKJUDGE_REUSE_WINDOW_SECONDS:-3600}
      HOOKJUDGE_AI_BASE_URL: ${HOOKJUDGE_AI_BASE_URL:-}
      HOOKJUDGE_AI_API_KEY: ${HOOKJUDGE_AI_API_KEY:-}
      HOOKJUDGE_AI_MODEL: ${HOOKJUDGE_AI_MODEL:-}
      HOOKJUDGE_AI_PRICE_IN_PER_1K: ${HOOKJUDGE_AI_PRICE_IN_PER_1K:-0.00015}
      HOOKJUDGE_AI_PRICE_OUT_PER_1K: ${HOOKJUDGE_AI_PRICE_OUT_PER_1K:-0.0006}
      # Direct self-alarm when a return goes dead — the pipe is the broken
      # link at that moment, so this posts straight to a bot/collector URL.
      HOOKJUDGE_ALARM_URL: ${HOOKJUDGE_ALARM_URL:-}
      HOOKJUDGE_ALARM_MIN_INTERVAL_SECONDS: ${HOOKJUDGE_ALARM_MIN_INTERVAL_SECONDS:-}
    volumes:
      - judge-data:/data
    ports:
      # Open so a remote pipe can reach the judge; change to
      # "127.0.0.1:8200:8200" when the caller is local or ssh-tunneled.
      - "8200:8200"
    restart: unless-stopped

volumes:
  judge-data:
