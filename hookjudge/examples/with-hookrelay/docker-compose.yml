# Runs the pair. `docker compose up -d --build` then post an alert:
#
#   curl -X POST http://127.0.0.1:8100/hook/inbound \
#     -H 'content-type: application/json' \
#     -d '{"title":"支付网关 5xx 比例 8%","message":"gateway-2 近 5 分钟 5xx 8.1%",
#          "state":"alerting","env":"prod"}'
#
# Then read both ledgers: http://127.0.0.1:8100/ and http://127.0.0.1:8200/

services:
  hookjudge:
    build: ../..
    environment:
      HOOKJUDGE_DB: /data/hookjudge.db
      HOOKJUDGE_INGEST_SECRET: ${JUDGE_INGEST_SECRET:-}
      HOOKJUDGE_READ_TOKEN: ${JUDGE_READ_TOKEN:-}
      # Exactly one outbound address: the pipe's return door.
      HOOKJUDGE_RETURN_URL: http://hookrelay:8100/hook/judge-notify
      HOOKJUDGE_RETURN_SECRET: ${JUDGE_RETURN_SECRET:-}
      HOOKJUDGE_AI_BASE_URL: ${JUDGE_AI_BASE_URL:-}
      HOOKJUDGE_AI_API_KEY: ${JUDGE_AI_API_KEY:-}
      HOOKJUDGE_AI_MODEL: ${JUDGE_AI_MODEL:-gpt-4o-mini}
    volumes:
      - judge-data:/data
    ports:
      - "127.0.0.1:8200:8200"

  hookrelay:
    image: ghcr.io/itswl/hookrelay:latest
    environment:
      HOOKRELAY_CONFIG: /etc/hookrelay/config.yaml
      HOOKRELAY_DB: /data/hookrelay.db
      INBOUND_SECRET: ${INBOUND_SECRET:-}
      JUDGE_INGEST_SECRET: ${JUDGE_INGEST_SECRET:-}
      JUDGE_RETURN_SECRET: ${JUDGE_RETURN_SECRET:-}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
    volumes:
      - ./relay.yaml:/etc/hookrelay/config.yaml:ro
      - relay-data:/data
    ports:
      - "127.0.0.1:8100:8100"

volumes:
  judge-data:
  relay-data:
