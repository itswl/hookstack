name: dependency review

# Every pull request gets a diff of what its dependency changes pull in —
# known vulnerabilities, licence moves, packages GitHub has already flagged.
# The component gates check that a service still works with its pinned set;
# this checks the change itself, across all four components' dependency
# graphs in one place, which no single component's lockfile diff shows.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
