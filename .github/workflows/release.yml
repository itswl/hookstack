name: release

# Images on tag push, and only then: `main` is a development line, a tag is a
# statement that the three gates were green together. Both architectures,
# because the reference deployment itself runs on arm64.
on:
  push:
    tags: ["v*"]
  # By hand, for a version whose tag already exists: the day the registry
  # refused a push for reasons that were not the code's (2026-09-15, a package
  # still owned by the repository this one replaced), re-running the tag's
  # workflow would have carried the same fault. This builds from the chosen
  # ref and stamps the version given; the tag stays where it is.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, with or without a leading v"
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Grouped but NOT cancel-in-progress: this is the one workflow that publishes.
# Cancelling a run mid-flight leaves whichever services already finished with a
# moved `:latest` and the rest pointing at the previous release — a split stack
# nobody asked for and nothing records. Two tags pushed close together queue and
# both finish, in order, which is the behaviour a registry wants.
concurrency:
  group: release-${{ github.ref }}

jobs:
  # The header's claim, made true. Nothing used to verify it: tags are cut by
  # hand, the per-service CI workflows are path-filtered so they may never have
  # run on the tagged commit at all, and a tag on a red commit published
  # `:latest` for all three services without a word. The gate was a sentence in
  # a comment, not a job.
  #
  # It delegates to each component's own scripts/gate.sh instead of repeating
  # the step lists. Those scripts ARE the CI replicas — each component's
  # test_gate_matches_ci pins its gate and its workflow to each other — and a
  # third copy of the list here would only be a third thing to drift.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Each service gates on the interpreter its own image ships, which is
        # why this carries a version per service rather than one for all three:
        # a gate that passes on a Python nobody deploys has proved less than it
        # looks like. Keep each entry equal to that service's Dockerfile FROM.
        include:
          - service: hookrelay
            python: "3.14"
          - service: hookjudge
            python: "3.14"
          - service: hookprobe
            python: "3.12"
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
      - run: python -m pip install --upgrade pip
      # Every tool the gate runs is pinned in the component's requirements.txt,
      # ruff included — so this install is the whole toolchain, at the versions
      # the component's own CI job uses.
      - run: pip install -r requirements.txt
      # PY has to be a path: the gate tests it with -x before running, and a
      # bare `python` would look like a missing venv and abort with setup advice.
      # Node is pre-installed on GitHub-hosted ubuntu runners, which is what the
      # gate's inline-page-JS step needs.
      - run: PY="$(command -v python)" bash scripts/gate.sh

  # The three checks no component gate covers — the docs links, the shared
  # design language, the agent notes. ci-stack.yml runs them on every push, but
  # "green on main last week" is not "green on this commit", and a tag is cut
  # from a commit.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: every relative link in the docs resolves
        run: python3 scripts/check-docs.py
      - name: the three pages share one design language
        run: python3 scripts/assert_design.py
      - name: agent notes keep their shape
        run: python3 scripts/assert_agent_notes.py

  images:
    needs: [gate, stack]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One package refusing a push must not cancel the other three: each
      # image is its own promise, and the failure that taught this was a
      # registry permission, not a build.
      fail-fast: false
      matrix:
        # The fourth image is the chat bridge (docs/bridge-protocol.md): the
        # sidecar that renders the pipe's card model for Feishu, as an app or
        # through a custom bot's webhook. It lives under deploy/, so the build
        # context is named per entry rather than assumed to be the service name.
        include:
          - { service: hookrelay,   context: hookrelay }
          - { service: hookjudge,   context: hookjudge }
          - { service: hookprobe,   context: hookprobe }
          - { service: lark-bridge, context: deploy/lark-bridge }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"
      # Only the immutable version tag here. `:latest` is moved by the promote
      # job below, once all four have succeeded — see the comment there.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # `:latest` moves for all four or for none of them.
  #
  # The matrix above publishes per service, so a failure in the third leg used to
  # leave the first two already pointing `:latest` at the new release and the
  # third at the old one — a split stack, and nothing anywhere recording that it
  # is split. The three components speak one wire contract to each other; half of
  # them being a version ahead is exactly the shape of problem that takes a day
  # to see. The version tags are immutable and land per leg, so a partial run
  # leaves them harmlessly published and nobody's `:latest` moved. The bridge is
  # in the same set: a pipe that speaks a newer protocol than the bridge it
  # ships beside is the same split, one hop further out.
  #
  # imagetools re-tags the existing multi-arch manifest — no rebuild, no pull,
  # and the digest `:latest` gains is the same one the version tag already has.
  promote:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"
      - name: move :latest to this release
        run: |
          for service in hookrelay hookjudge hookprobe lark-bridge; do
            repo="ghcr.io/${{ github.repository_owner }}/$service"
            docker buildx imagetools create \
              --tag "$repo:latest" "$repo:${{ steps.version.outputs.version }}"
          done
