name: ci-hookprobe

on:
  workflow_dispatch:
  pull_request:
    paths: ["hookprobe/**", ".github/workflows/ci-hookprobe.yml"]
  push:
    branches: [main]
    paths: ["hookprobe/**", ".github/workflows/ci-hookprobe.yml"]

permissions:
  contents: read

# One run per branch or PR at a time; a push supersedes the run it interrupted.
# Verification only, so a cancelled run costs an answer about a commit that is
# no longer the tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job: the suite is hermetic (fake engines only — no SDK subprocess, no
  # model calls, no network). hookprobe/scripts/gate.sh runs this exact list
  # locally.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hookprobe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The version this service SHIPS (Dockerfile: python:3.12-slim) —
          # deliberately behind its siblings' 3.14, because the image also
          # carries the Node runtime and the Claude Code CLI. Test what ships.
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q hookprobe tests
      - run: ruff check hookprobe tests
      - run: ruff format --check hookprobe tests
      - run: python -m mypy hookprobe
      - run: python -m bandit -q -r hookprobe
      - name: sessions page inline JS parses
        run: |
          node -e '
          const fs = require("fs");
          const m = fs.readFileSync("hookprobe/ui.html", "utf8").match(/<script>([\s\S]*)<\/script>/);
          if (!m) { console.error("no inline script"); process.exit(1); }
          new Function(m[1]);
          console.log("ui.html inline JS: OK");
          '
      - name: shell scripts parse
        run: find examples scripts -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - run: pytest -q
      - run: python -m pip_audit --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./hookprobe
          load: true
          tags: hookprobe-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # No model key on purpose: the contract must hold even when the engine
      # cannot — a run still ends in isFinal:true with a report naming the
      # failure. The 15s timeout clamp makes that deterministic.
      - name: the built image boots and completes the contract without a key
        run: |
          docker run -d --name probe -p 8088:8088 \
            -e HOOKPROBE_TOKEN=ci-token \
            -e HOOKPROBE_DEFAULT_TIMEOUT_SECONDS=15 \
            -e HOOKPROBE_MAX_TIMEOUT_SECONDS=15 \
            hookprobe-ci:latest
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8088/healthz > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8088/healthz
          # auth is enforced
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8088/hooks/agent \
            -H 'content-type: application/json' -d '{"message":"x","sessionKey":"ci:1"}')
          test "$code" = "401"
          # trigger, then the run must reach a final state on its own
          curl -sf -X POST http://127.0.0.1:8088/hooks/agent \
            -H 'Authorization: Bearer ci-token' -H 'content-type: application/json' \
            -d '{"message":"ci smoke","sessionKey":"ci:smoke-1"}' | tee /tmp/trigger.json
          grep -q '"runId"' /tmp/trigger.json
          for i in $(seq 1 40); do
            code=$(curl -s -o /tmp/final.json -w '%{http_code}' \
              -H 'Authorization: Bearer ci-token' http://127.0.0.1:8088/sessions/ci:smoke-1/final)
            [ "$code" = "200" ] && break
            sleep 1
          done
          test "$code" = "200"
          cat /tmp/final.json
          grep -q '"isFinal": *true' /tmp/final.json
          grep -q 'hookprobe run failed' /tmp/final.json
          # the sessions page is served
          curl -sf http://127.0.0.1:8088/ui | grep -q hookprobe
          docker logs probe | tail -20
