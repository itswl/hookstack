# Production shape: hookprobe as a read-only investigator on the docker
# network of the platform it serves, so any OpenClaw-dialect caller — the
# pipe's escalation route, a monitoring platform's deep-analysis leg — reaches
# it by DNS name (`hookprobe:8088`) without another hop. The external network
# name below is this deployment's actual network — set yours in the
# `networks:` block at the bottom.
#
#   cd /srv/hookstack
#   docker compose --env-file .env \
#     -f hookprobe/deploy/docker-compose.prod.yml up -d --build
#
# `--env-file .env` is not decoration: compose interpolates ${...} from the
# compose FILE's directory by default, and the ${HOOKPROBE_TOKEN:?} guard
# below must read the deployment root's .env instead.
#
# Paths follow the same rule as the pipe's prod file: the BUILD context is
# this service's directory, while `.env` and `probe-data/` are read from the
# deployment root two levels up. Skills, session transcripts and results are
# runtime state, not source — they must survive a source-tree reorganisation.
#
# Differences from deploy/docker-compose.yml (standalone), each deliberate:
#   - host port bound to 127.0.0.1 only: callers live on the docker network;
#     the binding exists so an ssh tunnel can reach the /ui operator console
#   - HOOKPROBE_TOKEN is required, not defaulted — a prod investigator that
#     silently starts without auth would take anyone's tasks. Model
#     credentials come from .env: ANTHROPIC_API_KEY, or the Anthropic-dialect
#     trio (ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN / model aliases)
#   - state is a bind mount at the deployment root, not a named volume, so
#     the accumulated runbooks and transcripts sit in plain sight for
#     backup and review

# Explicit, because compose otherwise derives the project name from the compose
# FILE's directory — `deploy`, which is also the pipe's prod file's directory.
# Two production deployments under one project name means a `down` or a `ps`
# meant for one of them answers for both.
name: hookprobe-prod

services:
  hookprobe:
    build:
      context: ..
    image: hookprobe:latest
    container_name: hookprobe
    # The agent executes arbitrary bash in here, so the container is treated
    # as hostile-by-default even though nothing hostile is expected: a runaway
    # analysis must not be able to take the host with it, and a compromised
    # run must find no privilege ladder. Measured before this existed: no
    # memory cap, no pid cap, full default capabilities.
    #   - mem_limit: the SDK CLI is a node process; 2g is roomy for one run
    #     plus subagents (a real investigation peaks well under 1g).
    #   - pids_limit: a fork bomb hits a wall at 512 instead of the host limit.
    #   - cap_drop ALL: an investigator only opens sockets and reads files;
    #     it never chowns, mounts, raw-sockets or ptraces. Costs `ping`
    #     (NET_RAW) — curl/nc cover reachability checks.
    #   - no-new-privileges: setuid binaries stop being an escalator.
    # The root filesystem stays writable: the CLI writes $HOME state and
    # /tmp caches, and /app is already read-only from the image. Credentials
    # remain the real boundary; this bounds the blast radius, not the intent.
    mem_limit: ${HOOKPROBE_MEM_LIMIT:-2g}
    pids_limit: 512
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ../../probe-data:/data
      # The read-only user skills layer. Point HOOKPROBE_USER_SKILLS at any
      # skills library (e.g. a repo's .claude/skills so skills version with
      # the service they drive); the default is an empty host dir so the
      # mount is inert until configured. Mount ONLY a skills subdir, never a
      # whole ~/.claude (credentials live there).
      - ${HOOKPROBE_USER_SKILLS:-../../probe-data/user-skills}:/data/home/.claude/skills:ro
      # Read-only credentials are the real security boundary — mount only
      # query-grade identities:
      # - ../../secrets/kubeconfig-readonly:/data/home/.kube/config:ro
      # MCP servers the agent may query (same shape as .mcp.json):
      # - ../../probe-mcp.json:/config/mcp.json:ro
    env_file:
      - ../../.env
    environment:
      HOOKPROBE_TOKEN: ${HOOKPROBE_TOKEN:?set HOOKPROBE_TOKEN in .env}
      HOOKPROBE_MODEL: ${HOOKPROBE_MODEL:-claude-opus-5}
      # The pipe's report door on the same network. Only runs that arrived
      # through /hooks/event ever deliver here; callers that poll /final
      # are unaffected.
      HOOKPROBE_RETURN_URL: ${HOOKPROBE_RETURN_URL:-http://hookrelay:8100/hook/probe-notify}
      HOOKPROBE_ESCALATE_LEVELS: ${HOOKPROBE_ESCALATE_LEVELS:-critical,high}
      # Production wants a ceiling: window spend >= budget refuses new
      # escalations, each refusal reporting itself to the channels. 0 = off.
      HOOKPROBE_BUDGET_USD: ${HOOKPROBE_BUDGET_USD:-}
      HOOKPROBE_BUDGET_WINDOW_HOURS: ${HOOKPROBE_BUDGET_WINDOW_HOURS:-}
      # Case files and transcripts older than this are pruned daily. 0 keeps
      # everything — the case files are the agent's episodic memory.
      HOOKPROBE_RETENTION_DAYS: ${HOOKPROBE_RETENTION_DAYS:-}
      # Skill layers: "project" (distilled, on the volume) is always on;
      # add "user" to also load a host library mounted at
      # /data/home/.claude/skills. HOOKPROBE_SKILLS pins the session's
      # skill list (comma names or "all") so a big library cannot flood it.
      HOOKPROBE_SETTING_SOURCES: ${HOOKPROBE_SETTING_SOURCES:-}
      HOOKPROBE_SKILLS: ${HOOKPROBE_SKILLS:-}
      # Operator methodology appended to the system prompt (a file path;
      # default: {workdir}/system-prompt.md when present). Named subagent
      # roles come from a JSON file (name -> {description, prompt, ...}).
      HOOKPROBE_SYSTEM_PROMPT_APPEND: ${HOOKPROBE_SYSTEM_PROMPT_APPEND:-}
      HOOKPROBE_AGENTS_CONFIG: ${HOOKPROBE_AGENTS_CONFIG:-}
      # Loop hygiene, all advisory (the boundary stays the bash guard):
      # nudge the agent after N identical calls, and cap how long any single
      # command may hang. 0 = off.
      HOOKPROBE_REPEAT_REMINDER_AT: ${HOOKPROBE_REPEAT_REMINDER_AT:-}
      HOOKPROBE_BASH_TIMEOUT_MS: ${HOOKPROBE_BASH_TIMEOUT_MS:-}
      HOOKPROBE_BASH_MAX_TIMEOUT_MS: ${HOOKPROBE_BASH_MAX_TIMEOUT_MS:-}
      # The learning loop: how many runbooks finished runs may leave behind for
      # later ones. 0 keeps it manual (draft, then an operator saves). Above 0
      # the service writes them itself — the agent's own tools still cannot
      # touch .claude/, which is what makes the automatic write a different act
      # from a run editing its own instructions.
      HOOKPROBE_AUTO_DISTILL_MAX: ${HOOKPROBE_AUTO_DISTILL_MAX:-}
      # Storm coalescing: a re-fire of the same alert joins the session that
      # already investigated it (follow-up turn) instead of funding a cold
      # start. Default 1800s; 0 = every fire is its own run.
      HOOKPROBE_COALESCE_WINDOW_SECONDS: ${HOOKPROBE_COALESCE_WINDOW_SECONDS:-}
      # Consolidation: at N cases a runbook buys one distillation run whose
      # draft waits for review as proposal.md. 0 = off.
      HOOKPROBE_CONSOLIDATE_AT: ${HOOKPROBE_CONSOLIDATE_AT:-}
      # Remediation executor gate: a file of full-match regexes, one per
      # line, deny-by-default. Unset = proposals collect, nothing runs.
      # Mount it read-only beside the other operator config.
      HOOKPROBE_REMEDIATION_ALLOWLIST: ${HOOKPROBE_REMEDIATION_ALLOWLIST:-}
      # Model-call telemetry. On by default and harmless when nothing is
      # listening — measured: with no endpoint a run finishes in the same time,
      # emits no retries and logs nothing. So the switch stays on and the only
      # decision left is where to send it: set OTEL_EXPORTER_OTLP_ENDPOINT when
      # you have a collector, and the data starts arriving with no restart of
      # anything else. What arrives per LLM call: claude_code.api_request
      # {model, input_tokens, output_tokens, cache_read_tokens,
      # cache_creation_tokens, cost_usd, duration_ms, session.id, prompt.id,
      # event.sequence}, plus assistant_response, tool_result, tool_decision,
      # hook_execution_*, mcp_server_connection, user_prompt, and the counters
      # token.usage / cost.usage / session.count / active_time.total.
      # NOTE the cost_usd it reports prices Claude models; on another provider
      # re-price from the raw token counts and the real model name.
      CLAUDE_CODE_ENABLE_TELEMETRY: ${CLAUDE_CODE_ENABLE_TELEMETRY:-1}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/json}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-}
      # Content redaction is the CLI's own (<REDACTED>), not this repository's,
      # and it is five independent switches. Measured on 2.1.229: responses=1
      # exposes the answers and leaves prompts redacted, while prompts=1 exposes
      # both. So the answers are on by default — they are what a report is judged
      # on, and their inputs are already kept upstream in the pipe's ledger —
      # while the inbound side, which carries the alert payload and whatever the
      # environment memory says, stays off until someone decides otherwise.
      OTEL_LOG_ASSISTANT_RESPONSES: ${OTEL_LOG_ASSISTANT_RESPONSES:-1}
      OTEL_LOG_USER_PROMPTS: ${OTEL_LOG_USER_PROMPTS:-1}
      OTEL_LOG_TOOL_DETAILS: ${OTEL_LOG_TOOL_DETAILS:-1}
      OTEL_LOG_TOOL_CONTENT: ${OTEL_LOG_TOOL_CONTENT:-1}
      # Off: it costs ~82% of the telemetry volume and, capped, cannot do the
      # one thing it is for. Every real call exceeds 60 KiB, so what arrives
      # is half a payload plus a truncation marker — the most expensive
      # signal here delivering the least reliable artifact. Turn it on
      # together with CLAUDE_CODE_OTEL_CONTENT_MAX_LENGTH when byte-exact
      # replay is actually the job, then turn it back off. ("0" disables it;
      # verified, not assumed — a truthy-string reading would have enabled it.)
      OTEL_LOG_RAW_API_BODIES: ${OTEL_LOG_RAW_API_BODIES:-0}
      # Raw bodies are capped at 60 KiB by the CLI, which says so in the value
      # it sends ("[TRUNCATED - Content exceeds 60KB limit]") rather than losing
      # it silently — body_length still reports the true size, so the loss is
      # measurable. Every real investigation exceeds it: a single call here
      # carries ~113 KB once the conversation and the tool schemas are in it.
      # This lifts the cap (verified: 113426 declared, 113425 received, valid
      # JSON to the closing brace). Left unset on purpose — with all five
      # content switches already on, uncapping as well would push the entire
      # conversation on every call unconditionally. Set it when you actually
      # want byte-exact replay of what the model saw.
      CLAUDE_CODE_OTEL_CONTENT_MAX_LENGTH: ${CLAUDE_CODE_OTEL_CONTENT_MAX_LENGTH:-}
      # Direct self-alarm when report returns exhaust their retries:
      HOOKPROBE_ALARM_URL: ${HOOKPROBE_ALARM_URL:-}
      HOOKPROBE_ALARM_MIN_INTERVAL_SECONDS: ${HOOKPROBE_ALARM_MIN_INTERVAL_SECONDS:-}
      # Set BOTH in production — this network is shared with the platform.
      # Unsigned, the event door takes anyone's escalations and anyone can
      # impersonate the investigator's reports. One line of .env each.
      HOOKPROBE_EVENT_SECRET: ${HOOKPROBE_EVENT_SECRET:-}
      HOOKPROBE_RETURN_SECRET: ${HOOKPROBE_RETURN_SECRET:-}
      # Where a retrospective condition ruling goes, and the credential for
      # that one door. Both empty means the feature is off: a patrol that
      # rules gets its markers stripped and nothing is sent.
      HOOKPROBE_RULING_URL: ${HOOKPROBE_RULING_URL:-}
      HOOKPROBE_RULING_SECRET: ${HOOKPROBE_RULING_SECRET:-}
      # MCP servers config (three dialects accepted; env values are
      # secrets — keep the file mounted ro or on the volume):
      HOOKPROBE_MCP_CONFIG: ${HOOKPROBE_MCP_CONFIG:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      # Any Anthropic-dialect provider: map the engine's model aliases here.
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${ANTHROPIC_DEFAULT_SONNET_MODEL:-}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${ANTHROPIC_DEFAULT_OPUS_MODEL:-}
      CLAUDE_CODE_SUBAGENT_MODEL: ${CLAUDE_CODE_SUBAGENT_MODEL:-}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-}
    restart: unless-stopped

networks:
  default:
    # The family's own wire, owned by the platform's app compose (WW creates
    # it on `up`; the exact services that talk to the gateway join it). The
    # investigator used to sit on the platform's main network, where it
    # could open sockets to postgres and redis — the agent runs arbitrary
    # bash, and the only boundary was the absence of a password.
    name: hookstack_net
    external: true
