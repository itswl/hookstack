<!doctype html>
<!-- The sessions page: list, read, and continue investigations from a browser.
     One file, no build step, no external assets. Served unauthenticated; every
     API call it makes carries the bearer token you paste top-right. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hookprobe · sessions</title>
<style>
  /* ── hookstack design tokens · keep this block identical in all three pages ── */
  :root {
    --bg: #0b0e14; --surface: #11151d; --border: #1f2530; --border-soft: #171c26;
    --text: #d7dde6; --muted: #8b94a3; --accent: #4c8dff;
    --ok: #3dd68c; --warn: #f5a524; --bad: #e5484d;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    /* "PingFang SC" stays in the stack: alert titles arrive in whatever language
       the monitoring system speaks, and they are rendered here verbatim. */
    --ui: 14px/1.55 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
  }
  .rc { display: flex; gap: 6px; align-items: center; }
  .rc button, .rc select { background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 12px;
    cursor: pointer; }
  .rc button:hover, .rc select:hover { border-color: var(--accent); }
  /* ── end design tokens ────────────────────────────────────────────────────── */
  /* This page's older token names, aliased onto the shared set above. */
  :root {
    --panel: var(--surface); --line: var(--border); --dim: var(--muted);
    --green: var(--ok); --amber: var(--warn); --red: var(--bad);
  }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;
     font:var(--ui)}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:600}
header h1 span{color:var(--dim);font-weight:400}
#token{margin-left:auto;background:var(--bg);border:1px solid var(--line);color:var(--text);
       border-radius:6px;padding:5px 8px;width:230px;font-family:var(--mono);font-size:12px}
#token.bad{border-color:var(--red)}
#stamp{font-size:11px;color:var(--dim);font-family:var(--mono);white-space:nowrap}
#budget{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:3px 8px;white-space:nowrap}
#budget.hot{color:var(--red);border-color:var(--red)}
button{background:#21262d;border:1px solid #30363d;color:var(--text);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
button:disabled{opacity:.45;cursor:default}
main{flex:1;display:flex;min-height:0}
aside{width:330px;border-right:1px solid var(--line);background:var(--panel);flex-shrink:0;display:flex;flex-direction:column}
#q{margin:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);
   padding:5px 9px;font-size:12px}
#q:focus{outline:none;border-color:var(--accent)}
#list{flex:1;overflow-y:auto}
.item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;border-left:2px solid transparent}
.item:hover{background:#1c2128}
.item.sel{background:#152238;border-left-color:var(--accent)}
.item .key{font-family:var(--mono);font-size:12px;color:var(--accent);word-break:break-all}
.item .title{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.item .meta{display:flex;gap:8px;font-size:11px;color:var(--dim);margin-top:4px;align-items:center;flex-wrap:wrap}
.badge{padding:0 7px;border-radius:10px;font-size:11px;border:1px solid currentColor}
.flag{padding:0 6px;border-radius:9px;font-size:10px;border:1px solid var(--line);color:var(--dim);font-family:var(--mono)}
.flag.sent{color:var(--green);border-color:var(--green)}
.flag.retfail{color:var(--red);border-color:var(--red)}
.kv-grid{display:grid;grid-template-columns:230px 1fr;gap:5px 16px;font-size:12.5px;margin:6px 0 18px}
.kv-grid .k{color:var(--dim);font-family:var(--mono);font-size:12px}
.kv-grid .v{font-family:var(--mono);font-size:12px;word-break:break-all}
.subhead{color:var(--text);font-size:13px;font-weight:600;margin:14px 0 6px}
.audit-bar{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.audit-bar input{background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:5px 9px;font-size:12px;width:280px}
.audit-row{display:flex;gap:10px;font-family:var(--mono);font-size:11.5px;padding:3px 0;border-bottom:1px solid #161b22;align-items:baseline}
.audit-row .ts{color:var(--dim);flex-shrink:0}
.audit-row .a-session{color:var(--accent);flex-shrink:0;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.audit-row .a-tool{color:var(--amber);flex-shrink:0;min-width:70px}
.audit-row .a-detail{color:var(--text);word-break:break-all}
.audit-row.err .a-tool{color:var(--red)}
.help{max-width:860px;font-size:13.5px;line-height:1.65}
.help h2{font-size:15px;margin:20px 0 8px;color:var(--text)}
.help h2:first-child{margin-top:0}
.help p{margin:6px 0;color:var(--text)}
.help .dim{color:var(--dim)}
.help table{border-collapse:collapse;margin:8px 0;width:100%}
.help th,.help td{border:1px solid var(--line);padding:6px 10px;text-align:left;font-size:12.5px;vertical-align:top}
.help th{color:var(--dim);font-weight:600;background:var(--panel)}
.help code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:12px}
.help pre{background:#0b0f14;border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.5}
.help li{margin:3px 0}
.badge.running{color:var(--amber)}
.badge.completed{color:var(--green)}
.badge.failed{color:var(--red)}
section{flex:1;display:flex;flex-direction:column;min-width:0}
#meta{padding:8px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);
      font-family:var(--mono);min-height:36px;word-break:break-all}
#turns{flex:1;overflow-y:auto;padding:16px}
.turn{margin-bottom:20px}
.q,details.q{background:#152238;border:1px solid #1f3a5f;border-radius:8px;padding:8px 12px;margin-bottom:8px;
   white-space:pre-wrap;word-break:break-word;font-size:13px}
details.q summary{cursor:pointer;color:var(--dim);white-space:normal}
.a pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;
       white-space:pre-wrap;word-break:break-word;margin:0;font-family:var(--mono);font-size:12.5px}
.a.err pre{border-color:var(--red)}
.stats{color:var(--dim);font-size:11px;font-family:var(--mono);margin-top:5px;padding-left:2px}
.proc{border-left:2px solid var(--line);margin:6px 0 8px 6px;padding-left:10px}
.ev{font-family:var(--mono);font-size:11.5px;color:var(--dim);padding:2px 0;word-break:break-all}
.ev-tool{color:var(--accent);margin-right:8px}
.ev-narr{font-family:inherit;font-style:italic;color:#9daebe;white-space:pre-wrap}
details.proc-past{margin:6px 0 8px 6px}
details.proc-past summary{cursor:pointer;color:var(--dim);font-size:12px}
.skill{padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;cursor:pointer;background:var(--panel)}
.skill:hover{border-color:var(--accent)}
.skill-name{color:var(--accent);font-family:var(--mono);font-size:13px}
.skill-desc{font-size:13px;margin-top:3px}
.skill-meta{color:var(--dim);font-size:11px;margin-top:5px;font-family:var(--mono)}
.skill-back{color:var(--accent);cursor:pointer;margin-bottom:10px;font-size:13px}
.skill-layer{font-size:10px;border:1px solid var(--line);border-radius:8px;padding:1px 6px;color:var(--dim);margin-left:8px;font-family:var(--mono)}
.skill-layer.user{color:var(--accent);border-color:var(--accent)}
.skill-bar{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.skill-bar .spacer{flex:1}
.skill-bar .skill-back{margin-bottom:0}
.skill-note{color:var(--dim);font-size:11px}
button.danger{color:var(--red);border-color:var(--red)}
#skillSrc{width:100%;min-height:420px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-family:var(--mono);font-size:12.5px;padding:12px;line-height:1.55}
#skillSrc:focus{outline:none;border-color:var(--accent)}
.ev-todos{font-family:inherit;padding:4px 0}
.ev-todos div{padding:1px 0;color:var(--text);font-size:12.5px}
.ev-todos .todo-done{color:var(--dim);text-decoration:line-through}
.ev-todos .todo-active{color:var(--amber)}
#stopBtn{border-color:var(--red);color:var(--red)}
#memEdit{width:100%;min-height:420px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-family:var(--mono);font-size:12.5px;padding:12px;resize:vertical;box-sizing:border-box}
#memEdit:focus{outline:none;border-color:var(--accent)}
.mem-tip{color:var(--dim);font-size:12px;margin-bottom:10px}
.mem-bar{margin-top:10px;display:flex;gap:12px;align-items:center}
#memStatus{color:var(--green);font-size:12px}
.md{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  font-size:13.5px;line-height:1.65;word-break:break-word}
.a.err .md{border-color:var(--red)}
.md h1,.md h2,.md h3,.md h4{margin:12px 0 6px;line-height:1.3}
.md h1{font-size:16px}.md h2{font-size:15px}.md h3,.md h4{font-size:14px}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:24px}
.md li{margin:2px 0}
.md code{background:#22282f;border:1px solid var(--line);border-radius:4px;padding:0 4px;
  font-family:var(--mono);font-size:12px}
.md pre.code{background:#0b0f14;border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;
  white-space:pre-wrap;word-break:break-word;margin:8px 0}
.md pre.code code{background:none;border:none;padding:0;font-size:12px}
.md table{border-collapse:collapse;margin:8px 0;font-size:12.5px}
.md th,.md td{border:1px solid var(--line);padding:4px 10px;text-align:left}
.md th{background:#1a2027}
.md a{color:var(--accent)}
.pending{color:var(--amber);padding:8px 12px;font-size:13px}
.pending::after{content:"…";animation:dots 1.2s steps(3,end) infinite}
@keyframes dots{0%{content:""}33%{content:"."}66%{content:".."}100%{content:"..."}}
#hint{padding:0 16px 6px;font-size:12px;color:var(--red);min-height:18px}
#composer{display:flex;gap:8px;padding:0 16px 14px}
#msg{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);
     padding:8px 10px;resize:vertical;min-height:46px;font:inherit}
#msg:focus{outline:none;border-color:var(--accent)}
.empty{color:var(--dim);padding:26px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>hookprobe <span>· sessions</span></h1>
  <button id="new">+ new session</button>
  <button id="skillsBtn">skills</button>
  <button id="agentsBtn">agents</button>
  <button id="memBtn">memory</button>
  <button id="promptBtn">prompt</button>
  <button id="sysBtn">system</button>
  <button id="auditBtn">audit</button>
  <button id="helpBtn">help</button>
  <span id="budget" hidden></span>
  <span class="stamp" id="stamp"></span>
  <span class="rc">
    <button id="rNow" title="refresh now">&#8635;</button>
    <select id="rEvery" title="auto refresh">
      <option value="0">manual</option>
      <option value="15000">15s</option>
      <option value="60000">60s</option>
      <option value="300000">5m</option>
    </select>
  </span>
  <input id="token" placeholder="bearer token" autocomplete="off">
</header>
<main>
  <aside>
    <input id="q" placeholder="filter sessions…" autocomplete="off">
    <div id="list"><div class="empty">loading…</div></div>
  </aside>
  <section>
    <div id="meta"></div>
    <div id="turns"><div class="empty">select a session on the left, or start a new one</div></div>
    <div id="hint"></div>
    <form id="composer">
      <textarea id="msg" placeholder="new session: describe what to investigate… (Ctrl/⌘+Enter to send)"></textarea>
      <button id="stopBtn" type="button" style="display:none">Stop</button>
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </section>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
let sel = null;
let composeMode = false; // "+ new session" pressed: keep the pane free until they send
let viewMode = "sessions"; // or "skills"

const tokenEl = $("#token");
tokenEl.value = localStorage.getItem("hookprobe_token") || "";
tokenEl.addEventListener("change", () => {
  localStorage.setItem("hookprobe_token", tokenEl.value.trim());
  tokenEl.classList.remove("bad");
  refreshList();
});

async function api(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  const t = tokenEl.value.trim();
  if (t) headers["Authorization"] = "Bearer " + t;
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) {
    tokenEl.classList.add("bad");
    throw new Error("unauthorized — paste the bearer token (top right)");
  }
  return r;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
function pretty(t) {
  try { return JSON.stringify(JSON.parse(t), null, 2); } catch { return t; }
}

// --- tiny escape-first markdown renderer ---------------------------------
// Everything is HTML-escaped up front; the only tags in the output are the
// ones these transforms construct, and link hrefs must be http(s).
function mdInline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdToHtml(src) {
  let text = esc(src || "");
  const fences = [];
  text = text.replace(/```[^\n]*\n?([\s\S]*?)```/g, (_, body) => {
    fences.push(body);
    return "" + (fences.length - 1) + "";
  });
  const out = [];
  let list = null;
  let para = [];
  let tbl = [];
  const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
  const flushPara = () => {
    if (para.length) { out.push("<p>" + para.map(mdInline).join("<br>") + "</p>"); para = []; }
  };
  const flushTable = () => {
    if (!tbl.length) return;
    const rows = tbl;
    tbl = [];
    const cells = (r) => r.replace(/^\|/, "").replace(/\|\s*$/, "").split("|").map((c) => mdInline(c.trim()));
    if (rows.length >= 2 && /^[\s|:\-]+$/.test(rows[1])) {
      const head = cells(rows[0]);
      const body = rows.slice(2).map(cells);
      out.push(
        "<table><thead><tr>" + head.map((h) => "<th>" + h + "</th>").join("") + "</tr></thead><tbody>" +
        body.map((r) => "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>").join("") +
        "</tbody></table>",
      );
    } else {
      para.push(...rows);
      flushPara();
    }
  };
  for (const line of text.split("\n")) {
    if (/^\d+\s*$/.test(line)) { flushPara(); flushTable(); closeList(); out.push(line.trim()); continue; }
    if (/^\s*\|/.test(line)) { flushPara(); closeList(); tbl.push(line.trim()); continue; }
    flushTable();
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { flushPara(); closeList(); out.push(`<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`); continue; }
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    if (ul) { flushPara(); if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; } out.push("<li>" + mdInline(ul[1]) + "</li>"); continue; }
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ol) { flushPara(); if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; } out.push("<li>" + mdInline(ol[1]) + "</li>"); continue; }
    if (!line.trim()) { flushPara(); closeList(); continue; }
    closeList();
    para.push(line);
  }
  flushPara(); flushTable(); closeList();
  const html = out.join("\n").replace(/(\d+)/g, (_, i) => '<pre class="code"><code>' + fences[Number(i)] + "</code></pre>");
  return '<div class="md">' + html + "</div>";
}
function answerHtml(text) {
  const raw = text || "";
  try { JSON.parse(raw); return `<pre>${esc(pretty(raw))}</pre>`; } catch { /* not JSON */ }
  return mdToHtml(raw);
}
function fmtTime(ts) { return ts ? new Date(ts * 1000).toLocaleString() : ""; }

function returnFlag(x) {
  if (x.origin !== "relay") return "";
  if ((x.return_status || "").startsWith("failed")) return '<span class="flag retfail">return failed</span>';
  if (x.return_status === "sent") return '<span class="flag sent">returned</span>';
  return '<span class="flag">relay</span>';
}

async function refreshList() {
  try {
    let runs = await (await api("/v1/runs")).json();
    const q = ($("#q").value || "").toLowerCase();
    if (q) runs = runs.filter((x) => (x.session_key + " " + (x.title || "")).toLowerCase().includes(q));
    const el = $("#list");
    if (!runs.length) { el.innerHTML = `<div class="empty">${q ? "no sessions match" : "no sessions yet"}</div>`; return; }
    el.innerHTML = runs.map((x) => `
      <div class="item ${x.session_key === sel ? "sel" : ""}" data-key="${esc(x.session_key)}">
        <div class="key">${esc(x.session_key)}</div>
        <div class="title">${esc(x.title || "")}</div>
        <div class="meta">
          <span class="badge ${esc(x.status)}">${esc(x.status)}</span>
          ${returnFlag(x)}
          <span>${x.turn_count} turn${x.turn_count > 1 ? "s" : ""}</span>
          ${x.model ? `<span>${esc(String(x.model).replace(/^claude-/, ""))}</span>` : ""}
          ${x.cost_usd ? `<span>$${Number(x.cost_usd).toFixed(3)}</span>` : ""}
          <span>${fmtTime(x.created_at)}</span>
        </div>
      </div>`).join("");
    el.querySelectorAll(".item").forEach((n) => (n.onclick = () => select(n.dataset.key)));
    // Land on the latest investigation, but never steal the pane from a
    // deliberate "+ new session" or the skills browser.
    if (!sel && !composeMode && viewMode === "sessions" && runs.length) select(runs[0].session_key);
  } catch (e) { $("#hint").textContent = e.message; }
}

async function select(key) {
  stopWatching();          // the previous session's feed is no longer on screen
  sel = key;
  composeMode = false;
  sessionsMode();
  $("#hint").textContent = "";
  refreshList();
  await renderDetail(true);
}

function sessionsMode() {
  viewMode = "sessions";
  $("#composer").style.display = "";
}

function qHtml(m) {
  if (!m) return "";
  if (m.length > 400) {
    return `<details class="q"><summary>${esc(m.slice(0, 180))}…</summary>${esc(m)}</details>`;
  }
  return `<div class="q">${esc(m)}</div>`;
}
function fmtTok(n) {
  n = Number(n) || 0;
  return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(n);
}
function modelLabel(mu) {
  // The engine bills every model that ran, including tiny helpers (session
  // titles run on haiku). Lead with the model that did the work, fold the
  // helpers in as aux with their own bill so the split is obvious.
  const entries = Object.entries(mu || {}).map(([name, v]) => ({
    name: name.replace(/^claude-/, "").replace(/-\d{8}$/, ""),
    cost: Number((v || {}).costUSD ?? (v || {}).cost_usd ?? 0),
    out: Number((v || {}).outputTokens ?? (v || {}).output_tokens ?? 0),
  }));
  if (!entries.length) return "";
  entries.sort((a, b) => b.cost - a.cost || b.out - a.out);
  const aux = entries.slice(1).map((e) => (e.cost ? `${e.name} $${e.cost.toFixed(4)}` : e.name));
  return entries[0].name + (aux.length ? ` (aux: ${aux.join(", ")})` : "");
}
function statsHtml(t) {
  const u = t.usage || {};
  const pick = (a, b) => (u[a] != null ? u[a] : u[b]); // engine reports snake_case; tolerate camelCase
  const bits = [];
  const label = modelLabel(t.model_usage);
  if (label) bits.push(label);
  const tin = pick("input_tokens", "inputTokens"), tout = pick("output_tokens", "outputTokens");
  const cr = pick("cache_read_input_tokens", "cacheReadInputTokens");
  const cw = pick("cache_creation_input_tokens", "cacheCreationInputTokens");
  if (tin != null) bits.push(`in ${fmtTok(tin)}`);
  if (tout != null) bits.push(`out ${fmtTok(tout)}`);
  if (cr != null || cw != null) bits.push(`cache ${fmtTok(cr)}r/${fmtTok(cw)}w`);
  if (t.cost_usd != null) bits.push(`$${Number(t.cost_usd).toFixed(4)}`);
  if (t.duration_ms != null) bits.push(`${(t.duration_ms / 1000).toFixed(1)}s`);
  return bits.length ? `<div class="stats">${esc(bits.join("  ·  "))}</div>` : "";
}
function eventHtml(e) {
  if (e.type === "tool_use") {
    if (e.name === "TodoWrite" && Array.isArray(e.todos)) {
      const mark = { completed: "☑", in_progress: "◐", pending: "☐" };
      const cls = { completed: "todo-done", in_progress: "todo-active", pending: "" };
      return `<div class="ev ev-todos">${e.todos
        .map((t) => `<div class="${cls[t.status] || ""}">${mark[t.status] || "☐"} ${esc(t.content)}</div>`)
        .join("")}</div>`;
    }
    return `<div class="ev"><span class="ev-tool">${esc(e.name)}</span>${esc(e.detail || "")}</div>`;
  }
  if (e.type === "text") return `<div class="ev ev-narr">${esc(e.text)}</div>`;
  return "";
}
// What the model was actually given. The prompt is assembled from files on a
// mutable volume, so the record of which ones were in force is the only way to
// explain a report later.
function inputsHtml(inputs) {
  const i = inputs || {};
  if (!i.model) return "";
  const fact = (f) => (f ? `${f.sha256} · ${f.bytes}B` : "none");
  const layer = (names) => (names && names.length ? names.join(", ") : "none");
  const rows = [
    ["model", i.model + (i.resumed ? " · resumed" : "")],
    ["skills", `filter ${i.skills?.filter ?? "—"}` +
      (i.skills?.project ? ` · project: ${layer(i.skills.project)}` : "") +
      (i.skills?.user ? ` · host: ${layer(i.skills.user)}` : "")],
    ["roles", `files: ${layer(i.agents?.files)} · config: ${layer(i.agents?.config)}`],
    ["mcp", layer(i.mcp_servers)],
    ["memory", fact(i.memory)],
    ["prompt append", fact(i.system_prompt_append)],
  ];
  return `<details class="proc-past"><summary>inputs · what the model was given</summary>
    <div class="proc">${rows
      .map(([k, v]) => `<div class="ev"><span class="ev-tool">${esc(k)}</span>${esc(String(v))}</div>`)
      .join("")}</div></details>`;
}
function turnHtml(t) {
  const evs = t.events || [];
  const proc = evs.length
    ? `<details class="proc-past"><summary>process · ${evs.length} steps</summary>
         <div class="proc">${evs.map(eventHtml).join("")}</div></details>`
    : "";
  return `<div class="turn">${qHtml(t.message)}${inputsHtml(t.inputs)}${proc}
    <div class="a ${t.error ? "err" : ""}">${answerHtml(t.text)}</div>${statsHtml(t)}</div>`;
}

// The open run's steps, pushed rather than polled. The shared refresh control
// owns the only clock on this page and defaults to a minute, which is right for
// a board and wrong for the seconds after you press send — so a run in flight
// is watched over a streaming response instead of by a second timer.
//
// fetch + ReadableStream, not EventSource: every call here carries the bearer
// token as a header, and EventSource cannot send headers.
let liveAbort = null;
async function watchRun(key) {
  stopWatching();
  const controller = new AbortController();
  liveAbort = controller;
  let response;
  try {
    response = await api("/v1/runs/" + encodeURIComponent(key) + "/stream", { signal: controller.signal });
    if (!response.ok || !response.body) return;
  } catch { return; }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffered = "";
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffered += decoder.decode(value, { stream: true });
      const lines = buffered.split("\n");
      buffered = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        let msg;
        try { msg = JSON.parse(line); } catch { continue; }
        if (key !== sel) return;                      // the operator moved on
        if (msg.type === "ping") continue;
        if (msg.type === "snapshot") { liveReplace(msg.events || []); continue; }
        if (msg.type === "done") { await renderDetail(false); return; }
        liveAppend(msg);
      }
    }
  } catch {
    // A dropped stream is not an error worth showing: the refresh control still
    // brings the run's state in, just later.
  } finally {
    if (liveAbort === controller) liveAbort = null;
  }
}
function stopWatching() {
  if (liveAbort) { liveAbort.abort(); liveAbort = null; }
}
function liveFeedNode() {
  return document.querySelector("#turns .turn:last-child .proc");
}
function liveReplace(events) {
  const node = liveFeedNode();
  if (node) node.innerHTML = events.map(eventHtml).join("");
  $("#turns").scrollTop = $("#turns").scrollHeight;
}
function liveAppend(event) {
  const node = liveFeedNode();
  if (!node) return;
  node.insertAdjacentHTML("beforeend", eventHtml(event));
  $("#turns").scrollTop = $("#turns").scrollHeight;
}

async function renderDetail(startPolling) {
  if (!sel) return null;
  const r = await api("/v1/runs/" + encodeURIComponent(sel));
  if (r.status === 404) {
    $("#turns").innerHTML = '<div class="empty">session not found (in-flight run lost to a restart?)</div>';
    return null;
  }
  const run = await r.json();
  $("#meta").textContent =
    `${run.session_key} · ${run.status}` +
    (run.model ? ` · ${run.model}` : "") +
    ` · engine session ${run.engine_session_id || "—"}` +
    (run.error ? ` · ${run.error}` : "");
  const parts = (run.turns || []).map(turnHtml);
  if (run.status === "running") {
    const live = (run.events || []).map(eventHtml).join("");
    parts.push(
      `<div class="turn">${qHtml(run.current_message)}${inputsHtml(run.inputs)}` +
      `<div class="proc">${live}</div>` +
      `<div class="pending">investigating</div></div>`,
    );
  }
  $("#turns").innerHTML = parts.join("") || '<div class="empty">no turns yet</div>';
  $("#turns").scrollTop = $("#turns").scrollHeight;
  $("#send").disabled = run.status === "running";
  $("#stopBtn").style.display = run.status === "running" ? "" : "none";
  $("#msg").placeholder = run.status === "running"
    ? "a turn is in flight…"
    : "follow-up in this session… (Ctrl/⌘+Enter to send)";
  // Watch while it runs, let go the moment it settles.
  if (run.status === "running") { if (!liveAbort) watchRun(run.session_key); }
  else stopWatching();
  return run;
}

$("#stopBtn").onclick = async () => {
  if (!sel) return;
  try {
    const r = await api("/sessions/" + encodeURIComponent(sel) + "/stop", { method: "POST" });
    if (!r.ok && r.status !== 409) {
      throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
    }
    $("#hint").textContent = "stopping…";
  } catch (e) { $("#hint").textContent = e.message; }
};

function leaveSessions(mode) {
  stopWatching();
  viewMode = mode;
  sel = null;
  composeMode = false;
  $("#composer").style.display = "none";
  $("#stopBtn").style.display = "none";
  $("#hint").textContent = "";
  refreshList();
}

async function openMemory() {

async function renderSkills() {
  try {
    const skills = await (await api("/v1/skills")).json();
    const proj = skills.filter((s) => s.layer === "project").length;
    const host = skills.length - proj;
    $("#meta").textContent = `runbooks · ${proj} project${host ? ` + ${host} host (read-only)` : ""} · {workdir}/.claude/skills`;
    if (!skills.length) {
      $("#turns").innerHTML =
        '<div class="empty">no skills yet — when an investigation verifies a reusable diagnostic path, it distills a SKILL.md runbook here, and later runs load it automatically</div>';
      return;
    }
    $("#turns").innerHTML = skills.map((s) => `
      <div class="skill" data-name="${esc(s.name)}">
        <div class="skill-name">${esc(s.name)}<span class="skill-layer ${esc(s.layer || "project")}">${esc(s.layer || "project")}</span></div>
        <div class="skill-desc">${esc(s.description || "(no description)")}</div>
        <div class="skill-meta">${esc((s.files || []).join("  "))} · ${fmtTime(s.modified)}</div>
      </div>`).join("");
    $("#turns").scrollTop = 0;
    $("#turns").querySelectorAll(".skill").forEach((n) => (n.onclick = () => renderSkill(n.dataset.name)));
  } catch (e) { $("#hint").textContent = e.message; }

async function renderSkill(name) {
  const r = await api("/v1/skills/" + encodeURIComponent(name));
  if (!r.ok) { $("#hint").textContent = "skill not found"; return; }
  const s = await r.json();
  const layer = s.layer || "project";
  $("#meta").textContent = `skill · ${name}/SKILL.md · ${layer} layer`;
  const body = (s.content || "").replace(/^---[\s\S]*?\n---\n/, ""); // frontmatter is for machines
  const note = layer === "user"
    ? '<span class="skill-note">host library, read-only — saving stores a project copy that shadows it</span>'
    : "";
  $("#turns").innerHTML =
    `<div class="skill-bar"><span class="skill-back">← all skills</span><span class="spacer"></span>${note}` +
    `<button id="skillEdit">edit</button>` +
    (layer === "project" ? '<button id="skillDelete" class="danger">delete</button>' : "") +
    `</div>` + mdToHtml(body);
  $("#turns").scrollTop = 0;
  $("#turns").querySelector(".skill-back").onclick = () => renderSkills();
  $("#skillEdit").onclick = () => editSkill(name, s.content || "");
  const del = $("#skillDelete");
  if (del) del.onclick = async () => {
    if (!confirm(`delete skill "${name}"? (a same-named host skill would resurface)`)) return;
    const resp = await api("/v1/skills/" + encodeURIComponent(name), { method: "DELETE" });
    if (resp.ok) renderSkills();
    else $("#hint").textContent = "delete failed (" + resp.status + ")";
  };
}

function editSkill(name, content) {
  $("#meta").textContent = `skill · ${name}/SKILL.md · editing (saves to the project layer)`;
  $("#turns").innerHTML = `
    <div class="skill-bar"><span class="skill-back">← cancel</span></div>
    <textarea id="skillSrc" spellcheck="false"></textarea>
    <div class="mem-bar"><button id="skillSave" class="primary">Save</button><span id="skillStatus"></span></div>`;
  $("#skillSrc").value = content;
  $("#turns").querySelector(".skill-back").onclick = () => renderSkill(name);
  $("#skillSave").onclick = async () => {
    try {
      const r = await api("/v1/skills/" + encodeURIComponent(name), {
        method: "PUT",
        body: JSON.stringify({ content: $("#skillSrc").value }),
      });
      if (r.ok) { renderSkill(name); return; }
      $("#skillStatus").textContent = "save failed (" + r.status + ")";
    } catch (e) { $("#skillStatus").textContent = e.message; }
  };
}

async function openAgents() {

}

async function renderAgents() {
  try {
    const agents = await (await api("/v1/agents")).json();
    $("#meta").textContent = `subagent roles · ${agents.length} agent${agents.length === 1 ? "" : "s"} · .claude/agents + HOOKPROBE_AGENTS_CONFIG`;
    if (!agents.length) {
      $("#turns").innerHTML =
        '<div class="empty">no agents yet — drop .claude/agents/*.md on the volume, mount a host library, or pin roles via HOOKPROBE_AGENTS_CONFIG. The main agent delegates to them through the Task tool.</div>';
      return;
    }
    $("#turns").innerHTML = `
      <div class="mem-tip">During an investigation the main agent delegates subtasks to these
      roles through the Task tool. Each role is one .claude/agents/*.md file — frontmatter sets
      name/description/tools, the body is its prompt. Open one to read, edit or delete it; changes
      apply to the next run. The three defaults are seeded examples: copy one to make your own.</div>` +
      agents.map((a) => `
      <div class="skill" data-name="${esc(a.name)}">
        <div class="skill-name">${esc(a.name)}<span class="skill-layer ${esc(a.source)}">${esc(a.source)}</span></div>
        <div class="skill-desc">${esc(a.description || "(no description)")}</div>

    $("#turns").scrollTop = 0;

async function renderAgent(name) {
  const r = await api("/v1/agents/" + encodeURIComponent(name));
  if (!r.ok) { $("#hint").textContent = "agent not found"; return; }
  const a = await r.json();
  $("#meta").textContent = `agent · ${name} · ${a.source}`;
  const note = a.source === "user"
    ? '<span class="skill-note">host library, read-only — saving stores a project copy that shadows it</span>'
    : a.source === "config"
      ? '<span class="skill-note">pinned by HOOKPROBE_AGENTS_CONFIG — edit the config file</span>'
      : "";
  const body = a.source === "config"
    ? '<div class="md"><pre class="code"><code>' + esc(a.content) + "</code></pre></div>"
    : mdToHtml((a.content || "").replace(/^---[\s\S]*?\n---\n/, ""));
  $("#turns").innerHTML =
    `<div class="skill-bar"><span class="skill-back">← all agents</span><span class="spacer"></span>${note}` +
    (a.source !== "config" ? '<button id="agentEdit">edit</button>' : "") +
    (a.source === "project" ? '<button id="agentDelete" class="danger">delete</button>' : "") +
    `</div>` + body;
  $("#turns").scrollTop = 0;
  $("#turns").querySelector(".skill-back").onclick = () => renderAgents();
  const ed = $("#agentEdit");
  if (ed) ed.onclick = () => editAgent(name, a.content || "");
  const del = $("#agentDelete");
  if (del) del.onclick = async () => {
    if (!confirm(`delete agent "${name}"?`)) return;
    const resp = await api("/v1/agents/" + encodeURIComponent(name), { method: "DELETE" });
    if (resp.ok) renderAgents();
    else $("#hint").textContent = "delete failed (" + resp.status + ")";
  };
}

function editAgent(name, content) {
  $("#meta").textContent = `agent · ${name}.md · editing (saves to the project layer)`;
  $("#turns").innerHTML = `
    <div class="skill-bar"><span class="skill-back">← cancel</span></div>
    <textarea id="skillSrc" spellcheck="false"></textarea>
    <div class="mem-bar"><button id="agentSave" class="primary">Save</button><span id="agentStatus"></span></div>`;
  $("#skillSrc").value = content;
  $("#turns").querySelector(".skill-back").onclick = () => renderAgent(name);
  $("#agentSave").onclick = async () => {
    try {
      const r = await api("/v1/agents/" + encodeURIComponent(name), {
        method: "PUT",

      if (r.ok) { renderAgent(name); return; }
      $("#agentStatus").textContent = "save failed (" + r.status + ")";
    } catch (e) { $("#agentStatus").textContent = e.message; }
  };
}

// ── system: runtime knobs, MCP servers, health — one page ───────────────
function kvGrid(pairs) {
  return '<div class="kv-grid">' + pairs.map(([k, v]) =>
    `<span class="k">${esc(k)}</span><span class="v">${esc(v == null ? "—" : String(v))}</span>`).join("") + "</div>";
}

async function openSystem() {
  leaveSessions("system");
  try {
    const [config, mcp, health, agents] = await Promise.all([
      (await api("/v1/config")).json(),
      (await api("/v1/mcp")).json(),
      (await fetch("/healthz")).json(),
      (await api("/v1/agents")).json(),
    ]);
    $("#meta").textContent = "system · runtime configuration (secrets shown as set/unset, never values)";
    const knobs = kvGrid([
      ["model", config.model],
      ["max_turns / max_concurrent", `${config.max_turns} / ${config.max_concurrent}`],
      ["timeouts (default / max)", `${config.default_timeout_seconds}s / ${config.max_timeout_seconds}s`],
      ["escalate_levels", (config.escalate_levels || []).join(", ")],
      ["budget", config.budget_usd ? `$${config.budget_usd} / ${config.budget_window_hours}h` : "off"],
      ["retention_days", config.retention_days || "keep everything"],
      ["setting_sources", (config.setting_sources || []).join(", ")],
      ["skills filter", config.skills_filter || "engine default"],
      ["system prompt", `${config.system_prompt.path}${config.system_prompt.active ? " (active)" : " (absent)"}`],
      ["subagent roles", `${agents.filter((a) => a.source !== "config").length} from .claude/agents files + ${agents.filter((a) => a.source === "config").length} config-pinned`],
      ["agents_config (optional JSON)", config.agents_config],
      ["mcp_config", config.mcp_config],
      ["return_url", config.return_url],
      ["self-alarm / event secret / return secret", `${config.alarm_configured ? "set" : "—"} / ${config.event_secret_set ? "set" : "—"} / ${config.return_secret_set ? "set" : "—"}`],
      ["workdir", config.workdir],
    ]);
    const servers = Object.entries(mcp.servers || {});
    const mcpHtml = servers.length
      ? servers.map(([name, s]) => kvGrid([
          [name + (s.disabled ? " (disabled)" : ""), [s.command, ...(s.args || [])].filter(Boolean).join(" ") || s.url || s.type || ""],
          ["env keys", (s.env_keys || []).join(", ") || "(none)"],
        ])).join("")
      : `<div class="mem-tip">no MCP servers configured${mcp.config ? ` in ${esc(mcp.config)}` : " — set HOOKPROBE_MCP_CONFIG"} · edits apply to the next run, no restart</div>`;
    const healthHtml = kvGrid([
      ["active runs", health.active_runs],
      ["turns running / queued", `${health.running_turns} / ${health.queued_turns}`],
      ["report returns failed", health.return_failures],
    ]);
    $("#turns").innerHTML =
      '<div class="subhead">runtime</div>' + knobs +
      '<div class="subhead">mcp servers</div>' + mcpHtml +
      '<div class="subhead">health</div>' + healthHtml;
    $("#turns").scrollTop = 0;
  } catch (e) { $("#hint").textContent = e.message; }
}

  $("#turns").innerHTML = `

      $("#auditCount").textContent = `${d.count} calls (newest last)`;
      $("#auditRows").innerHTML = d.entries.map((e) => `
        <div class="audit-row ${e.error ? "err" : ""}">

function openHelp() {
  leaveSessions("help");
  $("#meta").textContent = "help · what hookprobe is and how to use it · start here, human or AI";
  const base = "http://hookprobe:8088";
  $("#turns").innerHTML = `<div class="help">
<h2>What this is</h2>
<p>hookprobe is a <b>read-only alert investigator</b>: given an alert worth digging into, it runs
one tool-using agent investigation (logs, metrics, its own case files, a browser when needed) and
produces a short report with the conclusion first. It normally sits inside the hookstack family —
the pipe (hookrelay) copies important alerts over, and the finished report travels back through
the pipe to the same channels as the verdict — but any OpenClaw-dialect caller can drive it
directly.</p>

<h2>Three steps to start</h2>
<p>1. Paste your <b>bearer token</b> top-right (kept in localStorage, once per browser).<br>
2. Hit <b>+ new session</b> and describe the investigation in a sentence (e.g. "run a read-only
health patrol of this container, conclusion first").<br>
3. Watch the live process feed while it runs and <b>Stop</b> it any time; when it finishes, the box
at the bottom is a <b>follow-up</b> — the same engine session resumes with all of the first
round's evidence intact.</p>

<h2>The seven views</h2>

<h2>API quick reference (for an AI or a script)</h2>
<p class="dim">Auth: every request carries <code>Authorization: Bearer &lt;token&gt;</code>. Polling contract:
/final answers 202 while running; on a 200 <code>isFinal</code> is always true — trust the first
confirming read, no stability heuristics needed.<br>
The examples use the <b>docker-network</b> address <code>http://hookprobe:8088</code>; from the host,
use the loopback mapping <code>http://127.0.0.1:8088</code>.</p>
<pre># start an investigation (OpenClaw-compatible contract)
curl -X POST ${base}/hooks/agent -H "Authorization: Bearer $TOKEN" \\
  -H "Content-Type: application/json" \\
  -d '{"message":"what to investigate…","sessionKey":"my:task:1","timeoutSeconds":900}'

# poll for the result (202 = running; 200 => {"isFinal":true,"text":"the full report"})
curl ${base}/sessions/my:task:1/final -H "Authorization: Bearer $TOKEN"

# follow up in the same session / stop the turn in flight
curl -X POST ${base}/sessions/my:task:1/continue -H ... -d '{"message":"a follow-up question"}'
curl -X POST ${base}/sessions/my:task:1/stop -H ...</pre>
<table>
<tr><th>Management endpoint</th><th>Purpose</th></tr>
<tr><td><code>GET /v1/runs</code> · <code>GET /v1/runs/{key}</code></td><td>Session list / full run record (events and bill included)</td></tr>
<tr><td><code>GET/PUT/DELETE /v1/skills[/{name}]</code></td><td>Browse and copy-on-write edit the skills</td></tr>
<tr><td><code>GET/PUT/DELETE /v1/agents[/{name}]</code></td><td>Subagent roles, same semantics</td></tr>
<tr><td><code>GET/PUT /v1/memory</code> · <code>/v1/system-prompt</code></td><td>Environment memory / methodology — saved edits are hot</td></tr>
<tr><td><code>GET /v1/mcp</code> · <code>/v1/config</code> · <code>/v1/budget</code> · <code>/v1/audit</code></td><td>MCP servers (env key names only) / config snapshot / budget arithmetic / audit tail</td></tr>
<tr><td><code>GET /healthz</code> (no auth)</td><td>Liveness plus running/queued/return-failure counters, for an external monitor</td></tr>
</table>

<h2>File map (the /data volume is the whole memory — back that up)</h2>
<table>
<tr><th>Path</th><th>What it is</th></tr>
<tr><td><code>results/*.json</code></td><td>Case files: the full record of every investigation — and the episodic memory a new investigation greps first</td></tr>
<tr><td><code>.claude/skills/</code> · <code>.claude/agents/</code></td><td>Skills and roles (project layer). A host library appears as the read-only user layer.</td></tr>
<tr><td><code>CLAUDE.md</code> · <code>system-prompt.md</code> · <code>mcp.json</code></td><td>Environment memory / methodology / MCP config — all three read fresh at every run</td></tr>
<tr><td><code>audit/*.jsonl</code></td><td>The audit ledger; <code>home/</code> holds the resumable session transcripts</td></tr>
</table>

<h2>Safety model (why it can run unattended)</h2>
<p>Read-only in three layers: <b>read-only credentials</b> (the real boundary — only query-grade
identities are mounted) → <b>the bash guard</b> (denies mutating verbs of kubectl/systemctl/
terraform and friends, inside subagents too) → <b>a disposable container</b> (non-root). On top of
that: the <b>budget breaker</b> (once the window's spend hits the ceiling the event door refuses new
investigations — and says so on a card), <b>idempotency</b> (an alert storm funds one investigation,
not N), and <b>failure completes the loop</b> (timeout, crash, restart or refusal all return a
report).</p>

<h2>Loop hygiene (the run's context and bill)</h2>
<p>Two advisory guards plus one record — none is a security boundary, all exist because an unattended
run cannot notice it is wasting itself.</p>
<table>
<tr><td><b>repeat reminder</b></td><td>On the <code>HOOKPROBE_REPEAT_REMINDER_AT</code>-th identical
call (3rd by default, and every multiple after) the tool result carries a note: change approach, or
record what stays unknown and move on. The budget breaker stops spending after the fact; this is the
nudge before it costs.</td></tr>
<tr><td><b>command deadlines</b></td><td><code>HOOKPROBE_BASH_TIMEOUT_MS</code> /
<code>HOOKPROBE_BASH_MAX_TIMEOUT_MS</code> cap a single command, so a curl at an unreachable host
cannot hold a slot until the whole run times out.</td></tr>
<tr><td><b>inputs record</b></td><td>Every turn records what it was given — model, skill layers and
names, roles, MCP servers, and digests of the environment memory and appended methodology. Those
files live on a mutable volume; a stale line in <code>CLAUDE.md</code> once made every report come
back in the wrong language while the request looked identical. Open <b>inputs · what the model was
given</b> on any turn.</td></tr>
</table>
<p>Oversized tool output needs no guard here: the harness saves the full copy under the session's
<code>tool-results/</code> and hands the model a short preview plus that path.</p>

<h2>Recipes</h2>
<ul>
<li><b>Install a marketplace skill</b>: unzip it into <code>/data/.claude/skills/&lt;name&gt;/</code> (drop __MACOSX); the next run loads it — read it first, a skill instructs an agent holding your credentials</li>
<li><b>Add a role</b>: open any seeded role in the agents view → copy, rename, save; or drop a .md file in place</li>
<li><b>Wire an MCP server</b>: edit <code>/data/mcp.json</code> (the marketplace config.json dialect works, enabled:false is skipped), confirm on the system view, next run picks it up</li>
<li><b>Control which skills a session sees</b>: the <code>HOOKPROBE_SKILLS</code> allowlist (a big library would otherwise flood the context); layers are switched with <code>HOOKPROBE_SETTING_SOURCES</code></li>
<li><b>Ask "what did it actually do"</b>: the audit view, filtered by session; a single run's feed is under process · N steps in sessions</li>
<li><b>Control the refresh</b>: the header carries ↻ and an interval — manual, 15s, 60s or 5m, remembered per browser. One timer serves every view, and <code>manual</code> means nothing polls at all. A run you are watching does not depend on it: its steps are pushed over a streaming response and stop when it settles, so even on <code>manual</code> the open investigation stays live</li>
<li><b>Scheduled patrols</b>: a host crontab that POSTs a "patrol due" event to the pipe's front door is enough — the escalation door turns it into a proactive investigation whose report travels the usual channels. Each patrol is its own case file, and cites what the last one found.</li>
</ul>
<p class="dim">Fuller design and deployment notes live in hookprobe/README.md and the repository OVERVIEW.md.</p>

$("#msg").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") $("#composer").requestSubmit();
});

$("#composer").onsubmit = async (ev) => {
  ev.preventDefault();
  const msg = $("#msg").value.trim();
  if (!msg) return;
  $("#send").disabled = true;
  $("#hint").textContent = "";
  try {
    if (sel) {
      const r = await api("/sessions/" + encodeURIComponent(sel) + "/continue",
        { method: "POST", body: JSON.stringify({ message: msg }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
    } else {
      const key = "web:" + new Date().toISOString().replace(/[:.]/g, "-");
      const r = await api("/hooks/agent",
        { method: "POST", body: JSON.stringify({ message: msg, sessionKey: key }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
      sel = key;
      composeMode = false;
    }
    // Echo it before the round trip: the first thing a sender wants to see is
    // their own message, and the run is already spawned by the time we return.
    $("#turns").insertAdjacentHTML(
      "beforeend",
      `<div class="turn">${qHtml(msg)}<div class="proc"></div>` +
      `<div class="pending">investigating</div></div>`,
    );
    $("#turns").scrollTop = $("#turns").scrollHeight;
    $("#msg").value = "";
    watchRun(sel);
    await refreshList();
  } catch (e) {
    $("#hint").textContent = e.message;
    $("#send").disabled = false;
  }
};

if (location.hash.startsWith("#skills")) {
  const deepLink = decodeURIComponent(location.hash.slice("#skills".length).replace(/^\//, ""));
  if (deepLink) { leaveSessions("skills"); renderSkill(deepLink); }
  else openSkills();
}
else if (location.hash.startsWith("#agents")) {
  const agentLink = decodeURIComponent(location.hash.slice("#agents".length).replace(/^\//, ""));
  if (agentLink) { leaveSessions("agents"); renderAgent(agentLink); }
  else openAgents();
}
else if (location.hash === "#memory") openMemory();
else if (location.hash === "#prompt") openPrompt();
else if (location.hash === "#system") openSystem();
else if (location.hash === "#help") openHelp();
else if (location.hash.startsWith("#audit")) {
  openAudit(decodeURIComponent(location.hash.slice("#audit".length).replace(/^\//, "")));
}
async function refreshBudget() {
  const el = $("#budget");
  try {
    const b = await (await api("/v1/budget")).json();
    if (!b.enabled) { el.hidden = true; return; }
    el.hidden = false;
    el.textContent = `budget $${Number(b.spent_usd).toFixed(2)} / $${Number(b.budget_usd).toFixed(2)}`;
    el.classList.toggle("hot", !!b.exhausted);
  } catch { el.hidden = true; }
}

  // ── refresh control · keep this block identical in all three pages ─────────
  // One timer per page, off or slow by choice: a board that polls every few
  // seconds spends the operator's attention and the service's breath for
  // nothing. The stamp says when the data is from; the button says now.
  var REFRESH_KEY = "hookstack-refresh-ms";
  var refreshTimer = null;
  function refreshEveryMs() {
    var raw = parseInt(localStorage.getItem(REFRESH_KEY) || "60000", 10);
    return isNaN(raw) ? 60000 : raw;
  }
  function applyRefreshInterval(tick) {
    clearInterval(refreshTimer);
    var ms = refreshEveryMs();
    document.getElementById("rEvery").value = String(ms);
    if (ms > 0) refreshTimer = setInterval(function () { if (!document.hidden) tick(); }, ms);
  }
  function wireRefreshControl(tick) {
    document.getElementById("rNow").addEventListener("click", function () { tick(); });
    document.getElementById("rEvery").addEventListener("change", function (event) {
      localStorage.setItem(REFRESH_KEY, event.target.value);
      applyRefreshInterval(tick);
    });
    applyRefreshInterval(tick);
  }
  // ── end refresh control ───────────────────────────────────────────────────

// One tick refreshes whatever is on screen: the session list and the open
// session (its live feed included), or the audit tail.
async function tick() {
  await refreshBudget();
  if (viewMode === "sessions") {
    await refreshList();
    if (sel) await renderDetail(false).catch(() => null);
  } else if (viewMode === "audit" && auditReload) {
    await auditReload();
  }
  const now = new Date().toTimeString().slice(0, 8);
  $("#stamp").textContent = "refreshed " + now;
}

tick();
wireRefreshControl(tick);
</script>
