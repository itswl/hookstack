<!doctype html>
<!-- The sessions page: list, read, and continue investigations from a browser.
     One file, no build step, no external assets. Served unauthenticated; every
     API call it makes carries the bearer token you paste top-right. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hookprobe · sessions</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --line:#21262d; --text:#e6edf3; --dim:#8b949e;
  --accent:#58a6ff; --green:#3fb950; --amber:#d29922; --red:#f85149;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;
     font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:600}
header h1 span{color:var(--dim);font-weight:400}
#token{margin-left:auto;background:var(--bg);border:1px solid var(--line);color:var(--text);
       border-radius:6px;padding:5px 8px;width:230px;font-family:var(--mono);font-size:12px}
#token.bad{border-color:var(--red)}
#budget{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:3px 8px;white-space:nowrap}
#budget.hot{color:var(--red);border-color:var(--red)}
button{background:#21262d;border:1px solid #30363d;color:var(--text);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
button:disabled{opacity:.45;cursor:default}
main{flex:1;display:flex;min-height:0}
aside{width:330px;border-right:1px solid var(--line);overflow-y:auto;background:var(--panel);flex-shrink:0}
.item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;border-left:2px solid transparent}
.item:hover{background:#1c2128}
.item.sel{background:#152238;border-left-color:var(--accent)}
.item .key{font-family:var(--mono);font-size:12px;color:var(--accent);word-break:break-all}
.item .title{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.item .meta{display:flex;gap:8px;font-size:11px;color:var(--dim);margin-top:4px;align-items:center;flex-wrap:wrap}
.badge{padding:0 7px;border-radius:10px;font-size:11px;border:1px solid currentColor}
.badge.running{color:var(--amber)}
.badge.completed{color:var(--green)}
.badge.failed{color:var(--red)}
section{flex:1;display:flex;flex-direction:column;min-width:0}
#meta{padding:8px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);
      font-family:var(--mono);min-height:36px;word-break:break-all}
#turns{flex:1;overflow-y:auto;padding:16px}
.turn{margin-bottom:20px}
.q,details.q{background:#152238;border:1px solid #1f3a5f;border-radius:8px;padding:8px 12px;margin-bottom:8px;
   white-space:pre-wrap;word-break:break-word;font-size:13px}
details.q summary{cursor:pointer;color:var(--dim);white-space:normal}
.a pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;
       white-space:pre-wrap;word-break:break-word;margin:0;font-family:var(--mono);font-size:12.5px}
.a.err pre{border-color:var(--red)}
.stats{color:var(--dim);font-size:11px;font-family:var(--mono);margin-top:5px;padding-left:2px}
.proc{border-left:2px solid var(--line);margin:6px 0 8px 6px;padding-left:10px}
.ev{font-family:var(--mono);font-size:11.5px;color:var(--dim);padding:2px 0;word-break:break-all}
.ev-tool{color:var(--accent);margin-right:8px}
.ev-narr{font-family:inherit;font-style:italic;color:#9daebe;white-space:pre-wrap}
details.proc-past{margin:6px 0 8px 6px}
details.proc-past summary{cursor:pointer;color:var(--dim);font-size:12px}
.skill{padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;cursor:pointer;background:var(--panel)}
.skill:hover{border-color:var(--accent)}
.skill-name{color:var(--accent);font-family:var(--mono);font-size:13px}
.skill-desc{font-size:13px;margin-top:3px}
.skill-meta{color:var(--dim);font-size:11px;margin-top:5px;font-family:var(--mono)}
.skill-back{color:var(--accent);cursor:pointer;margin-bottom:10px;font-size:13px}
.ev-todos{font-family:inherit;padding:4px 0}
.ev-todos div{padding:1px 0;color:var(--text);font-size:12.5px}
.ev-todos .todo-done{color:var(--dim);text-decoration:line-through}
.ev-todos .todo-active{color:var(--amber)}
#stopBtn{border-color:var(--red);color:var(--red)}
#memEdit{width:100%;min-height:420px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-family:var(--mono);font-size:12.5px;padding:12px;resize:vertical;box-sizing:border-box}
#memEdit:focus{outline:none;border-color:var(--accent)}
.mem-tip{color:var(--dim);font-size:12px;margin-bottom:10px}
.mem-bar{margin-top:10px;display:flex;gap:12px;align-items:center}
#memStatus{color:var(--green);font-size:12px}
.md{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  font-size:13.5px;line-height:1.65;word-break:break-word}
.a.err .md{border-color:var(--red)}
.md h1,.md h2,.md h3,.md h4{margin:12px 0 6px;line-height:1.3}
.md h1{font-size:16px}.md h2{font-size:15px}.md h3,.md h4{font-size:14px}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:24px}
.md li{margin:2px 0}
.md code{background:#22282f;border:1px solid var(--line);border-radius:4px;padding:0 4px;
  font-family:var(--mono);font-size:12px}
.md pre.code{background:#0b0f14;border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;
  white-space:pre-wrap;word-break:break-word;margin:8px 0}
.md pre.code code{background:none;border:none;padding:0;font-size:12px}
.md table{border-collapse:collapse;margin:8px 0;font-size:12.5px}
.md th,.md td{border:1px solid var(--line);padding:4px 10px;text-align:left}
.md th{background:#1a2027}
.md a{color:var(--accent)}
.pending{color:var(--amber);padding:8px 12px;font-size:13px}
.pending::after{content:"…";animation:dots 1.2s steps(3,end) infinite}
@keyframes dots{0%{content:""}33%{content:"."}66%{content:".."}100%{content:"..."}}
#hint{padding:0 16px 6px;font-size:12px;color:var(--red);min-height:18px}
#composer{display:flex;gap:8px;padding:0 16px 14px}
#msg{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);
     padding:8px 10px;resize:vertical;min-height:46px;font:inherit}
#msg:focus{outline:none;border-color:var(--accent)}
.empty{color:var(--dim);padding:26px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>hookprobe <span>· sessions</span></h1>
  <button id="new">+ new session</button>
  <button id="skillsBtn">skills</button>
  <button id="memBtn">memory</button>
  <span id="budget" hidden></span>
  <input id="token" placeholder="bearer token" autocomplete="off">
</header>
<main>
  <aside id="list"><div class="empty">loading…</div></aside>
  <section>
    <div id="meta"></div>
    <div id="turns"><div class="empty">select a session on the left, or start a new one</div></div>
    <div id="hint"></div>
    <form id="composer">
      <textarea id="msg" placeholder="new session: describe what to investigate… (Ctrl/⌘+Enter to send)"></textarea>
      <button id="stopBtn" type="button" style="display:none">Stop</button>
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </section>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
let sel = null;
let composeMode = false; // "+ new session" pressed: keep the pane free until they send
let viewMode = "sessions"; // or "skills"
let detailTimer = null;

const tokenEl = $("#token");
tokenEl.value = localStorage.getItem("hookprobe_token") || "";
tokenEl.addEventListener("change", () => {
  localStorage.setItem("hookprobe_token", tokenEl.value.trim());
  tokenEl.classList.remove("bad");
  refreshList();
});

async function api(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  const t = tokenEl.value.trim();
  if (t) headers["Authorization"] = "Bearer " + t;
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) {
    tokenEl.classList.add("bad");
    throw new Error("unauthorized — paste the bearer token (top right)");
  }
  return r;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
function pretty(t) {
  try { return JSON.stringify(JSON.parse(t), null, 2); } catch { return t; }
}

// --- tiny escape-first markdown renderer ---------------------------------
// Everything is HTML-escaped up front; the only tags in the output are the
// ones these transforms construct, and link hrefs must be http(s).
function mdInline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdToHtml(src) {
  let text = esc(src || "");
  const fences = [];
  text = text.replace(/```[^\n]*\n?([\s\S]*?)```/g, (_, body) => {
    fences.push(body);
    return "" + (fences.length - 1) + "";
  });
  const out = [];
  let list = null;
  let para = [];
  let tbl = [];
  const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
  const flushPara = () => {
    if (para.length) { out.push("<p>" + para.map(mdInline).join("<br>") + "</p>"); para = []; }
  };
  const flushTable = () => {
    if (!tbl.length) return;
    const rows = tbl;
    tbl = [];
    const cells = (r) => r.replace(/^\|/, "").replace(/\|\s*$/, "").split("|").map((c) => mdInline(c.trim()));
    if (rows.length >= 2 && /^[\s|:\-]+$/.test(rows[1])) {
      const head = cells(rows[0]);
      const body = rows.slice(2).map(cells);
      out.push(
        "<table><thead><tr>" + head.map((h) => "<th>" + h + "</th>").join("") + "</tr></thead><tbody>" +
        body.map((r) => "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>").join("") +
        "</tbody></table>",
      );
    } else {
      para.push(...rows);
      flushPara();
    }
  };
  for (const line of text.split("\n")) {
    if (/^\d+\s*$/.test(line)) { flushPara(); flushTable(); closeList(); out.push(line.trim()); continue; }
    if (/^\s*\|/.test(line)) { flushPara(); closeList(); tbl.push(line.trim()); continue; }
    flushTable();
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { flushPara(); closeList(); out.push(`<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`); continue; }
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    if (ul) { flushPara(); if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; } out.push("<li>" + mdInline(ul[1]) + "</li>"); continue; }
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ol) { flushPara(); if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; } out.push("<li>" + mdInline(ol[1]) + "</li>"); continue; }
    if (!line.trim()) { flushPara(); closeList(); continue; }
    closeList();
    para.push(line);
  }
  flushPara(); flushTable(); closeList();
  const html = out.join("\n").replace(/(\d+)/g, (_, i) => '<pre class="code"><code>' + fences[Number(i)] + "</code></pre>");
  return '<div class="md">' + html + "</div>";
}
function answerHtml(text) {
  const raw = text || "";
  try { JSON.parse(raw); return `<pre>${esc(pretty(raw))}</pre>`; } catch { /* not JSON */ }
  return mdToHtml(raw);
}
function fmtTime(ts) { return ts ? new Date(ts * 1000).toLocaleString() : ""; }

async function refreshList() {
  try {
    const runs = await (await api("/v1/runs")).json();
    const el = $("#list");
    if (!runs.length) { el.innerHTML = '<div class="empty">no sessions yet</div>'; return; }
    el.innerHTML = runs.map((x) => `
      <div class="item ${x.session_key === sel ? "sel" : ""}" data-key="${esc(x.session_key)}">
        <div class="key">${esc(x.session_key)}</div>
        <div class="title">${esc(x.title || "")}</div>
        <div class="meta">
          <span class="badge ${esc(x.status)}">${esc(x.status)}</span>
          <span>${x.turn_count} turn${x.turn_count > 1 ? "s" : ""}</span>
          ${x.model ? `<span>${esc(String(x.model).replace(/^claude-/, ""))}</span>` : ""}
          ${x.cost_usd ? `<span>$${Number(x.cost_usd).toFixed(3)}</span>` : ""}
          <span>${fmtTime(x.created_at)}</span>
        </div>
      </div>`).join("");
    el.querySelectorAll(".item").forEach((n) => (n.onclick = () => select(n.dataset.key)));
    // Land on the latest investigation, but never steal the pane from a
    // deliberate "+ new session" or the skills browser.
    if (!sel && !composeMode && viewMode === "sessions" && runs.length) select(runs[0].session_key);
  } catch (e) { $("#hint").textContent = e.message; }
}

async function select(key) {
  sel = key;
  composeMode = false;
  sessionsMode();
  $("#hint").textContent = "";
  refreshList();
  await renderDetail(true);
}

function sessionsMode() {
  viewMode = "sessions";
  $("#composer").style.display = "";
}

function qHtml(m) {
  if (!m) return "";
  if (m.length > 400) {
    return `<details class="q"><summary>${esc(m.slice(0, 180))}…</summary>${esc(m)}</details>`;
  }
  return `<div class="q">${esc(m)}</div>`;
}
function fmtTok(n) {
  n = Number(n) || 0;
  return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(n);
}
function modelLabel(mu) {
  // The engine bills every model that ran, including tiny helpers (session
  // titles run on haiku). Lead with the model that did the work, fold the
  // helpers in as aux with their own bill so the split is obvious.
  const entries = Object.entries(mu || {}).map(([name, v]) => ({
    name: name.replace(/^claude-/, "").replace(/-\d{8}$/, ""),
    cost: Number((v || {}).costUSD ?? (v || {}).cost_usd ?? 0),
    out: Number((v || {}).outputTokens ?? (v || {}).output_tokens ?? 0),
  }));
  if (!entries.length) return "";
  entries.sort((a, b) => b.cost - a.cost || b.out - a.out);
  const aux = entries.slice(1).map((e) => (e.cost ? `${e.name} $${e.cost.toFixed(4)}` : e.name));
  return entries[0].name + (aux.length ? ` (aux: ${aux.join(", ")})` : "");
}
function statsHtml(t) {
  const u = t.usage || {};
  const pick = (a, b) => (u[a] != null ? u[a] : u[b]); // engine reports snake_case; tolerate camelCase
  const bits = [];
  const label = modelLabel(t.model_usage);
  if (label) bits.push(label);
  const tin = pick("input_tokens", "inputTokens"), tout = pick("output_tokens", "outputTokens");
  const cr = pick("cache_read_input_tokens", "cacheReadInputTokens");
  const cw = pick("cache_creation_input_tokens", "cacheCreationInputTokens");
  if (tin != null) bits.push(`in ${fmtTok(tin)}`);
  if (tout != null) bits.push(`out ${fmtTok(tout)}`);
  if (cr != null || cw != null) bits.push(`cache ${fmtTok(cr)}r/${fmtTok(cw)}w`);
  if (t.cost_usd != null) bits.push(`$${Number(t.cost_usd).toFixed(4)}`);
  if (t.duration_ms != null) bits.push(`${(t.duration_ms / 1000).toFixed(1)}s`);
  return bits.length ? `<div class="stats">${esc(bits.join("  ·  "))}</div>` : "";
}
function eventHtml(e) {
  if (e.type === "tool_use") {
    if (e.name === "TodoWrite" && Array.isArray(e.todos)) {
      const mark = { completed: "☑", in_progress: "◐", pending: "☐" };
      const cls = { completed: "todo-done", in_progress: "todo-active", pending: "" };
      return `<div class="ev ev-todos">${e.todos
        .map((t) => `<div class="${cls[t.status] || ""}">${mark[t.status] || "☐"} ${esc(t.content)}</div>`)
        .join("")}</div>`;
    }
    return `<div class="ev"><span class="ev-tool">${esc(e.name)}</span>${esc(e.detail || "")}</div>`;
  }
  if (e.type === "text") return `<div class="ev ev-narr">${esc(e.text)}</div>`;
  return "";
}
function turnHtml(t) {
  const evs = t.events || [];
  const proc = evs.length
    ? `<details class="proc-past"><summary>process · ${evs.length} steps</summary>
         <div class="proc">${evs.map(eventHtml).join("")}</div></details>`
    : "";
  return `<div class="turn">${qHtml(t.message)}${proc}
    <div class="a ${t.error ? "err" : ""}">${answerHtml(t.text)}</div>${statsHtml(t)}</div>`;
}

async function renderDetail(startPolling) {
  if (!sel) return null;
  const r = await api("/v1/runs/" + encodeURIComponent(sel));
  if (r.status === 404) {
    $("#turns").innerHTML = '<div class="empty">session not found (in-flight run lost to a restart?)</div>';
    return null;
  }
  const run = await r.json();
  $("#meta").textContent =
    `${run.session_key} · ${run.status}` +
    (run.model ? ` · ${run.model}` : "") +
    ` · engine session ${run.engine_session_id || "—"}` +
    (run.error ? ` · ${run.error}` : "");
  const parts = (run.turns || []).map(turnHtml);
  if (run.status === "running") {
    const live = (run.events || []).map(eventHtml).join("");
    parts.push(
      `<div class="turn">${qHtml(run.current_message)}` +
      (live ? `<div class="proc">${live}</div>` : "") +
      `<div class="pending">investigating</div></div>`,
    );
  }
  $("#turns").innerHTML = parts.join("") || '<div class="empty">no turns yet</div>';
  $("#turns").scrollTop = $("#turns").scrollHeight;
  $("#send").disabled = run.status === "running";
  $("#stopBtn").style.display = run.status === "running" ? "" : "none";
  $("#msg").placeholder = run.status === "running"
    ? "a turn is in flight…"
    : "follow-up in this session… (Ctrl/⌘+Enter to send)";
  if (startPolling) {
    clearInterval(detailTimer);
    if (run.status === "running") {
      detailTimer = setInterval(async () => {
        const x = await renderDetail(false).catch(() => null);
        if (x && x.status !== "running") { clearInterval(detailTimer); refreshList(); }
      }, 2500);
    }
  }
  return run;
}

$("#new").onclick = () => {
  sel = null;
  composeMode = true;
  sessionsMode();
  clearInterval(detailTimer);
  $("#stopBtn").style.display = "none";
  refreshList();
  $("#meta").textContent = "new session";
  $("#turns").innerHTML = '<div class="empty">describe below what to investigate</div>';
  $("#send").disabled = false;
  $("#msg").placeholder = "new session: describe what to investigate… (Ctrl/⌘+Enter to send)";
  $("#msg").focus();
};

$("#skillsBtn").onclick = () => openSkills();
$("#memBtn").onclick = () => openMemory();

$("#stopBtn").onclick = async () => {
  if (!sel) return;
  try {
    const r = await api("/sessions/" + encodeURIComponent(sel) + "/stop", { method: "POST" });
    if (!r.ok && r.status !== 409) {
      throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
    }
    $("#hint").textContent = "stopping…";
  } catch (e) { $("#hint").textContent = e.message; }
};

function leaveSessions(mode) {
  viewMode = mode;
  sel = null;
  composeMode = false;
  clearInterval(detailTimer);
  $("#composer").style.display = "none";
  $("#stopBtn").style.display = "none";
  $("#hint").textContent = "";
  refreshList();
}

async function openSkills() {
  leaveSessions("skills");
  await renderSkills();
}

async function openMemory() {
  leaveSessions("memory");
  try {
    const m = await (await api("/v1/memory")).json();
    $("#meta").textContent = "environment memory · CLAUDE.md · loaded into every investigation";
    $("#turns").innerHTML = `
      <div class="mem-tip">Facts every investigation should start from: cluster topology, known false alarms,
      naming conventions, where the dashboards live. The engine loads this file automatically at each turn.</div>
      <textarea id="memEdit" spellcheck="false"></textarea>
      <div class="mem-bar"><button id="memSave" class="primary">Save</button><span id="memStatus"></span></div>`;
    $("#memEdit").value = m.content || "";
    $("#turns").scrollTop = 0;
    $("#memSave").onclick = async () => {
      try {
        const r = await api("/v1/memory", { method: "PUT", body: JSON.stringify({ content: $("#memEdit").value }) });
        $("#memStatus").textContent = r.ok ? "saved" : "save failed (" + r.status + ")";
        if (r.ok) setTimeout(() => { $("#memStatus").textContent = ""; }, 2500);
      } catch (e) { $("#memStatus").textContent = e.message; }
    };
  } catch (e) { $("#hint").textContent = e.message; }
}

async function renderSkills() {
  try {
    const skills = await (await api("/v1/skills")).json();
    $("#meta").textContent = `distilled runbooks · ${skills.length} skill${skills.length === 1 ? "" : "s"} · {workdir}/.claude/skills`;
    if (!skills.length) {
      $("#turns").innerHTML =
        '<div class="empty">no skills yet — when an investigation verifies a reusable diagnostic path, it distills a SKILL.md runbook here, and later runs load it automatically</div>';
      return;
    }
    $("#turns").innerHTML = skills.map((s) => `
      <div class="skill" data-name="${esc(s.name)}">
        <div class="skill-name">${esc(s.name)}</div>
        <div class="skill-desc">${esc(s.description || "(no description)")}</div>
        <div class="skill-meta">${esc((s.files || []).join("  "))} · ${fmtTime(s.modified)}</div>
      </div>`).join("");
    $("#turns").scrollTop = 0;
    $("#turns").querySelectorAll(".skill").forEach((n) => (n.onclick = () => renderSkill(n.dataset.name)));
  } catch (e) { $("#hint").textContent = e.message; }
}

async function renderSkill(name) {
  const r = await api("/v1/skills/" + encodeURIComponent(name));
  if (!r.ok) { $("#hint").textContent = "skill not found"; return; }
  const s = await r.json();
  $("#meta").textContent = `skill · ${name}/SKILL.md`;
  const body = (s.content || "").replace(/^---[\s\S]*?\n---\n/, ""); // frontmatter is for machines
  $("#turns").innerHTML = `<div class="skill-back">← all skills</div>` + mdToHtml(body);
  $("#turns").scrollTop = 0;
  $("#turns").querySelector(".skill-back").onclick = () => renderSkills();
}

$("#msg").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") $("#composer").requestSubmit();
});

$("#composer").onsubmit = async (ev) => {
  ev.preventDefault();
  const msg = $("#msg").value.trim();
  if (!msg) return;
  $("#send").disabled = true;
  $("#hint").textContent = "";
  try {
    if (sel) {
      const r = await api("/sessions/" + encodeURIComponent(sel) + "/continue",
        { method: "POST", body: JSON.stringify({ message: msg }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
    } else {
      const key = "web:" + new Date().toISOString().replace(/[:.]/g, "-");
      const r = await api("/hooks/agent",
        { method: "POST", body: JSON.stringify({ message: msg, sessionKey: key }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
      sel = key;
      composeMode = false;
    }
    $("#msg").value = "";
    await refreshList();
    await renderDetail(true);
  } catch (e) {
    $("#hint").textContent = e.message;
    $("#send").disabled = false;
  }
};

if (location.hash === "#skills") openSkills();
else if (location.hash === "#memory") openMemory();
async function refreshBudget() {
  const el = $("#budget");
  try {
    const b = await (await api("/v1/budget")).json();
    if (!b.enabled) { el.hidden = true; return; }
    el.hidden = false;
    el.textContent = `budget $${Number(b.spent_usd).toFixed(2)} / $${Number(b.budget_usd).toFixed(2)}`;
    el.classList.toggle("hot", !!b.exhausted);
  } catch { el.hidden = true; }
}

refreshList();
setInterval(refreshList, 5000);
refreshBudget();
setInterval(refreshBudget, 15000);
</script>
</body>
</html>
