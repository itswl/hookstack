<!doctype html>
<!-- The sessions page: list, read, and continue investigations from a browser.
     One file, no build step, no external assets. Served unauthenticated; every
     API call it makes carries the bearer token you paste top-right. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hookprobe · sessions</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --line:#21262d; --text:#e6edf3; --dim:#8b949e;
  --accent:#58a6ff; --green:#3fb950; --amber:#d29922; --red:#f85149;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;
     font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:600}
header h1 span{color:var(--dim);font-weight:400}
#token{margin-left:auto;background:var(--bg);border:1px solid var(--line);color:var(--text);
       border-radius:6px;padding:5px 8px;width:230px;font-family:var(--mono);font-size:12px}
#token.bad{border-color:var(--red)}
button{background:#21262d;border:1px solid #30363d;color:var(--text);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
button:disabled{opacity:.45;cursor:default}
main{flex:1;display:flex;min-height:0}
aside{width:330px;border-right:1px solid var(--line);overflow-y:auto;background:var(--panel);flex-shrink:0}
.item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;border-left:2px solid transparent}
.item:hover{background:#1c2128}
.item.sel{background:#152238;border-left-color:var(--accent)}
.item .key{font-family:var(--mono);font-size:12px;color:var(--accent);word-break:break-all}
.item .title{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.item .meta{display:flex;gap:8px;font-size:11px;color:var(--dim);margin-top:4px;align-items:center;flex-wrap:wrap}
.badge{padding:0 7px;border-radius:10px;font-size:11px;border:1px solid currentColor}
.badge.running{color:var(--amber)}
.badge.completed{color:var(--green)}
.badge.failed{color:var(--red)}
section{flex:1;display:flex;flex-direction:column;min-width:0}
#meta{padding:8px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);
      font-family:var(--mono);min-height:36px;word-break:break-all}
#turns{flex:1;overflow-y:auto;padding:16px}
.turn{margin-bottom:20px}
.q,details.q{background:#152238;border:1px solid #1f3a5f;border-radius:8px;padding:8px 12px;margin-bottom:8px;
   white-space:pre-wrap;word-break:break-word;font-size:13px}
details.q summary{cursor:pointer;color:var(--dim);white-space:normal}
.a pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;
       white-space:pre-wrap;word-break:break-word;margin:0;font-family:var(--mono);font-size:12.5px}
.a.err pre{border-color:var(--red)}
.pending{color:var(--amber);padding:8px 12px;font-size:13px}
.pending::after{content:"…";animation:dots 1.2s steps(3,end) infinite}
@keyframes dots{0%{content:""}33%{content:"."}66%{content:".."}100%{content:"..."}}
#hint{padding:0 16px 6px;font-size:12px;color:var(--red);min-height:18px}
#composer{display:flex;gap:8px;padding:0 16px 14px}
#msg{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);
     padding:8px 10px;resize:vertical;min-height:46px;font:inherit}
#msg:focus{outline:none;border-color:var(--accent)}
.empty{color:var(--dim);padding:26px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>hookprobe <span>· sessions</span></h1>
  <button id="new">+ new session</button>
  <input id="token" placeholder="bearer token" autocomplete="off">
</header>
<main>
  <aside id="list"><div class="empty">loading…</div></aside>
  <section>
    <div id="meta"></div>
    <div id="turns"><div class="empty">select a session on the left, or start a new one</div></div>
    <div id="hint"></div>
    <form id="composer">
      <textarea id="msg" placeholder="new session: describe what to investigate… (Ctrl/⌘+Enter to send)"></textarea>
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </section>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
let sel = null;
let detailTimer = null;

const tokenEl = $("#token");
tokenEl.value = localStorage.getItem("hookprobe_token") || "";
tokenEl.addEventListener("change", () => {
  localStorage.setItem("hookprobe_token", tokenEl.value.trim());
  tokenEl.classList.remove("bad");
  refreshList();
});

async function api(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  const t = tokenEl.value.trim();
  if (t) headers["Authorization"] = "Bearer " + t;
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) {
    tokenEl.classList.add("bad");
    throw new Error("unauthorized — paste the bearer token (top right)");
  }
  return r;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
function pretty(t) {
  try { return JSON.stringify(JSON.parse(t), null, 2); } catch { return t; }
}
function fmtTime(ts) { return ts ? new Date(ts * 1000).toLocaleString() : ""; }

async function refreshList() {
  try {
    const runs = await (await api("/v1/runs")).json();
    const el = $("#list");
    if (!runs.length) { el.innerHTML = '<div class="empty">no sessions yet</div>'; return; }
    el.innerHTML = runs.map((x) => `
      <div class="item ${x.session_key === sel ? "sel" : ""}" data-key="${esc(x.session_key)}">
        <div class="key">${esc(x.session_key)}</div>
        <div class="title">${esc(x.title || "")}</div>
        <div class="meta">
          <span class="badge ${esc(x.status)}">${esc(x.status)}</span>
          <span>${x.turn_count} turn${x.turn_count > 1 ? "s" : ""}</span>
          ${x.cost_usd ? `<span>$${Number(x.cost_usd).toFixed(3)}</span>` : ""}
          <span>${fmtTime(x.created_at)}</span>
        </div>
      </div>`).join("");
    el.querySelectorAll(".item").forEach((n) => (n.onclick = () => select(n.dataset.key)));
    if (!sel && runs.length) select(runs[0].session_key); // land on the latest investigation
  } catch (e) { $("#hint").textContent = e.message; }
}

async function select(key) {
  sel = key;
  $("#hint").textContent = "";
  refreshList();
  await renderDetail(true);
}

function qHtml(m) {
  if (!m) return "";
  if (m.length > 400) {
    return `<details class="q"><summary>${esc(m.slice(0, 180))}…</summary>${esc(m)}</details>`;
  }
  return `<div class="q">${esc(m)}</div>`;
}
function turnHtml(t) {
  return `<div class="turn">${qHtml(t.message)}
    <div class="a ${t.error ? "err" : ""}"><pre>${esc(pretty(t.text || ""))}</pre></div></div>`;
}

async function renderDetail(startPolling) {
  if (!sel) return null;
  const r = await api("/v1/runs/" + encodeURIComponent(sel));
  if (r.status === 404) {
    $("#turns").innerHTML = '<div class="empty">session not found (in-flight run lost to a restart?)</div>';
    return null;
  }
  const run = await r.json();
  $("#meta").textContent =
    `${run.session_key} · ${run.status} · engine session ${run.engine_session_id || "—"}` +
    (run.error ? ` · ${run.error}` : "");
  const parts = (run.turns || []).map(turnHtml);
  if (run.status === "running") {
    parts.push(`<div class="turn">${qHtml(run.current_message)}<div class="pending">investigating</div></div>`);
  }
  $("#turns").innerHTML = parts.join("") || '<div class="empty">no turns yet</div>';
  $("#turns").scrollTop = $("#turns").scrollHeight;
  $("#send").disabled = run.status === "running";
  $("#msg").placeholder = run.status === "running"
    ? "a turn is in flight…"
    : "follow-up in this session… (Ctrl/⌘+Enter to send)";
  if (startPolling) {
    clearInterval(detailTimer);
    if (run.status === "running") {
      detailTimer = setInterval(async () => {
        const x = await renderDetail(false).catch(() => null);
        if (x && x.status !== "running") { clearInterval(detailTimer); refreshList(); }
      }, 2500);
    }
  }
  return run;
}

$("#new").onclick = () => {
  sel = null;
  clearInterval(detailTimer);
  refreshList();
  $("#meta").textContent = "new session";
  $("#turns").innerHTML = '<div class="empty">describe below what to investigate</div>';
  $("#send").disabled = false;
  $("#msg").placeholder = "new session: describe what to investigate… (Ctrl/⌘+Enter to send)";
  $("#msg").focus();
};

$("#msg").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") $("#composer").requestSubmit();
});

$("#composer").onsubmit = async (ev) => {
  ev.preventDefault();
  const msg = $("#msg").value.trim();
  if (!msg) return;
  $("#send").disabled = true;
  $("#hint").textContent = "";
  try {
    if (sel) {
      const r = await api("/sessions/" + encodeURIComponent(sel) + "/continue",
        { method: "POST", body: JSON.stringify({ message: msg }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
    } else {
      const key = "web:" + new Date().toISOString().replace(/[:.]/g, "-");
      const r = await api("/hooks/agent",
        { method: "POST", body: JSON.stringify({ message: msg, sessionKey: key }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
      sel = key;
    }
    $("#msg").value = "";
    await refreshList();
    await renderDetail(true);
  } catch (e) {
    $("#hint").textContent = e.message;
    $("#send").disabled = false;
  }
};

refreshList();
setInterval(refreshList, 5000);
</script>
</body>
</html>
