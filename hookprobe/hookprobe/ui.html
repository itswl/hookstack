<!doctype html>
<!-- The sessions page: list, read, and continue investigations from a browser.
     One file, no build step, no external assets. Served unauthenticated; every
     API call it makes carries the bearer token you paste top-right. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hookprobe · sessions</title>
<style>
  /* ── hookstack design tokens · keep this block identical in all three pages ── */
  :root {
    --bg: #0b0e14; --surface: #11151d; --border: #1f2530; --border-soft: #171c26;
    --text: #d7dde6; --muted: #8b94a3; --accent: #4c8dff;
    --ok: #3dd68c; --warn: #f5a524; --bad: #e5484d;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    /* "PingFang SC" stays in the stack: alert titles arrive in whatever language
       the monitoring system speaks, and they are rendered here verbatim. */
    --ui: 14px/1.55 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
  }
  .rc { display: flex; gap: 6px; align-items: center; }
  .rc button, .rc select { background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 12px;
    cursor: pointer; }
  .rc button:hover, .rc select:hover { border-color: var(--accent); }
  .rc .live { font-size: 11px; color: var(--muted); border: 1px solid var(--border);
    border-radius: 10px; padding: 2px 8px; white-space: nowrap; }
  .rc .live.on { color: var(--ok); border-color: var(--ok); }
  .rc .live.off { color: var(--warn); border-color: var(--warn); }
  /* ── end design tokens ────────────────────────────────────────────────────── */
  /* ── hookstack tab shell · keep this block identical in all three pages ── */
  .tabs { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .tab { background: none; border: 0; color: var(--muted); padding: 8px 12px; cursor: pointer; font: inherit;
         font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-group { display: flex; align-items: center; gap: 2px; margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--border); }
  .tab-group-label { color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding-right: 6px; }
  .tab .count { color: var(--muted); font-family: var(--mono); font-size: 11px; margin-left: 4px; }
  .tab.active .count { color: var(--accent); }
  /* ── end tab shell ──────────────────────────────────────────────────────── */
  /* This page's older token names, aliased onto the shared set above. */
  :root {
    --panel: var(--surface); --line: var(--border); --dim: var(--muted);
    --green: var(--ok); --amber: var(--warn); --red: var(--bad);
  }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;
     font:var(--ui)}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
nav.tabs{padding:0 12px;background:var(--panel)}
/* the work board: one column per state, blocked first — see hookprobe/work.py */
.ctx-hot{color:var(--amber)}
.wb-top{font-size:12px;color:var(--dim);padding:2px 2px 8px;overflow-wrap:anywhere}
.wb-top b{color:var(--text);font-weight:600}
.wb-q{width:100%;box-sizing:border-box;margin-bottom:10px;background:var(--bg);border:1px solid var(--line);
  color:var(--text);border-radius:6px;padding:5px 9px;font:inherit;font-size:12.5px}
.wb{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;padding:2px 0 10px}
.wb-col{min-width:0}
.wb-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:0 2px 6px;display:flex;gap:6px;align-items:baseline}
.wb-h b{color:var(--text);font-family:var(--mono);font-weight:600}
.wb-card{border:1px solid var(--line);border-left:2px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer;background:var(--bg)}
.wb-card:hover{border-color:var(--accent)}
.wb-card .t{font-size:13px;line-height:1.35;margin-bottom:4px;overflow-wrap:anywhere}
.wb-card .m{font-size:11px;color:var(--dim);font-family:var(--mono);display:flex;flex-wrap:wrap;gap:6px}
.wb-card .o{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.wb-card .o span{font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--amber)}
.wb-waiting_approval{border-left-color:var(--amber)} .wb-needs_human{border-left-color:var(--bad)}
.wb-abandoned{border-left-color:var(--dim)} .wb-abandoned .t{color:var(--dim)}
.wb-executing{border-left-color:var(--accent)} .wb-verifying{border-left-color:var(--amber)}
.wb-done{border-left-color:var(--ok)}
.wb-card .v{color:var(--ok)}
.ap-row{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:9px}
.ap-row .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px}
.ap-row .h .w{margin-left:auto;font-size:11px;color:var(--dim);font-family:var(--mono)}
.ap-row .cmd{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;margin:4px 0;overflow-x:auto}
.ap-bar{display:flex;gap:6px;margin-top:6px}
.prov{font-size:12px;color:var(--dim);padding:2px 0 6px}.prov b{color:var(--text);font-weight:500}.prov a{color:var(--accent)}
header h1{font-size:15px;margin:0;font-weight:600}
header h1 span{color:var(--dim);font-weight:400}
#token{margin-left:auto;background:var(--bg);border:1px solid var(--line);color:var(--text);
       border-radius:6px;padding:5px 8px;width:230px;font-family:var(--mono);font-size:12px}
#token.bad{border-color:var(--red)}
#stamp{font-size:11px;color:var(--dim);font-family:var(--mono);white-space:nowrap}
#budget{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:3px 8px;white-space:nowrap}
#budget.hot{color:var(--red);border-color:var(--red)}
#budget.unmeasured{border-style:dashed;border-color:var(--dim)}
button{background:#21262d;border:1px solid #30363d;color:var(--text);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
button:disabled{opacity:.45;cursor:default}
main{flex:1;display:flex;min-height:0}
aside{width:330px;border-right:1px solid var(--line);background:var(--panel);flex-shrink:0;display:flex;flex-direction:column}
#q{margin:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);
   padding:5px 9px;font-size:12px}
#q:focus{outline:none;border-color:var(--accent)}
#list{flex:1;overflow-y:auto}
.item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;border-left:2px solid transparent}
.item:hover{background:#1c2128}
.item.sel{background:#152238;border-left-color:var(--accent)}
.item .key{font-family:var(--mono);font-size:12px;color:var(--accent);word-break:break-all}
.item .title{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.item .meta{display:flex;gap:8px;font-size:11px;color:var(--dim);margin-top:4px;align-items:center;flex-wrap:wrap}
.badge{padding:0 7px;border-radius:10px;font-size:11px;border:1px solid currentColor}
.flag{padding:0 6px;border-radius:9px;font-size:10px;border:1px solid var(--line);color:var(--dim);font-family:var(--mono)}
.flag.sent{color:var(--green);border-color:var(--green)}
.flag.retfail{color:var(--red);border-color:var(--red)}
.kv-grid{display:grid;grid-template-columns:230px 1fr;gap:5px 16px;font-size:12.5px;margin:6px 0 18px}
.kv-grid .k{color:var(--dim);font-family:var(--mono);font-size:12px}
.kv-grid .v{font-family:var(--mono);font-size:12px;word-break:break-all}
.subhead{color:var(--text);font-size:13px;font-weight:600;margin:14px 0 6px}
.audit-bar{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.audit-bar input{background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:5px 9px;font-size:12px;width:280px}
.audit-row{display:flex;gap:10px;font-family:var(--mono);font-size:11.5px;padding:3px 0;border-bottom:1px solid #161b22;align-items:flex-start}
.audit-row .ts{color:var(--dim);flex-shrink:0}
/* Wraps rather than truncates. A session key is the handle for everything else
   here — it is what the filter box takes, what /v1/runs/{key} wants and what a
   grep of audit/*.jsonl needs — and `hook:deep-analysis:grafana:` eats 27 of the
   210px before the part that identifies anything. An ellipsis on the ONE field
   whose whole purpose is to be copied is the wrong economy.
   Fixed width in `ch` so columns still line up in a mono font; a long key takes
   two lines and a short one does not pad. */
.audit-row .a-session{color:var(--accent);flex-shrink:0;width:32ch;word-break:break-all}
.audit-row .a-tool{color:var(--amber);flex-shrink:0;min-width:70px}
.audit-row .a-detail{color:var(--text);word-break:break-all}
.audit-row.err .a-tool{color:var(--red)}
.help{max-width:860px;font-size:13.5px;line-height:1.65}
.help h2{font-size:15px;margin:20px 0 8px;color:var(--text)}
.help h2:first-child{margin-top:0}
.help p{margin:6px 0;color:var(--text)}
.help .dim{color:var(--dim)}
.help table{border-collapse:collapse;margin:8px 0;width:100%}
.help th,.help td{border:1px solid var(--line);padding:6px 10px;text-align:left;font-size:12.5px;vertical-align:top}
.help th{color:var(--dim);font-weight:600;background:var(--panel)}
.help code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:12px}
.help pre{background:#0b0f14;border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.5}
.help li{margin:3px 0}
.badge.running{color:var(--amber)}
.badge.completed{color:var(--green)}
.badge.failed{color:var(--red)}
section{flex:1;display:flex;flex-direction:column;min-width:0}
#meta{padding:8px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);
      font-family:var(--mono);min-height:36px;word-break:break-all}
#turns{flex:1;overflow-y:auto;padding:16px}
.turn{margin-bottom:20px}
.q,details.q{background:#152238;border:1px solid #1f3a5f;border-radius:8px;padding:8px 12px;margin-bottom:8px;
   white-space:pre-wrap;word-break:break-word;font-size:13px}
details.q summary{cursor:pointer;color:var(--dim);white-space:normal}
.a pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;
       white-space:pre-wrap;word-break:break-word;margin:0;font-family:var(--mono);font-size:12.5px}
.a.err pre{border-color:var(--red)}
.stats{color:var(--dim);font-size:11px;font-family:var(--mono);margin-top:5px;padding-left:2px}
.proc{border-left:2px solid var(--line);margin:6px 0 8px 6px;padding-left:10px}
.ev{font-family:var(--mono);font-size:11.5px;color:var(--dim);padding:2px 0;word-break:break-all}
.ev-tool{color:var(--accent);margin-right:8px}
.ev-ms{color:var(--dim);font-size:10px}
#spend{display:flex;align-items:flex-end;gap:2px;padding:4px 2px 2px;min-height:0}
.spend-bar{width:9px;display:inline-flex;align-items:flex-end;height:24px;cursor:default}
.spend-bar i{display:block;width:100%;background:var(--accent);opacity:.55;border-radius:1px}
.spend-total{color:var(--dim);font-size:10px;font-family:var(--mono);margin-left:6px;align-self:center}
#worth{color:var(--dim);font-size:10px;font-family:var(--mono);padding:0 2px 6px}
.ev-sub{padding-left:16px;opacity:.85}
.ev-err .ev-tool{color:var(--bad)}
.ev-changed{color:var(--amber)}
.tamper{border:1px solid var(--red);border-radius:6px;padding:8px 10px;margin:6px 0}
.tamper-head{color:var(--red);font-size:12px;font-weight:600}
.tamper .proc{border-left-color:var(--red);margin-bottom:0}
.ev-narr{font-family:inherit;font-style:italic;color:#9daebe;white-space:pre-wrap}
.ev-live{font-family:inherit;white-space:pre-wrap;color:var(--text)}
.ev-live.thinking{font-style:italic;color:var(--dim)}
.ev-live::after{content:"▌";color:var(--accent);animation:none}
details.proc-past{margin:6px 0 8px 6px}
details.proc-past summary{cursor:pointer;color:var(--dim);font-size:12px}
.skill{padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;cursor:pointer;background:var(--panel)}
.skill:hover{border-color:var(--accent)}
.skill-name{color:var(--accent);font-family:var(--mono);font-size:13px}
.skill-desc{font-size:13px;margin-top:3px}
.skill-meta{color:var(--dim);font-size:11px;margin-top:5px;font-family:var(--mono)}
.skill-back{color:var(--accent);cursor:pointer;margin-bottom:10px;font-size:13px}
.skill-layer{font-size:10px;border:1px solid var(--line);border-radius:8px;padding:1px 6px;color:var(--dim);margin-left:8px;font-family:var(--mono)}
.skill-layer.user{color:var(--accent);border-color:var(--accent)}
.skill-layer.unreviewed{color:var(--amber);border-color:var(--amber)}
.skill-layer.proposal{color:var(--accent);border-color:var(--accent)}
.rem{border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:8px 10px}
.rem-head{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.rem-cmd{font-family:var(--mono);font-size:11.5px;color:var(--text);margin:2px 0 0 4px}
.rem-roll{font-size:11px;color:var(--dim);margin-left:4px}
.rem-out{font-family:var(--mono);font-size:11px;background:var(--line);border-radius:4px;padding:4px 6px;margin:4px 0 0 4px;white-space:pre-wrap;max-height:180px;overflow:auto}
.rem-status{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.badge.executed{color:var(--ok);border-color:var(--ok)}
.badge.failed,.badge.rejected{color:var(--bad);border-color:var(--bad)}
.badge.running{color:var(--amber);border-color:var(--amber)}
.review-head{font-size:11px;color:var(--amber);margin:10px 2px 4px;text-transform:uppercase;letter-spacing:.4px}
.review-head.quiet{color:var(--dim)}
.hist-diff{color:var(--accent);cursor:pointer;margin-left:8px;text-decoration:underline}
.diff{font-family:var(--mono);font-size:11.5px;margin-top:8px;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.diff-row{white-space:pre-wrap;word-break:break-all;padding:1px 4px}
.diff-row.add{color:var(--ok);background:rgba(61,214,140,.07)}
.diff-row.del{color:var(--bad);background:rgba(229,72,77,.07)}
.diff-row.ctx{color:var(--dim)}
.diff-row.ctx.quiet{text-align:center;font-style:italic}
.skill-bar{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.skill-bar .spacer{flex:1}
.skill-bar .skill-back{margin-bottom:0}
.skill-note{color:var(--dim);font-size:11px}
button.danger{color:var(--red);border-color:var(--red)}
#skillSrc{width:100%;min-height:420px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-family:var(--mono);font-size:12.5px;padding:12px;line-height:1.55}
#skillSrc:focus{outline:none;border-color:var(--accent)}
.ev-todos{font-family:inherit;padding:4px 0}
/* the run's own telemetry: model and tool calls on one time axis */
.wf{border-left:2px solid var(--line);margin:6px 0 8px 6px;padding-left:10px}
.wf-row{display:grid;grid-template-columns:30px minmax(120px,1fr) minmax(240px,48%);gap:10px;align-items:center;padding:2px 0;font-family:var(--mono);font-size:11px;color:var(--dim)}
.wf-split{display:flex;height:6px;margin:8px 0 2px 6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.05)}
.wf-seg.model{background:var(--accent)}.wf-seg.tool{background:var(--amber)}.wf-seg.gap{background:transparent}
.wf-then{color:var(--amber)}.wf-label.failed{color:var(--bad)}
.wf-label.model{color:var(--accent)}.wf-label.tool{color:var(--amber)}
.wf-track{position:relative;height:9px;border-radius:3px;background:rgba(255,255,255,.05)}
.wf-bar{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--accent);opacity:.85}
.wf-bar.tool{background:var(--amber)}.wf-bar.failed{background:var(--bad)}
.wf-text{word-break:break-all}
.ev-todos div{padding:1px 0;color:var(--text);font-size:12.5px}
.ev-todos .todo-done{color:var(--dim);text-decoration:line-through}
.ev-todos .todo-active{color:var(--amber)}
#stopBtn{border-color:var(--red);color:var(--red)}
#handoffBtn{border-color:var(--accent);color:var(--accent)}
.rule-bar{padding:6px 16px;font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center}
.rule{font-size:12px;padding:2px 8px;cursor:pointer}
.rule.on{border-color:var(--accent);color:var(--accent)}
#memEdit{width:100%;min-height:420px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-family:var(--mono);font-size:12.5px;padding:12px;resize:vertical;box-sizing:border-box}
#memEdit:focus{outline:none;border-color:var(--accent)}
.mem-tip{color:var(--dim);font-size:12px;margin-bottom:10px}
.mem-bar{margin-top:10px;display:flex;gap:12px;align-items:center}
#memStatus{color:var(--green);font-size:12px}
.md{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  font-size:13.5px;line-height:1.65;word-break:break-word}
.a.err .md{border-color:var(--red)}
.md h1,.md h2,.md h3,.md h4{margin:12px 0 6px;line-height:1.3}
.md h1{font-size:16px}.md h2{font-size:15px}.md h3,.md h4{font-size:14px}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:24px}
.md li{margin:2px 0}
.md code{background:#22282f;border:1px solid var(--line);border-radius:4px;padding:0 4px;
  font-family:var(--mono);font-size:12px}
.md pre.code{background:#0b0f14;border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;
  white-space:pre-wrap;word-break:break-word;margin:8px 0}
.md pre.code code{background:none;border:none;padding:0;font-size:12px}
.md table{border-collapse:collapse;margin:8px 0;font-size:12.5px}
.md th,.md td{border:1px solid var(--line);padding:4px 10px;text-align:left}
.md th{background:#1a2027}
.md a{color:var(--accent)}
.pending{color:var(--amber);padding:8px 12px;font-size:13px}
.pending::after{content:"…";animation:dots 1.2s steps(3,end) infinite}
@keyframes dots{0%{content:""}33%{content:"."}66%{content:".."}100%{content:"..."}}
#hint{padding:0 16px 6px;font-size:12px;color:var(--red);min-height:18px}
#composer{display:flex;gap:8px;padding:0 16px 14px}
#msg{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);
     padding:8px 10px;resize:vertical;min-height:46px;font:inherit}
#msg:focus{outline:none;border-color:var(--accent)}
.empty{color:var(--dim);padding:26px;text-align:center}
/* Responsive: an on-call person opens a session from a card on their phone. The
   330px sidebar and side-by-side layout stack under 720px. Additive only —
   desktop (>720px) is untouched. */
@media (max-width:720px){
  main{flex-direction:column}
  aside{width:auto;max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}
  header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px}
  #token{margin-left:0;width:100%}
  .kv-grid{grid-template-columns:1fr}
  .audit-row .a-session{width:auto}
  pre,table{overflow-x:auto}
}
</style>
</head>
<body>
<header>
  <h1>hookprobe <span>· work</span></h1>
  <button id="new">+ new session</button>
  <span id="budget" hidden></span>
  <span class="stamp" id="stamp"></span>
  <span class="rc">
    <button id="rNow" title="refresh now">&#8635;</button>
    <span id="rLive" class="live" title="live connection">live</span>
  </span>
  <input id="token" placeholder="bearer token" autocomplete="off">
</header>
<nav class="tabs">
  <button class="tab" id="workBtn">work <span class="count" id="workCount"></span></button>
  <button class="tab active" id="sessionsTab">sessions</button>
  <button class="tab" id="approvalsBtn">approvals <span class="count" id="apprCount"></span></button>
  <span class="tab-group"><span class="tab-group-label">knowledge</span>
    <button class="tab" id="skillsBtn">skills</button>
    <button class="tab" id="agentsBtn">agents</button>
    <button class="tab" id="memBtn">memory</button>
    <button class="tab" id="promptBtn">prompt</button>
  </span>
  <span class="tab-group"><span class="tab-group-label">runtime</span>
    <button class="tab" id="sysBtn">system</button>
    <button class="tab" id="actionsBtn">actions</button>
    <button class="tab" id="auditBtn">audit</button>
  </span>
  <button class="tab" id="helpBtn" style="margin-left:auto">help</button>
</nav>
<main>
  <aside>
    <input id="q" placeholder="filter sessions…" autocomplete="off">
    <div id="spend" title=""></div>
    <div id="worth"></div>
    <div id="list"><div class="empty">loading…</div></div>
  </aside>
  <section>
    <div id="meta"></div>
    <div id="prov" class="prov"></div>
    <div id="turns"><div class="empty">select a session on the left, or start a new one</div></div>
    <div id="hint"></div>
    <form id="composer">
      <textarea id="msg" placeholder="new session: describe what to investigate… (Enter sends, Shift+Enter for a new line)"></textarea>
      <button id="stopBtn" type="button" style="display:none">Stop</button>
      <button id="handoffBtn" type="button" style="display:none" title="send this report to the pipe door this runner is wired to">Hand off</button>
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </section>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
let sel = null;
let composeMode = false; // "+ new session" pressed: keep the pane free until they send
let viewMode = "sessions"; // or "skills"

  /* ── hookstack token wiring · keep this block identical in all three pages ── */
  /* Three services had three ways to type the same kind of secret: an input box
     here, a window.prompt there, and a third key-naming convention. The visual
     unification pass caught the palette and missed the interaction, so this is
     pinned by scripts/assert_design.py like the palette is.
     A `prompt` is the one shape deliberately not used: it can only be answered
     when the page decides to ask, so replacing a token means clearing
     localStorage by hand. */
  function tokenWire(inputId, buttonId, key, onSaved) {
    var input = document.getElementById(inputId);
    var save = document.getElementById(buttonId);
    if (input) input.value = localStorage.getItem(key) || "";
    if (save) save.addEventListener("click", function () {
      localStorage.setItem(key, (input.value || "").trim());
      onSaved();
    });
  }
  function tokenReveal(needed) {
    var bar = document.getElementById("tokenbar");
    if (bar) bar.classList[needed ? "add" : "remove"]("show");
  }
  /* ── end token wiring ───────────────────────────────────────────────────── */
// Hyphens, like the other two keys. The underscore was a third naming convention
// across three services for one idea. The old key is read once, so a browser that
// already holds a token is not asked to retype it.
const TOKEN_KEY = "hookprobe-token";
const tokenEl = $("#token");
const legacyToken = localStorage.getItem(TOKEN_KEY);
if (legacyToken && !localStorage.getItem(TOKEN_KEY)) {
  localStorage.setItem(TOKEN_KEY, legacyToken);
  localStorage.removeItem("hookprobe_token");
}
// Always visible rather than revealed on 401, and that difference is deliberate:
// this token opens every route on this service, so there is no useful page to
// show without it. The pipe and the brain reveal theirs because their boards
// read fine the moment one is supplied.
tokenEl.value = localStorage.getItem(TOKEN_KEY) || "";
tokenEl.addEventListener("change", () => {
  localStorage.setItem(TOKEN_KEY, tokenEl.value.trim());
  tokenEl.classList.remove("bad");
  refreshList();
});

function readHeaders() {
  const token = tokenEl.value.trim();
  return token ? { Authorization: "Bearer " + token } : {};
}

async function api(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  const t = tokenEl.value.trim();
  if (t) headers["Authorization"] = "Bearer " + t;
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) {
    tokenEl.classList.add("bad");
    throw new Error("unauthorized — paste the bearer token (top right)");
  }
  return r;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
// esc() escapes text nodes, which leaves the double quote alone; attribute
// values need it too.
function attr(s) {
  return esc(s).replace(/"/g, "&quot;");
}
function pretty(t) {
  try { return JSON.stringify(JSON.parse(t), null, 2); } catch { return t; }
}

// --- tiny escape-first markdown renderer ---------------------------------
// Everything is HTML-escaped up front; the only tags in the output are the
// ones these transforms construct, and link hrefs must be http(s).
function mdInline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    // esc() upstream leaves the double quote alone (it escapes text nodes), so a
    // URL like https://x/"onmouseover="alert(1) would close the href and add a
    // handler. The label came through esc() already; the href needs attr()'s
    // quote-escaping too before it goes inside href="…".
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      (_m, label, url) => '<a href="' + attr(url) + '" target="_blank" rel="noopener">' + label + "</a>");
}
function mdToHtml(src) {
  let text = esc(src || "");
  const fences = [];
  text = text.replace(/```[^\n]*\n?([\s\S]*?)```/g, (_, body) => {
    fences.push(body);
    return "" + (fences.length - 1) + "";
  });
  const out = [];
  let list = null;
  let para = [];
  let tbl = [];
  const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
  const flushPara = () => {
    if (para.length) { out.push("<p>" + para.map(mdInline).join("<br>") + "</p>"); para = []; }
  };
  const flushTable = () => {
    if (!tbl.length) return;
    const rows = tbl;
    tbl = [];
    const cells = (r) => r.replace(/^\|/, "").replace(/\|\s*$/, "").split("|").map((c) => mdInline(c.trim()));
    if (rows.length >= 2 && /^[\s|:\-]+$/.test(rows[1])) {
      const head = cells(rows[0]);
      const body = rows.slice(2).map(cells);
      out.push(
        "<table><thead><tr>" + head.map((h) => "<th>" + h + "</th>").join("") + "</tr></thead><tbody>" +
        body.map((r) => "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>").join("") +
        "</tbody></table>",
      );
    } else {
      para.push(...rows);
      flushPara();
    }
  };
  for (const line of text.split("\n")) {
    if (/^\d+\s*$/.test(line)) { flushPara(); flushTable(); closeList(); out.push(line.trim()); continue; }
    if (/^\s*\|/.test(line)) { flushPara(); closeList(); tbl.push(line.trim()); continue; }
    flushTable();
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { flushPara(); closeList(); out.push(`<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`); continue; }
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    if (ul) { flushPara(); if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; } out.push("<li>" + mdInline(ul[1]) + "</li>"); continue; }
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ol) { flushPara(); if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; } out.push("<li>" + mdInline(ol[1]) + "</li>"); continue; }
    if (!line.trim()) { flushPara(); closeList(); continue; }
    closeList();
    para.push(line);
  }
  flushPara(); flushTable(); closeList();
  const html = out.join("\n").replace(/(\d+)/g, (_, i) => '<pre class="code"><code>' + fences[Number(i)] + "</code></pre>");
  return '<div class="md">' + html + "</div>";
}
function answerHtml(text) {
  const raw = text || "";
  try { JSON.parse(raw); return `<pre>${esc(pretty(raw))}</pre>`; } catch { /* not JSON */ }
  return mdToHtml(raw);
}
function fmtTime(ts) { return ts ? new Date(ts * 1000).toLocaleString() : ""; }

function returnFlag(x) {
  if (x.origin !== "relay") return "";
  if ((x.return_status || "").startsWith("failed")) return '<span class="flag retfail">return failed</span>';
  if (x.return_status === "sent") return '<span class="flag sent">returned</span>';
  return '<span class="flag">relay</span>';
}

// A person's ruling on this investigation, pressed on the card it arrived as.
// Absent until somebody says: an unruled run is unrated, never "not useful",
// and the aggregate under the spend bars counts it the same way.
// How often the posture had to refuse this run. Absent at zero, which is the
// healthy case and most of them — a chip that shows on every row is furniture.
// A number here is the difference between an agent narrowing a query and an
// agent being steered into the guard, which was invisible until it was counted.
function guardFlag(x) {
  const n = Number(x.guard_trips || 0);
  if (!n) return "";
  return `<span class="flag retfail" title="the read-only guard refused ${n} call${n > 1 ? "s" : ""} in this run">refused ${n}</span>`;
}

function rulingFlag(x) {
  if (x.ruling === "useful") return '<span class="flag sent">found the cause</span>';
  if (x.ruling === "useless") return '<span class="flag retfail">missed it</span>';
  return "";
}

// Fourteen days of spend as one quiet row of bars — the answer to "what is
// this costing lately" without a metrics stack. Computed from the same list
// the board already fetched; unfiltered on purpose, so searching for a
// session does not appear to change what the month cost.
function renderSpend(runs) {
  const el = $("#spend");
  if (!el) return;
  const day = 86400, now = Date.now() / 1000;
  const days = Array.from({ length: 14 }, (_, i) => {
    const start = (Math.floor(now / day) - (13 - i)) * day;
    return { start, cost: 0, count: 0 };
  });
  for (const x of runs) {
    const idx = Math.floor((x.created_at - days[0].start) / day);
    if (idx >= 0 && idx < 14) { days[idx].cost += Number(x.cost_usd) || 0; days[idx].count += 1; }
  }
  const total = days.reduce((s, d) => s + d.cost, 0);
  if (!days.some((d) => d.count)) { el.innerHTML = ""; return; }
  const peak = Math.max(...days.map((d) => d.cost), 0.0001);
  el.innerHTML =
    days.map((d) => {
      const h = d.cost > 0 ? Math.max(2, Math.round((d.cost / peak) * 22)) : (d.count ? 2 : 0);
      const label = new Date(d.start * 1000).toISOString().slice(5, 10);
      return `<span class="spend-bar" title="${label} · $${d.cost.toFixed(3)} · ${d.count} run${d.count === 1 ? "" : "s"}">` +
        `<i style="height:${h}px"></i></span>`;
    }).join("") +
    `<span class="spend-total">14d $${total.toFixed(2)}</span>`;
}

async function refreshList() {
  try {
    let runs = await (await api("/v1/runs")).json();
    renderSpend(runs);
    const q = ($("#q").value || "").toLowerCase();
    if (q) runs = runs.filter((x) => (x.session_key + " " + (x.title || "")).toLowerCase().includes(q));
    const el = $("#list");
    if (!runs.length) { el.innerHTML = `<div class="empty">${q ? "no sessions match" : "no sessions yet"}</div>`; return; }
    el.innerHTML = runs.map((x) => `
      <div class="item ${x.session_key === sel ? "sel" : ""}" data-key="${esc(x.session_key)}">
        <div class="key">${esc(x.session_key)}</div>
        <div class="title">${esc(x.title || "")}</div>
        <div class="meta">
          <span class="badge ${esc(x.status)}">${esc(x.status)}</span>
          ${returnFlag(x)}
          ${rulingFlag(x)}
          ${guardFlag(x)}
          <span>${x.turn_count} turn${x.turn_count > 1 ? "s" : ""}</span>
          ${x.model ? `<span>${esc(modelWithEndpoint(x.model, x.model_endpoint))}</span>` : ""}
          ${x.cost_usd ? `<span>$${Number(x.cost_usd).toFixed(3)}</span>` : ""}
          <span>${fmtTime(x.created_at)}</span>
        </div>
      </div>`).join("");
    el.querySelectorAll(".item").forEach((n) => (n.onclick = () => select(n.dataset.key)));
    // Land on the latest investigation, but never steal the pane from a
    // deliberate "+ new session" or the skills browser.
    if (!sel && !composeMode && viewMode === "sessions" && runs.length) select(runs[0].session_key);
  } catch (e) { $("#hint").textContent = e.message; }
}

async function select(key) {
  stopWatching();          // the previous session's feed is no longer on screen
  sel = key;
  composeMode = false;
  sessionsMode();
  $("#hint").textContent = "";
  refreshList();
  await renderDetail(true);
}

function markTab(id) {
  document.querySelectorAll("nav.tabs .tab").forEach((b) => b.classList.toggle("active", b.id === id));
}

// Where a run came from and where it answers to — a person in chat, an alert
// through a door, a thread it keeps replying into, and the chain in the pipe.
function provenanceHtml(run) {
  const m = run.meta || {};
  const bits = [];
  if (m.asked_by) bits.push(`opened from chat by <b>${esc(m.asked_by)}</b>`);
  else if (m.source) bits.push(`from door <b>${esc(m.source)}</b>${m.event_id != null ? ` · event ${esc(String(m.event_id))}` : ""}`);
  if (m.thread_root) bits.push(`answers into thread <span class="mono">${esc(m.thread_root)}</span>`);
  const n = (m.follow_ups || []).length;
  if (n) bits.push(`${n} follow-up${n > 1 ? "s" : ""} from the thread${m.follow_up_by ? ` (last by <b>${esc(m.follow_up_by)}</b>)` : ""}`);
  if (m.refires) bits.push(`re-fired ${m.refires}× · joined this session instead of a cold start`);
  if ((run.links || {}).chain) bits.push(`<a href="${esc(run.links.chain)}" target="_blank" rel="noopener">chain in the pipe ↗</a>`);
  return bits.join(" · ");
}

function sessionsMode() {
  viewMode = "sessions";
  markTab("sessionsTab");
  $("#composer").style.display = "";
}

function qHtml(m) {
  if (!m) return "";
  if (m.length > 400) {
    return `<details class="q"><summary>${esc(m.slice(0, 180))}…</summary>${esc(m)}</details>`;
  }
  return `<div class="q">${esc(m)}</div>`;
}
function fmtTok(n) {
  n = Number(n) || 0;
  return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(n);
}
function modelWithEndpoint(model, endpoint) {
  // The name is what was REQUESTED; an Anthropic-compatible gateway serves it
  // with whatever it likes, and nothing on the wire tells us which. So show the
  // destination: `opus-5` alone reads as Anthropic to every reader, and on this
  // deployment it has meant DeepSeek and then BigModel. api.anthropic.com is
  // left unlabelled — there the name IS the server.
  if (!model) return "";
  const short = String(model).replace(/^claude-/, "");
  const host = String(endpoint || "");
  return host && host !== "api.anthropic.com" ? `${short} @ ${host}` : short;
}
function modelLabel(mu) {
  // The engine bills every model that ran, including tiny helpers (session
  // titles run on haiku). Lead with the model that did the work, fold the
  // helpers in as aux with their own bill so the split is obvious.
  const entries = Object.entries(mu || {}).map(([name, v]) => ({
    name: name.replace(/^claude-/, "").replace(/-\d{8}$/, ""),
    cost: Number((v || {}).costUSD ?? (v || {}).cost_usd ?? 0),
    out: Number((v || {}).outputTokens ?? (v || {}).output_tokens ?? 0),
  }));
  if (!entries.length) return "";
  entries.sort((a, b) => b.cost - a.cost || b.out - a.out);
  const aux = entries.slice(1).map((e) => (e.cost ? `${e.name} $${e.cost.toFixed(4)}` : e.name));
  return entries[0].name + (aux.length ? ` (aux: ${aux.join(", ")})` : "");
}
function statsHtml(t) {
  const u = t.usage || {};
  const pick = (a, b) => (u[a] != null ? u[a] : u[b]); // engine reports snake_case; tolerate camelCase
  const bits = [];
  const label = modelLabel(t.model_usage);
  if (label) bits.push(label);
  const tin = pick("input_tokens", "inputTokens"), tout = pick("output_tokens", "outputTokens");
  const cr = pick("cache_read_input_tokens", "cacheReadInputTokens");
  const cw = pick("cache_creation_input_tokens", "cacheCreationInputTokens");
  if (tin != null) bits.push(`in ${fmtTok(tin)}`);
  if (tout != null) bits.push(`out ${fmtTok(tout)}`);
  if (cr != null || cw != null) bits.push(`cache ${fmtTok(cr)}r/${fmtTok(cw)}w`);
  if (t.cost_usd != null) bits.push(`$${Number(t.cost_usd).toFixed(4)}`);
  if (t.duration_ms != null) bits.push(`${(t.duration_ms / 1000).toFixed(1)}s`);
  // How full the context was when this turn ended. A patrol on this deployment
  // died on "the model has reached its context window limit" and nothing
  // anywhere had said it was close; the runtime knew all along.
  const ctx = t.context || null;
  const pct = ctx && ctx.percent != null ? Math.round(ctx.percent) : null;
  const line = bits.length ? `<div class="stats">${esc(bits.join("  ·  "))}` : "";
  const ctxBit = pct == null ? "" :
    `  ·  <span class="${pct >= 80 ? "ctx-hot" : ""}" title="${attr(fmtTok(ctx.tokens) + " of " + fmtTok(ctx.limit) +
      (ctx.auto_compact ? " · the runtime folds it away on its own before the limit" : " · no automatic compaction"))}">context ${pct}%</span>`;
  const folds = (t.compactions || []).length;
  const foldBit = folds ? `  ·  <span class="ctx-hot">context folded ${folds}×</span>` : "";
  return line ? `${line}${ctxBit}${foldBit}</div>` : "";
}
function fmtMs(ms) {
  if (ms == null) return "";
  return ms < 1000 ? `${ms}ms` : `${(ms / 1000).toFixed(ms < 10000 ? 1 : 0)}s`;
}
function eventHtml(e) {
  if (e.type === "tool_use") {
    if (e.name === "TodoWrite" && Array.isArray(e.todos)) {
      const mark = { completed: "☑", in_progress: "◐", pending: "☐" };
      const cls = { completed: "todo-done", in_progress: "todo-active", pending: "" };
      return `<div class="ev ev-todos">${e.todos
        .map((t) => `<div class="${cls[t.status] || ""}">${mark[t.status] || "☐"} ${esc(t.content)}</div>`)
        .join("")}</div>`;
    }
    // sub: a tool call the message stream never carried — a subagent's, known
    // only from the hooks. Indented under whichever Task spawned it, without
    // pretending to know which one that was.
    const dur = e.ms != null ? ` <span class="ev-ms">${fmtMs(e.ms)}</span>` : "";
    return `<div class="ev${e.sub ? " ev-sub" : ""}${e.error ? " ev-err" : ""}"${e.id ? ` data-tid="${attr(e.id)}"` : ""}>` +
      `<span class="ev-tool">${e.sub ? "↳ " : ""}${esc(e.name)}</span>${esc(e.detail || "")}${dur}</div>`;
  }
  if (e.type === "text") return `<div class="ev ev-narr">${esc(e.text)}</div>`;
  return "";
}
// What the model was actually given. The prompt is assembled from files on a
// mutable volume, so the record of which ones were in force is the only way to
// explain a report later.
// A recorded digest is the same string on every run until somebody edits the
// file, so printing it is noise dressed as evidence. The one question it can
// answer is comparative — does this file still say what it said when the run
// used it? — so the digest is compared here against the file as it stands now
// (`inputs_now`, from the read path) and only its answer is shown. The hex
// stays on hover for anyone lining up two reports by hand.
function factHtml(f, now, unknown) {
  const size = !f ? "absent" : f.bytes ? `${f.bytes}B` : "empty";
  const title = f ? `${f.path} · sha256 ${f.sha256}` : "not present when this run started";
  if (unknown) return { text: size, title };
  const recorded = f ? f.sha256 : null;
  if (recorded === now) return { text: size, title };
  const verb = !recorded ? "added" : now === null ? "removed" : "edited";
  return { text: `${size} · ${verb} since this run`, title, warn: true };
}
function inputsHtml(inputs, now) {
  const i = inputs || {};
  if (!i.model) return "";
  const layer = (names) => (names && names.length ? names.join(", ") : "none");
  const fact = (f, key) => factHtml(f, now ? now[key] : null, !now || !(key in now));
  const rows = [
    ["model", i.model + (i.resumed ? " · resumed" : "")],
    ["skills", `filter ${i.skills?.filter ?? "—"}` +
      (i.skills?.project ? ` · project: ${layer(i.skills.project)}` : "") +
      (i.skills?.user ? ` · host: ${layer(i.skills.user)}` : "")],
    ["roles", `files: ${layer(i.agents?.files)} · config: ${layer(i.agents?.config)}`],
    ["mcp", layer(i.mcp_servers)],
    ["memory", fact(i.memory, "memory")],
    ["prompt append", fact(i.system_prompt_append, "system_prompt_append")],
  ];
  return `<details class="proc-past"><summary>inputs · what the model was given</summary>
    <div class="proc">${rows
      .map(([k, v]) => {
        const cell = typeof v === "string" ? { text: v } : v;
        return `<div class="ev"${cell.title ? ` title="${attr(cell.title)}"` : ""}>` +
          `<span class="ev-tool">${esc(k)}</span>` +
          `<span class="${cell.warn ? "ev-changed" : ""}">${esc(cell.text)}</span></div>`;
      })
      .join("")}</div></details>`;
}
// A run that edited its own instructions does not get folded away like the
// rest of the record. The report below it was written by something that also
// changed what writes the next one, and reading the report without knowing
// that is worse than not reading it: nothing else on the page would say so.
function tamperHtml(changes) {
  const list = changes || [];
  if (!list.length) return "";
  const rows = list.map((c) => `<div class="ev"><span class="ev-changed">${esc(c)}</span></div>`).join("");
  return `<div class="tamper"><div class="tamper-head">this run changed its own inputs</div>
    <div class="proc">${rows}</div></div>`;
}
function turnHtml(t, now) {
  const evs = t.events || [];
  const proc = evs.length
    ? `<details class="proc-past"><summary>process · ${evs.length} steps</summary>
         <div class="proc">${evs.map(eventHtml).join("")}</div></details>`
    : "";
  return `<div class="turn">${qHtml(t.message)}${tamperHtml(t.input_changes)}${inputsHtml(t.inputs, now)}${proc}
    <div class="a ${t.error ? "err" : ""}">${answerHtml(t.text)}</div>${statsHtml(t)}</div>`;
}
// Where the time and the money went. The CLI reports every model call and tool
// result with a duration and a bill; shown as ROUNDS — one model call and the
// tools it asked for — because that is the unit a person reasons in, and
// twenty-five bars are not. Closed by default: the record above is the answer;
// this is for when the answer took too long or cost too much, and it says which
// round did it.
function waterfallHtml(w) {
  const items = ((w && w.waterfall) || []).slice().sort((a, b) => a.start - b.start || a.end - b.end);
  const s = (w && w.summary) || {};
  if (!items.length) return "";
  const t0 = Math.min(...items.map((i) => i.start));
  const span = Math.max(Math.max(...items.map((i) => i.end)) - t0, 0.001);
  // Union of everything on the axis; what is left is the run thinking, or the harness.
  let covered = 0, cursor = -Infinity;
  for (const i of items) {
    const a = Math.max(i.start, cursor), b = i.end;
    if (b > a) covered += b - a;
    cursor = Math.max(cursor, b);
  }
  const modelBusy = (s.model_busy_ms != null ? s.model_busy_ms : s.model_ms || 0) / 1000;
  const toolBusy = Math.max(0, Math.min(covered, span) - Math.min(modelBusy, span));
  const between = Math.max(0, span - Math.min(covered, span));
  const pct = (x) => `${Math.round((100 * x) / span)}%`;
  const rounds = [];
  for (const i of items) {
    if (i.kind === "model") rounds.push({ model: i, tools: [] });
    else if (rounds.length) rounds[rounds.length - 1].tools.push(i);
    else rounds.push({ model: null, tools: [i] });
  }
  const cost = (r) => Number((r.model && r.model.cost_usd) || 0);
  const totalCost = rounds.reduce((acc, r) => acc + cost(r), 0);
  const x = (v) => ((100 * (v - t0)) / span).toFixed(2);
  const wd = (a, b) => Math.max((100 * (b - a)) / span, 0.4).toFixed(2);
  const rows = rounds.map((r, n) => {
    const m = r.model;
    const toolMs = r.tools.reduce((acc, t) => acc + (t.duration_ms || 0), 0);
    const names = {};
    r.tools.forEach((t) => { names[t.name] = (names[t.name] || 0) + 1; });
    const then = r.tools.length
      ? `then ${r.tools.length} tool${r.tools.length > 1 ? "s" : ""} ${fmtMs(toolMs)} · ` +
        Object.entries(names).map(([k, v]) => (v > 1 ? `${k} ×${v}` : k)).join(", ")
      : "";
    const share = totalCost ? Math.round((100 * cost(r)) / totalCost) : 0;
    const bits = [];
    if (m) {
      bits.push(fmtMs(m.duration_ms));
      bits.push(`$${cost(r).toFixed(4)}${share >= 25 ? ` (${share}% of the run)` : ""}`);
      if (m.output_tokens != null) bits.push(`out ${fmtTok(m.output_tokens)}`);
      if (m.cache_creation_tokens) bits.push(`wrote ${fmtTok(m.cache_creation_tokens)} to cache`);
      else if (m.cache_read_tokens) bits.push(`cache ${fmtTok(m.cache_read_tokens)}`);
      if (m.success === false) bits.push(`failed${m.status_code ? " " + m.status_code : ""}`);
    }
    const bars =
      (m ? `<div class="wf-bar model${m.success === false ? " failed" : ""}" style="left:${x(m.start)}%;width:${wd(m.start, m.end)}%"></div>` : "") +
      (r.tools.length ? `<div class="wf-bar tool" style="left:${x(r.tools[0].start)}%;width:${wd(r.tools[0].start, r.tools[r.tools.length - 1].end)}%"></div>` : "");
    return `<div class="wf-row"><span class="wf-label ${m && m.success === false ? "failed" : "model"}">#${n + 1}</span>` +
      `<div class="wf-track">${bars}</div>` +
      `<span class="wf-text">${esc(bits.join(" · "))}${then ? ` <span class="wf-then">${esc(then)}</span>` : ""}</span></div>`;
  });
  const models = items.filter((i) => i.kind === "model");
  const slowestModel = models.slice().sort((a, b) => b.duration_ms - a.duration_ms)[0];
  const slowestTool = items.filter((i) => i.kind === "tool").sort((a, b) => b.duration_ms - a.duration_ms)[0];
  const costly = rounds.map((r, n) => ({ n: n + 1, c: cost(r) })).filter((r) => r.c > 0).sort((a, b) => b.c - a.c).slice(0, 2);
  const costlyShare = totalCost ? Math.round((100 * costly.reduce((a, r) => a + r.c, 0)) / totalCost) : 0;
  const head = `where the time went · ${fmtMs(Math.round(span * 1000))}: ${pct(modelBusy)} waiting on the model, ` +
    `${pct(toolBusy)} in tools, ${pct(between)} between · ${models.length} round${models.length === 1 ? "" : "s"}` +
    (s.api_errors ? ` · ${s.api_errors} failed call${s.api_errors > 1 ? "s" : ""}` : "");
  const facts = [];
  if (slowestModel) {
    facts.push(`slowest model call: #${rounds.findIndex((r) => r.model === slowestModel) + 1}, ${fmtMs(slowestModel.duration_ms)}` +
      (slowestModel.output_tokens != null ? ` for ${fmtTok(slowestModel.output_tokens)} out` : ""));
  }
  if (slowestTool) facts.push(`slowest tool: ${slowestTool.name} ${fmtMs(slowestTool.duration_ms)}`);
  if (costly.length) facts.push(`costliest: ${costly.map((r) => `#${r.n} $${r.c.toFixed(2)}`).join(", ")} — ${costlyShare}% of $${totalCost.toFixed(2)}`);
  return `<details class="proc-past"><summary>${esc(head)}</summary>` +
    `<div class="wf-split"><span class="wf-seg model" style="width:${pct(modelBusy)}" title="model"></span>` +
    `<span class="wf-seg tool" style="width:${pct(toolBusy)}" title="tools"></span>` +
    `<span class="wf-seg gap" style="width:${pct(between)}" title="between"></span></div>` +
    `<div class="stats">${esc(facts.join("  ·  "))}</div>` +
    `<div class="wf">${rows.join("")}</div></details>`;
}

// The open run's steps, pushed rather than polled. The shared refresh control
// owns the only clock on this page and defaults to a minute, which is right for
// a board and wrong for the seconds after you press send — so a run in flight
// is watched over a streaming response instead of by a second timer.
//
// fetch + ReadableStream, not EventSource: every call here carries the bearer
// token as a header, and EventSource cannot send headers.
let runAbort = null;
async function watchRun(key) {
  stopWatching();
  const controller = new AbortController();
  runAbort = controller;
  let response;
  try {
    response = await api("/v1/runs/" + encodeURIComponent(key) + "/stream", { signal: controller.signal });
    if (!response.ok || !response.body) return;
  } catch { return; }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffered = "";
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffered += decoder.decode(value, { stream: true });
      const lines = buffered.split("\n");
      buffered = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        let msg;
        try { msg = JSON.parse(line); } catch { continue; }
        if (key !== sel) return;                      // the operator moved on
        if (msg.type === "ping") continue;
        if (msg.type === "snapshot") { liveReplace(msg.events || []); continue; }
        if (msg.type === "done") { await renderDetail(false); return; }
        liveAppend(msg);
      }
    }
  } catch {
    // A dropped stream is not an error worth showing: the refresh control still
    // brings the run's state in, just later.
  } finally {
    if (runAbort === controller) runAbort = null;
  }
}
function stopWatching() {
  if (runAbort) { runAbort.abort(); runAbort = null; }
}
function liveFeedNode() {
  return document.querySelector("#turns .turn:last-child .proc");
}
function liveReplace(events) {
  const node = liveFeedNode();
  if (node) node.innerHTML = events.map(eventHtml).join("");
  $("#turns").scrollTop = $("#turns").scrollHeight;
}
function liveAppend(event) {
  const node = liveFeedNode();
  if (!node) return;
  const atBottom = $("#turns").scrollHeight - $("#turns").scrollTop - $("#turns").clientHeight < 60;
  if (event.type === "delta") {
    // One growing line, not one line per token: the model is writing, and a
    // reader wants a sentence forming rather than a list of fragments.
    let live = node.querySelector(".ev-live:last-child");
    const kind = event.kind === "thinking" ? "thinking" : "answer";
    if (!live || live.dataset.kind !== kind) {
      node.insertAdjacentHTML("beforeend", `<div class="ev-live ${kind === "thinking" ? "thinking" : ""}" data-kind="${kind}"></div>`);
      live = node.querySelector(".ev-live:last-child");
    }
    live.textContent += event.text;
  } else if (event.type === "tool_done") {
    // A duration report for a step already on screen; a step nobody streamed
    // (a subagent's) appears now, indented.
    const step = event.id ? node.querySelector(`[data-tid="${CSS.escape(event.id)}"]`) : null;
    if (step) {
      if (event.ms != null) step.insertAdjacentHTML("beforeend", ` <span class="ev-ms">${fmtMs(event.ms)}</span>`);
      if (event.error) step.classList.add("ev-err");
    } else {
      node.insertAdjacentHTML("beforeend", eventHtml({ ...event, type: "tool_use", sub: true }));
    }
  } else {
    // A finished block supersedes whatever was streaming into it.
    node.querySelectorAll(".ev-live").forEach((n) => n.remove());
    node.insertAdjacentHTML("beforeend", eventHtml(event));
  }
  if (atBottom) $("#turns").scrollTop = $("#turns").scrollHeight;
}

async function renderDetail(startPolling) {
  if (!sel) return null;
  const r = await api("/v1/runs/" + encodeURIComponent(sel));
  if (r.status === 404) {
    $("#turns").innerHTML = '<div class="empty">session not found (in-flight run lost to a restart?)</div>';
    return null;
  }
  const run = await r.json();
  // What this conversation has cost so far, next to what it is: a follow-up is
  // cheap to ask for and the running total is the only thing that says otherwise.
  const spent = (run.turns || []).reduce((sum, turn) => sum + (Number(turn.cost_usd) || 0), 0);
  const turnCount = (run.turns || []).length;
  // How much of this session's context was reused rather than paid for again.
  // The prefix an investigation carries is the harness's ~29k, not ours to trim,
  // so reuse is the only lever left — which makes this worth a permanent place.
  // Reads over everything the prompts were made of: fresh input, reads AND
  // writes. Leaving the writes out once showed "98% cached" on a turn that had
  // written 123k tokens to the cache and read 69k — it paid for more context
  // than it reused, and the writes are the dearer tokens.
  const tok = (run.turns || []).reduce((acc, turn) => {
    const u = turn.usage || {};
    acc.fresh += Number(u.input_tokens || 0);
    acc.cached += Number(u.cache_read_input_tokens || u.cacheReadInputTokens || 0);
    acc.written += Number(u.cache_creation_input_tokens || u.cacheCreationInputTokens || 0);
    return acc;
  }, { fresh: 0, cached: 0, written: 0 });
  const made = tok.fresh + tok.cached + tok.written;
  const hit = made ? Math.round((100 * tok.cached) / made) : null;
  $("#meta").textContent =
    `${run.session_key} · ${run.status}` +
    (run.model ? ` · ${modelWithEndpoint(run.model, run.model_endpoint)}` : "") +
    (turnCount ? ` · ${turnCount} turn${turnCount > 1 ? "s" : ""} $${spent.toFixed(4)}` : "") +
    (hit === null ? "" : ` · context reuse ${hit}% (read ${fmtTok(tok.cached)} · wrote ${fmtTok(tok.written)})`) +
    ` · engine session ${run.engine_session_id || "—"}` +
    (run.error ? ` · ${run.error}` : "");
  $("#prov").innerHTML = provenanceHtml(run);
  // A work run's deliverable, one click away. The patch file is the agent's
  // copy of what it claims to have changed; the clone's history is ground
  // truth. Showing the link here means nobody has to know where the clone
  // lives to start a review.
  if (run.meta && run.meta.patch) {
    const pt = run.meta.patch;
    const shas = (pt.commits || []).join(", ");
    const backed = pt.matches === true
      ? `matches commit${(pt.commits || []).length > 1 ? "s" : ""} ${esc(shas)} in the clone — the push stays yours`
      : pt.matches === false
        ? `<b>DIFFERS from the clone's commit(s) ${esc(shas)}</b> — review the clone, not this diff`
        : `<b>no commit carrying this run's key was found in the clone</b> — this diff is unbacked`;
    $("#prov").innerHTML +=
      `<div style="margin-top:6px"><a href="/v1/runs/${encodeURIComponent(run.session_key)}/patch" ` +
      `target="_blank">review the patch</a> · +${pt.adds}/−${pt.dels} in ${pt.files} file(s) · ${backed}</div>`;
  }
  // What this run's tool output appeared to contain. Loud, and above the
  // transcript rather than in the audit tab: to learn that a run's context had
  // been filled with a live credential you used to have to SSH in and grep,
  // which is exactly when you no longer need to know. Deciding to discard the
  // report or rotate the key needs it on the same screen as the report.
  const leaked = run.output_secrets || [];
  $("#prov").innerHTML +=
    leaked.length
      ? `<div class="flag retfail" style="display:block;margin-top:6px">tool output in this run contained ` +
        `${leaked.map(esc).join(", ")} — the model saw it, and so does this record. ` +
        `Consider the report unsafe to forward and the credential worth rotating.</div>`
      : "";
  // Recorded prompt inputs are only legible next to the files as they are now.
  const now = run.inputs_now;
  const parts = (run.turns || []).map((t) => turnHtml(t, now));
  if (run.status === "running") {
    const live = (run.events || []).map(eventHtml).join("");
    parts.push(
      `<div class="turn">${qHtml(run.current_message)}${inputsHtml(run.inputs, now)}` +
      `<div class="proc">${live}</div>` +
      `<div class="pending">investigating</div></div>`,
    );
  }
  // Where the time went, from the run's own telemetry — optional, so a failure
  // to fetch it costs nothing but the section.
  try {
    const tr = await api("/v1/runs/" + encodeURIComponent(sel) + "/telemetry");
    if (tr.ok) {
      const wf = waterfallHtml(await tr.json());
      if (wf) parts.push(wf);
    }
  } catch (_) { /* the record above stands on its own */ }
  // What this investigation learned, offered as a runbook draft. Drafted only:
  // saving it is the operator's click, because an investigator that writes its
  // own future instructions is one nobody reviewed.
  if (run.status === "completed" && (run.turns || []).length) {
    // Was this worth its bill? The only ruling surface that needs no chat bridge,
    // so on a laptop deployment it is the only one at all. Pressing here reports
    // what the ruling DID — a useless that withdraws a runbook says so — because
    // record_ruling runs in-process and can answer synchronously.
    const r = run.ruling || "";
    parts.push(
      `<div class="rule-bar">was this worth it? ` +
      `<button class="rule ${r === "useful" ? "on" : ""}" data-rule="useful">found the cause</button>` +
      `<button class="rule ${r === "useless" ? "on" : ""}" data-rule="useless">missed it</button>` +
      (r ? `<button class="rule clear" data-rule="clear">clear</button>` : "") +
      `<span id="ruleStatus" class="dim"></span></div>`,
    );
    parts.push(
      `<div class="mem-bar"><button id="distill">distill into a runbook draft</button>` +
      `<span id="distillStatus" class="dim"></span></div>`,
    );
  }
  $("#turns").innerHTML = parts.join("") || '<div class="empty">no turns yet</div>';
  const distill = $("#distill");
  if (distill) {
    distill.onclick = async () => {
      $("#distillStatus").textContent = "drafting…";
      try {
        const r = await api("/v1/runs/" + encodeURIComponent(sel) + "/distill", { method: "POST" });
        if (!r.ok) { $("#distillStatus").textContent = "failed (" + r.status + ")"; return; }
        const draft = await r.json();
        stopWatching();
        editSkill(draft.name, draft.content);
      } catch (e) { $("#distillStatus").textContent = e.message; }
    };
  }
  for (const btn of document.querySelectorAll(".rule")) {
    btn.onclick = async () => {
      const ruling = btn.dataset.rule;
      $("#ruleStatus").textContent = "recording…";
      try {
        const resp = await api("/v1/runs/" + encodeURIComponent(sel) + "/ruling",
          { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ruling }) });
        const body = await resp.json().catch(() => ({}));
        if (!resp.ok) { $("#ruleStatus").textContent = body.detail || ("HTTP " + resp.status); return; }
        // The payoff, shown: a plain "recorded" is what made the button not
        // worth pressing. When the ruling did something to the library, say it.
        $("#ruleStatus").textContent = body.consequence ? ("recorded — " + body.consequence) : "recorded";
        await renderDetail(false);
      } catch (e) { $("#ruleStatus").textContent = e.message; }
    };
  }
  $("#turns").scrollTop = $("#turns").scrollHeight;
  $("#send").disabled = run.status === "running";
  $("#stopBtn").style.display = run.status === "running" ? "" : "none";
  // Only on a settled run with something to hand over, and only where the
  // operator wired a door: an offer that 501s is worse than no offer.
  $("#handoffBtn").style.display = (handoffReady && run.status !== "running" && (run.text || "").trim()) ? "" : "none";
  $("#msg").placeholder = run.status === "running"
    ? "a turn is in flight…"
    : "follow-up in this session… (Enter sends, Shift+Enter for a new line)";
  // Watch while it runs, let go the moment it settles.
  if (run.status === "running") { if (!runAbort) watchRun(run.session_key); }
  else stopWatching();
  return run;
}

// The board: one card per piece of work, not per run (hookprobe/work.py).
// Blocked columns first, because a running item needs nothing from the person
// reading this and a blocked one is waiting on them.
const WB_LABEL = {
  waiting_approval: "waiting on you",
  needs_human: "needs a human",
  abandoned: "abandoned",
  executing: "in flight",
  verifying: "verifying",
  done: "done",
};

function wbCard(item) {
  const age = item.updated_at ? rel(item.updated_at) : "";
  const spent = item.cost_usd ? `$${Number(item.cost_usd).toFixed(2)}` : "";
  const chips = (item.open || []).map((o) => `<span>${esc(o.kind === "approve" ? "approve: " + o.text : o.kind)}</span>`).join("");
  return `<div class="wb-card wb-${esc(item.state)}" data-session="${attr((item.sessions || []).slice(-1)[0] || "")}">
    <div class="t">${esc(item.title || item.work_id)}</div>
    <div class="m">${item.kind ? `<span>${esc(item.kind)}</span>` : ""}${item.source ? `<span>${esc(item.source)}</span>` : ""}
      ${spent ? `<span>${spent}</span>` : ""}<span>${item.turns} turn${item.turns === 1 ? "" : "s"}</span>
      ${item.verified ? `<span class="v">verified · ${esc(item.verified_by)}</span>` : ""}
      ${item.follow_ups ? `<span>${item.follow_ups} follow-up${item.follow_ups === 1 ? "" : "s"}</span>` : ""}
      ${item.refires ? `<span>re-fired ${item.refires}×</span>` : ""}
      ${age ? `<span>${esc(age)}</span>` : ""}</div>
    ${chips ? `<div class="o">${chips}</div>` : ""}
    ${item.state === "needs_human" || item.state === "abandoned" ? `<div class="ap-bar"><button data-retry="${attr((item.sessions || []).slice(-1)[0] || "")}">try again</button></div>` : ""}</div>`;
}

// "3m ago", from the same epoch seconds everything else on this page uses.
function rel(ts) {
  const d = Math.max(0, Math.round(Date.now() / 1000 - Number(ts)));
  if (d < 60) return d + "s ago";
  if (d < 3600) return Math.floor(d / 60) + "m ago";
  if (d < 86400) return Math.floor(d / 3600) + "h ago";
  return Math.floor(d / 86400) + "d ago";
}

let workQuery = "";

// The node itself, in one line. Nothing read /v1/agent before this: a
// deployment runs several probes and the only way to tell which one a board
// belonged to was the port in the address bar.
function agentLine(a) {
  if (!a) return "";
  const h = a.health || {}, p = a.policy || {};
  const bad = Number(h.return_failures || 0);
  return `<b>${esc(a.name || "hookprobe")}</b>${a.role ? ` · ${esc(a.role)}` : ""}` +
    ` · ${esc(p.bash_guard || "?")} · ${esc((a.runtime || {}).model || "?")}` +
    ` · ${Number(h.active_runs || 0)} running, ${Number(h.turns_queued || 0)} queued` +
    (bad ? ` · <span style="color:var(--bad)">${bad} report${bad > 1 ? "s" : ""} never reached the pipe</span>` : "");
}

async function openWork() {
  markTab("workBtn");
  leaveSessions("work");
  try {
    const [wr, ar] = await Promise.all([api("/v1/work"), api("/v1/agent").catch(() => null)]);
    const d = await wr.json();
    const agent = ar && ar.ok ? await ar.json() : null;
    const c = d.counts || {};
    $("#meta").textContent = "work · one row per piece of work, however many runs it took";
    const rate = c.failure_rate === null || c.failure_rate === undefined
      ? "" : ` · ${Math.round(c.failure_rate * 100)}% ended without an answer`;
    // Two numbers an on-call reads before any of the others: how long until it
    // was any use, and how many signals it took to make one piece of work.
    // Both absent rather than zero when nothing has answered — "no answer" and
    // "an instant answer" are different facts.
    const answer = c.median_answer_seconds === null || c.median_answer_seconds === undefined
      ? "" : ` · ${fmtMs(Math.round(c.median_answer_seconds * 1000))} to a first answer (median)`;
    const fold = c.signals_per_item && c.signals_per_item > 1
      ? ` · ${c.signals} signals folded into ${(d.items || []).length} pieces of work` : "";
    $("#prov").innerHTML = `${c.blocked || 0} blocked · ${c.executing || 0} in flight · ` +
      `${c.done || 0} done, ${c.verified || 0} verified · ` +
      `<b>${c.closed_unattended || 0}</b> closed without anyone stepping in${rate}${answer}${fold}`;
    const items = d.items || [];
    if (!items.length) { $("#turns").innerHTML = '<div class="empty">no work yet — an alert, a task or a question through the event door opens one</div>'; return; }
    // A board with 184 items in one column needs a way to reach one of them.
    const q = workQuery.trim().toLowerCase();
    const match = (i) => !q || `${i.title} ${i.work_id} ${i.state} ${i.source || ""} ${i.kind || ""}`.toLowerCase().includes(q);
    const order = ["waiting_approval", "needs_human", "executing", "verifying", "done", "abandoned"];
    // A column is capped: `done` on a live deployment is hundreds of items and
    // rendering them all makes the three that need a person unfindable. Newest
    // first, and the column head keeps the true total.
    const CAP = 25;
    const head = `<div class="wb-top">${agentLine(agent)}</div>` +
      `<input id="wbq" class="wb-q" placeholder="filter work…" autocomplete="off" value="${attr(workQuery)}">`;
    $("#turns").innerHTML = head + `<div class="wb">` + order.map((state) => {
      const rows = items.filter((i) => i.state === state && match(i));
      if (!rows.length) return "";
      const shown = rows.slice(0, CAP);
      const more = rows.length - shown.length;
      return `<div class="wb-col"><div class="wb-h">${esc(WB_LABEL[state] || state)} <b>${rows.length}</b></div>` +
        shown.map(wbCard).join("") +
        (more ? `<div class="empty" style="padding:6px 2px">${more} older, on the sessions list</div>` : "") + "</div>";
    }).join("") + "</div>";
    const box = $("#wbq");
    // The live tick re-renders this pane; without restoring the caret a filter
    // could not be typed into at all.
    box.oninput = () => { workQuery = box.value; openWork(); };
    if (workQuery) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
    $("#turns").querySelectorAll(".wb-card").forEach((card) => (card.onclick = () => {
      const key = card.dataset.session;
      if (key) select(key);
    }));
    // Human takeover, from the column that is waiting for one. It continues the
    // engine session when the failure left one, so the second attempt starts
    // from what the first gathered.
    $("#turns").querySelectorAll("[data-retry]").forEach((b) => (b.onclick = async (e) => {
      e.stopPropagation();
      b.disabled = true;
      b.textContent = "trying…";
      try {
        const r = await api(`/v1/runs/${encodeURIComponent(b.dataset.retry)}/retry`,
          { method: "POST", body: JSON.stringify({ by: "console" }) });
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
        await openWork();
      } catch (err) { b.disabled = false; b.textContent = "try again"; $("#hint").textContent = err.message; }
    }));
  } catch (e) { $("#turns").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// Everything that waits on a person, in one place: procedures nobody has
// approved, memory lines nobody has adopted, reports nobody has ruled on. Two
// of the three did not block any work — the page answers the wider question on
// purpose, because "what do I owe" is what a person opens it to ask.
async function openApprovals() {
  markTab("approvalsBtn");
  leaveSessions("approvals");
  $("#meta").textContent = "approvals · what waits on a person · nothing here ran or was written";
  $("#prov").textContent = "";
  try {
    const [rem, mem, runs] = await Promise.all([
      (await api("/v1/remediations")).json().catch(() => ({ proposals: [] })),
      (await api("/v1/memory/suggestions")).json().catch(() => ({ open: [] })),
      (await api("/v1/runs?unruled=1&limit=50")).json().catch(() => []),
    ]);
    // `expired` comes from the service, which computes it with the same
    // remediation.stale that approve() refuses on — filtering on status alone
    // counted rows whose buttons are not drawn and whose click the gate refuses.
    // `cooling` is from the same service and NOT filtered: it expires by itself,
    // and it is worth reading — it says another procedure just touched this
    // target. So the row stays, its approve button is dead, and reject still
    // works, because "no, not this one" is a decision a cooldown must not eat.
    const proposals = (rem.proposals || []).filter((r) => r.status === "proposed" && !r.expired);
    const lines = mem.open || [];
    const unruled = (runs || []).filter((r) => r.status !== "running");
    const parts = [];
    if (proposals.length) {
      parts.push(`<div class="review-head" style="color:var(--amber)">procedures waiting for approval · ${proposals.length}</div>` +
        proposals.map((r) => `<div class="ap-row" data-rem="${attr(r.id)}">
          <div class="h"><span class="badge proposed">proposed</span><span>${esc(r.session_key)}</span>
          <span class="w">${esc(fmtTime(r.created_at))}</span></div>
          ${(r.steps || []).map((s) => `<div class="cmd">$ ${esc(s.command)}</div>`).join("")}
          ${r.cooling ? `<div class="w">held · ${esc(r.cooling)}</div>` : ""}
          <div class="ap-bar"><button class="primary" data-act="approve"${r.cooling ? " disabled" : ""}>approve &amp; run</button>
          <button class="danger" data-act="reject">reject</button></div></div>`).join(""));
    }
    if (lines.length) {
      parts.push(`<div class="review-head">memory lines proposed by investigations · ${lines.length}</div>` +
        lines.map((r) => `<div class="ap-row" data-mem="${attr(r.id)}">
          <div class="h"><span>${esc(r.session_key)}</span><span class="w">${esc(fmtTime(r.at))}</span></div>
          <div>${esc(r.line)}</div>
          <div class="ap-bar"><button data-act="accept">remember it</button><button data-act="dismiss">dismiss</button></div></div>`).join(""));
    }
    if (unruled.length) {
      parts.push(`<div class="review-head">reports nobody has ruled on · ${unruled.length}</div>` +
        unruled.map((r) => `<div class="ap-row" data-run="${attr(r.session_key)}">
          <div class="h"><span>${esc(r.title || r.session_key)}</span><span class="w">${esc(fmtTime(r.finished_at || r.created_at))}</span></div>
          <div class="ap-bar"><button data-act="useful">found the cause</button><button data-act="useless">missed it</button>
          <button data-act="open">open</button></div></div>`).join(""));
    }
    $("#turns").innerHTML = parts.length ? parts.join("")
      : '<div class="empty">nothing waiting — no procedure to approve, no memory line queued, every report ruled</div>';
    $("#turns").scrollTop = 0;
    $("#turns").querySelectorAll(".ap-row button").forEach((b) => (b.onclick = async () => {
      const row = b.closest(".ap-row"), act = b.dataset.act;
      b.disabled = true;
      try {
        if (row.dataset.rem) await api(`/v1/remediations/${encodeURIComponent(row.dataset.rem)}/${act}`, { method: "POST" });
        else if (row.dataset.mem) await api(`/v1/memory/suggestions/${encodeURIComponent(row.dataset.mem)}/${act}`, { method: "POST" });
        else if (act === "open") { select(row.dataset.run); return; }
        else await api(`/v1/runs/${encodeURIComponent(row.dataset.run)}/ruling`,
          { method: "POST", body: JSON.stringify({ ruling: act, by: "console" }) });
        await openApprovals();
        await refreshBoardCounts();
      } catch (e) { b.disabled = false; $("#hint").textContent = e.message; }
    }));
  } catch (e) { $("#turns").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

    const host = skills.length - proj;
    $("#meta").textContent = `runbooks · ${proj} project${host ? ` + ${host} host (read-only)` : ""} · {workdir}/.claude/skills`;
    if (!skills.length) {
      $("#turns").innerHTML =
        '<div class="empty">no skills yet — when an investigation verifies a reusable diagnostic path, it distills a SKILL.md runbook here, and later runs load it automatically</div>';
      return;
    }
    const row = (s) => `
      <div class="skill" data-name="${esc(s.name)}">
        <div class="skill-name">${esc(s.name)}<span class="skill-layer ${esc(s.layer || "project")}">${esc(s.layer || "project")}</span>${
          // A runbook a run wrote is loaded by every later run exactly like one
          // a person wrote. The only place that difference can still be seen is
          // here, so it is said on the row rather than a click away.
          s.written_by === "auto-distill" && !s.reviewed
            ? `<span class="skill-layer unreviewed" title="written automatically from ${attr(s.from_session || "a run")}; nobody has reviewed it">unreviewed</span>`
            : ""}${
          s.proposal
            ? '<span class="skill-layer proposal" title="a consolidation draft is waiting for review">consolidation</span>'
            : ""}</div>
        <div class="skill-desc">${esc(s.description || "(no description)")}</div>
        <div class="skill-meta">${esc((s.files || []).join("  "))} · ${fmtTime(s.modified)}</div>
      </div>`;
    // The review queue comes first: these are loaded into every later run
    // right now, sight unseen, so they are the rows with a decision pending.

    const rest = skills.filter((s) => !pending.includes(s));
