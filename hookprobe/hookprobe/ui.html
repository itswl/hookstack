async function renderSkill(name) {
  const r = await api("/v1/skills/" + encodeURIComponent(name));
  if (!r.ok) { $("#hint").textContent = "skill not found"; return; }
  const s = await r.json();
  const layer = s.layer || "project";
  // Provenance and history ride along; a failure of either must not take the
  // runbook text with it.
  let origin = {}, history = [], proposal = null;
  if (layer === "project") {
    try { origin = await (await api(`/v1/skills/${encodeURIComponent(name)}/origin`)).json(); } catch (e) {}
    try { history = await (await api(`/v1/skills/${encodeURIComponent(name)}/history`)).json(); } catch (e) {}
    try {
      const pr = await api(`/v1/skills/${encodeURIComponent(name)}/proposal`);
      if (pr.ok) proposal = await pr.json();
    } catch (e) {}
  }
  $("#meta").textContent = `skill · ${name}/SKILL.md · ${layer} layer`;
  const body = (s.content || "").replace(/^---[\s\S]*?\n---\n/, ""); // frontmatter is for machines
  const note = layer === "user"
    ? '<span class="skill-note">host library, read-only — saving stores a project copy that shadows it</span>'
    : "";
  const unreviewed = origin.written_by === "auto-distill" && !origin.reviewed;
  const revisions = Array.isArray(origin.revisions) ? origin.revisions : [];
  const provenance = revisions.length
    ? `<details class="proc-past"><summary>provenance · ${revisions.length} revisions${unreviewed ? " · unreviewed" : ""}</summary>
        <div class="proc">${revisions.slice().reverse().map((v) =>
          `<div class="ev"><span class="ev-tool">${esc(v.by || "?")}</span>` +
          `${esc(fmtTime(v.at))}${v.session_key ? " · " + esc(v.session_key) : ""}${v.action ? " · " + esc(v.action) : ""}</div>`
        ).join("")}</div></details>`
    : "";
  const historyHtml = history.length
    ? `<details class="proc-past"><summary>history · ${history.length} displaced versions</summary>
        <div class="proc">${history.map((h) =>
          `<div class="ev"><span class="ev-tool">${esc(fmtTime(h.stamp))}</span>${esc(String(h.bytes))}B ` +
          `<a class="hist-diff" data-stamp="${attr(String(h.stamp))}">diff</a></div>`
        ).join("")}</div></details>`
    : "";
  // A consolidation draft outranks everything else on the page: it is a
  // machine asking permission to rewrite this runbook, and the whole design
  // is that nothing rewrites without a person looking.
  const proposalBar = proposal
    ? `<div class="tamper" style="border-color:var(--amber)"><div class="tamper-head" style="color:var(--amber)">consolidation draft awaiting review</div>
        <div class="proc"><div class="ev">a consolidation run distilled the case pile into one procedure — review the diff, then approve or reject</div></div>
        <div class="skill-bar"><button id="propDiff">diff</button>
        <button id="propApprove" class="primary">approve</button>
        <button id="propReject" class="danger">reject</button></div></div>`
    : "";
  $("#turns").innerHTML = proposalBar +
    `<div class="skill-bar"><span class="skill-back">← all skills</span><span class="spacer"></span>${note}` +
    (unreviewed ? '<button id="skillReview" class="primary">mark reviewed</button>' : "") +
    `<button id="skillEdit">edit</button>` +
    (layer === "project" ? '<button id="skillDelete" class="danger">delete</button>' : "") +
    `</div>` + provenance + historyHtml + mdToHtml(body);
  $("#turns").scrollTop = 0;
  $("#turns").querySelector(".skill-back").onclick = () => renderSkills();
  $("#skillEdit").onclick = () => editSkill(name, s.content || "");
  const review = $("#skillReview");
  if (review) review.onclick = async () => {
    const resp = await api(`/v1/skills/${encodeURIComponent(name)}/review`, { method: "POST" });
    if (resp.ok) renderSkill(name);
    else $("#hint").textContent = "review failed (" + resp.status + ")";
  };
  $("#turns").querySelectorAll(".hist-diff").forEach((n) => (n.onclick = () => renderSkillDiff(name, n.dataset.stamp, s.content || "")));
  if (proposal) {
    $("#propDiff").onclick = () => renderProposalDiff(name, s.content || "", proposal.content || "");
    $("#propApprove").onclick = async () => {
      if (!confirm(`replace "${name}" with the consolidation draft? (the current version goes into history)`)) return;
      const r2 = await api(`/v1/skills/${encodeURIComponent(name)}/proposal/approve`, { method: "POST" });
      if (r2.ok) renderSkill(name); else $("#hint").textContent = "approve failed (" + r2.status + ")";
    };
    $("#propReject").onclick = async () => {
      const r2 = await api(`/v1/skills/${encodeURIComponent(name)}/proposal/reject`, { method: "POST" });
      if (r2.ok) renderSkill(name); else $("#hint").textContent = "reject failed (" + r2.status + ")";
    };
  }
  const del = $("#skillDelete");
  if (del) del.onclick = async () => {
    if (!confirm(`delete skill "${name}"? (a same-named host skill would resurface)`)) return;
    const resp = await api("/v1/skills/" + encodeURIComponent(name), { method: "DELETE" });
    if (resp.ok) renderSkills();
    else $("#hint").textContent = "delete failed (" + resp.status + ")";
  };
}

// Plain LCS line diff. Runbooks are a few hundred lines at most, and what a
// reviewer needs is "what did that write change", not a patch tool.
function lineDiff(oldText, newText) {
  const a = oldText.split("\n"), b = newText.split("\n");
  const n = a.length, m = b.length;
  const lcs = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      lcs[i][j] = a[i] === b[j] ? lcs[i + 1][j + 1] + 1 : Math.max(lcs[i + 1][j], lcs[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { out.push(["ctx", a[i]]); i++; j++; }
    else if (lcs[i + 1][j] >= lcs[i][j + 1]) { out.push(["del", a[i]]); i++; }
    else { out.push(["add", b[j]]); j++; }
  }
  while (i < n) out.push(["del", a[i++]]);
  while (j < m) out.push(["add", b[j++]]);
  return out;
}

function renderProposalDiff(name, currentContent, draftContent) {
  $("#meta").textContent = `skill · ${name} · current → consolidation draft`;
  const rows = lineDiff(currentContent, draftContent);
  let html = "", quiet = 0;
  const flushQuiet = () => { if (quiet > 2) html += `<div class="diff-row ctx quiet">… ${quiet - 2} unchanged lines …</div>`; quiet = 0; };
  for (const [kind, line] of rows) {
    if (kind === "ctx") { quiet++; if (quiet <= 2) html += `<div class="diff-row ctx">${esc(line) || "&nbsp;"}</div>`; continue; }
    flushQuiet();
    html += `<div class="diff-row ${kind}">${kind === "add" ? "+" : "−"} ${esc(line)}</div>`;
  }
  flushQuiet();
  $("#turns").innerHTML =
    `<div class="skill-bar"><span class="skill-back">← ${esc(name)}</span></div>` +
    `<div class="diff">${html || '<div class="diff-row ctx">identical</div>'}</div>`;
  $("#turns").querySelector(".skill-back").onclick = () => renderSkill(name);
}

async function renderSkillDiff(name, stamp, currentContent) {
  const r = await api(`/v1/skills/${encodeURIComponent(name)}/history/${encodeURIComponent(stamp)}`);
  if (!r.ok) { $("#hint").textContent = "version not found"; return; }
  const version = await r.json();
  $("#meta").textContent = `skill · ${name} · ${fmtTime(Number(stamp))} → current`;
  // Context lines collapse to keep the change readable; a reviewer wants the
  // delta, and the full text is one click away on either side.
  const rows = lineDiff(version.content || "", currentContent);
  let html = "", quiet = 0;
  const flushQuiet = () => { if (quiet > 2) html += `<div class="diff-row ctx quiet">… ${quiet - 2} unchanged lines …</div>`; quiet = 0; };
  for (const [kind, line] of rows) {
    if (kind === "ctx") { quiet++; if (quiet <= 2) html += `<div class="diff-row ctx">${esc(line) || "&nbsp;"}</div>`; continue; }
    flushQuiet();
    html += `<div class="diff-row ${kind}">${kind === "add" ? "+" : "−"} ${esc(line)}</div>`;
  }
  flushQuiet();
  $("#turns").innerHTML =
    `<div class="skill-bar"><span class="skill-back">← ${esc(name)}</span><span class="spacer"></span>` +
    `<button id="skillRestore" class="danger">restore this version</button></div>` +
    `<div class="diff">${html || '<div class="diff-row ctx">identical</div>'}</div>`;
  $("#turns").querySelector(".skill-back").onclick = () => renderSkill(name);
  $("#skillRestore").onclick = async () => {
    if (!confirm(`replace the current runbook with the ${fmtTime(Number(stamp))} version? (the current one goes into history)`)) return;
    const resp = await api("/v1/skills/" + encodeURIComponent(name), {
      method: "PUT",
      body: JSON.stringify({ content: version.content || "" }),
    });
    if (resp.ok) renderSkill(name);
    else $("#hint").textContent = "restore failed (" + resp.status + ")";
  };
}

function editSkill(name, content) {
  $("#meta").textContent = `skill · ${name}/SKILL.md · editing (saves to the project layer)`;
  $("#turns").innerHTML = `
    <div class="skill-bar"><span class="skill-back">← cancel</span></div>
    <textarea id="skillSrc" spellcheck="false"></textarea>
    <div class="mem-bar"><button id="skillSave" class="primary">Save</button><span id="skillStatus"></span></div>`;
  $("#skillSrc").value = content;
  $("#turns").querySelector(".skill-back").onclick = () => renderSkill(name);
  $("#skillSave").onclick = async () => {
    try {
      const r = await api("/v1/skills/" + encodeURIComponent(name), {
        method: "PUT",
        body: JSON.stringify({ content: $("#skillSrc").value }),
      });
      if (r.ok) { renderSkill(name); return; }
      $("#skillStatus").textContent = "save failed (" + r.status + ")";
    } catch (e) { $("#skillStatus").textContent = e.message; }
  };
}

      <div class="skill" data-name="${esc(a.name)}">
        <div class="skill-name">${esc(a.name)}<span class="skill-layer ${esc(a.source)}">${esc(a.source)}</span></div>
        <div class="skill-desc">${esc(a.description || "(no description)")}</div>
        ${a.modified ? `<div class="skill-meta">${fmtTime(a.modified)}</div>` : ""}
      </div>`).join("");
    $("#turns").scrollTop = 0;
    $("#turns").querySelectorAll(".skill").forEach((n) => (n.onclick = () => renderAgent(n.dataset.name)));
  } catch (e) { $("#hint").textContent = e.message; }
}

async function renderAgent(name) {
  const r = await api("/v1/agents/" + encodeURIComponent(name));
  if (!r.ok) { $("#hint").textContent = "agent not found"; return; }
  const a = await r.json();
  $("#meta").textContent = `agent · ${name} · ${a.source}`;
  const note = a.source === "user"
    ? '<span class="skill-note">host library, read-only — saving stores a project copy that shadows it</span>'
    : a.source === "config"
      ? '<span class="skill-note">pinned by HOOKPROBE_AGENTS_CONFIG — edit the config file</span>'
      : "";
  const body = a.source === "config"
    ? '<div class="md"><pre class="code"><code>' + esc(a.content) + "</code></pre></div>"
    : mdToHtml((a.content || "").replace(/^---[\s\S]*?\n---\n/, ""));
  $("#turns").innerHTML =
    `<div class="skill-bar"><span class="skill-back">← all agents</span><span class="spacer"></span>${note}` +
    (a.source !== "config" ? '<button id="agentEdit">edit</button>' : "") +
    (a.source === "project" ? '<button id="agentDelete" class="danger">delete</button>' : "") +
    `</div>` + body;
  $("#turns").scrollTop = 0;
  $("#turns").querySelector(".skill-back").onclick = () => renderAgents();
  const ed = $("#agentEdit");
  if (ed) ed.onclick = () => editAgent(name, a.content || "");
  const del = $("#agentDelete");
  if (del) del.onclick = async () => {
    if (!confirm(`delete agent "${name}"?`)) return;
    const resp = await api("/v1/agents/" + encodeURIComponent(name), { method: "DELETE" });
    if (resp.ok) renderAgents();
    else $("#hint").textContent = "delete failed (" + resp.status + ")";
  };
}

function editAgent(name, content) {
  $("#meta").textContent = `agent · ${name}.md · editing (saves to the project layer)`;
  $("#turns").innerHTML = `
    <div class="skill-bar"><span class="skill-back">← cancel</span></div>
    <textarea id="skillSrc" spellcheck="false"></textarea>
    <div class="mem-bar"><button id="agentSave" class="primary">Save</button><span id="agentStatus"></span></div>`;
  $("#skillSrc").value = content;
  $("#turns").querySelector(".skill-back").onclick = () => renderAgent(name);
  $("#agentSave").onclick = async () => {
    try {
      const r = await api("/v1/agents/" + encodeURIComponent(name), {
        method: "PUT",
        body: JSON.stringify({ content: $("#skillSrc").value }),
      });
      if (r.ok) { renderAgent(name); return; }
      $("#agentStatus").textContent = "save failed (" + r.status + ")";
    } catch (e) { $("#agentStatus").textContent = e.message; }
  };
}

let auditReload = null;

async function openActions() {
  markTab("actionsBtn");
  leaveSessions("actions");
  try {
    const d = await (await api("/v1/remediations")).json();
    const rows = d.proposals || [];
    $("#meta").textContent = "actions · remediation proposals · nothing runs without your approval";
    if (!rows.length) {
      $("#turns").innerHTML = '<div class="empty">no remediation proposals — an investigation appends a fenced remediation block only when it is confident, and an operator approves each step before it runs</div>';
      return;
    }
    const riskTone = { high: "var(--bad)", medium: "var(--amber)", low: "var(--dim)" };
    $("#turns").innerHTML = rows.map((r) => {
      const steps = (r.steps || []).map((s, i) => {
        const res = (r.results || [])[i];
        const tag = res ? (res.exit === 0 ? '<span class="ev-ms" style="color:var(--ok)">exit 0 · ' + fmtMs(res.ms) + "</span>"
                                          : '<span class="ev-ms" style="color:var(--bad)">exit ' + esc(res.exit) + "</span>") : "";
        return '<div class="ev"><span class="ev-tool" style="color:' + (riskTone[s.risk] || "var(--dim)") + '">' +
          esc(s.risk) + "</span>" + esc(s.action) + " " + tag +
          '<div class="rem-cmd">$ ' + esc(s.command) + "</div>" +
          (s.rollback ? '<div class="rem-roll">undo: ' + esc(s.rollback) + "</div>" : "") +
          (res && res.output ? '<pre class="rem-out">' + esc(res.output) + "</pre>" : "") + "</div>";
      }).join("");
      const bar = r.status === "proposed"
        ? '<div class="skill-bar"><button class="rem-approve primary" data-id="' + attr(r.id) + '">approve &amp; run</button>' +
          '<button class="rem-reject danger" data-id="' + attr(r.id) + '">reject</button></div>'
        : '<div class="rem-status ' + esc(r.status) + '">' + esc(r.status) + "</div>";
      return '<div class="rem" data-id="' + attr(r.id) + '"><div class="rem-head">' +
        '<span class="badge ' + esc(r.status) + '">' + esc(r.status) + "</span>" +
        '<span class="when">from ' + esc(r.session_key) + " · " + esc(fmtTime(r.created_at)) + "</span></div>" +
        '<div class="proc">' + steps + "</div>" + bar + "</div>";
    }).join("");
    $("#turns").querySelectorAll(".rem-approve").forEach((b) => (b.onclick = async () => {
      if (!confirm("approve and run every step of this proposal? each command runs exactly as written.")) return;
      const r = await api("/v1/remediations/" + encodeURIComponent(b.dataset.id) + "/approve", { method: "POST" });
      if (r.ok) openActions();
      else { const e = await r.json().catch(() => ({})); $("#hint").textContent = "approve failed: " + (e.detail || r.status); }
    }));
    $("#turns").querySelectorAll(".rem-reject").forEach((b) => (b.onclick = async () => {
      const r = await api("/v1/remediations/" + encodeURIComponent(b.dataset.id) + "/reject", { method: "POST" });
      if (r.ok) openActions();
    }));
  } catch (e) { $("#hint").textContent = e.message; }
}

// ── help: one page for a new operator or an AI driving the API ──────────
function openHelp() {
  markTab("helpBtn");
  leaveSessions("help");
  $("#meta").textContent = "help · what hookprobe is and how to use it · start here, human or AI";
  const base = "http://hookprobe:8088";
  $("#turns").innerHTML = `<div class="help">
<h2>What this is</h2>
<p>hookprobe is a <b>read-only alert investigator</b>: given an alert worth digging into, it runs
one tool-using agent investigation (logs, metrics, its own case files, a browser when needed) and
produces a short report with the conclusion first. It normally sits inside the hookstack family —
the pipe (hookrelay) copies important alerts over, and the finished report travels back through
the pipe to the same channels as the verdict — but any OpenClaw-dialect caller can drive it
directly.</p>

<h2>Three steps to start</h2>
<p>1. Paste your <b>bearer token</b> top-right (kept in localStorage, once per browser).<br>
2. Hit <b>+ new session</b> and describe the investigation in a sentence (e.g. "run a read-only
health patrol of this container, conclusion first").<br>
3. Watch the live process feed while it runs and <b>Stop</b> it any time; when it finishes, the box
at the bottom is a <b>follow-up</b> — the same engine session resumes with all of the first
round's evidence intact.</p>

<h2>The seven views</h2>
<table>
<tr><th>View</th><th>What it shows / what you can change</th></tr>
<tr><td><b>sessions</b></td><td>Every investigation: turn by turn, the bill line (model, tokens, cost, duration), the process feed replayed. Relay-born sessions carry their return outcome. The sidebar filters.</td></tr>
<tr><td><b>skills</b></td><td>Diagnostic runbooks (SKILL.md), layer-tagged: project = on the volume and editable, user = a host library, read-only. Saving always lands in the project layer (copy-on-write). What the agent distills lands here too.</td></tr>
<tr><td><b>agents</b></td><td>Subagent roles (.claude/agents/*.md). The main agent delegates to them through the Task tool; copy one of the three seeded examples to make your own.</td></tr>
<tr><td><b>memory</b></td><td>Environment memory (CLAUDE.md): topology, known false alarms, conventions — injected at the start of every investigation.</td></tr>
<tr><td><b>prompt</b></td><td>The system-prompt append: your investigation methodology. Saved edits apply to the next run.</td></tr>
<tr><td><b>system</b></td><td>Runtime panorama: model, budget, retention, layers, every config path (secrets as set/unset) plus MCP servers and health counters.</td></tr>
<tr><td><b>audit</b></td><td>The flight recorder: one line per tool call (subagents included), filterable by session, following every 8s.</td></tr>
</table>

<h2>API quick reference (for an AI or a script)</h2>
<p class="dim">Auth: every request carries <code>Authorization: Bearer &lt;token&gt;</code>. Polling contract:
/final answers 202 while running; on a 200 <code>isFinal</code> is always true — trust the first
confirming read, no stability heuristics needed.<br>
The examples use the <b>docker-network</b> address <code>http://hookprobe:8088</code>; from the host,
use the loopback mapping <code>http://127.0.0.1:8088</code>.</p>
<pre># start an investigation (OpenClaw-compatible contract)
curl -X POST ${base}/hooks/agent -H "Authorization: Bearer $TOKEN" \\
  -H "Content-Type: application/json" \\
  -d '{"message":"what to investigate…","sessionKey":"my:task:1","timeoutSeconds":900}'

# poll for the result (202 = running; 200 => {"isFinal":true,"text":"the full report"})
curl ${base}/sessions/my:task:1/final -H "Authorization: Bearer $TOKEN"

# follow up in the same session / stop the turn in flight
curl -X POST ${base}/sessions/my:task:1/continue -H ... -d '{"message":"a follow-up question"}'
curl -X POST ${base}/sessions/my:task:1/stop -H ...</pre>
<table>
<tr><th>Management endpoint</th><th>Purpose</th></tr>
<tr><td><code>GET /v1/runs</code> · <code>GET /v1/runs/{key}</code></td><td>Session list / full run record (events and bill included)</td></tr>
<tr><td><code>GET/PUT/DELETE /v1/skills[/{name}]</code></td><td>Browse and copy-on-write edit the skills</td></tr>
<tr><td><code>GET/PUT/DELETE /v1/agents[/{name}]</code></td><td>Subagent roles, same semantics</td></tr>
<tr><td><code>GET/PUT /v1/memory</code> · <code>/v1/system-prompt</code></td><td>Environment memory / methodology — saved edits are hot</td></tr>
<tr><td><code>GET /v1/mcp</code> · <code>/v1/config</code> · <code>/v1/budget</code> · <code>/v1/audit</code></td><td>MCP servers (env key names only) / config snapshot / budget arithmetic / audit tail</td></tr>
<tr><td><code>GET /healthz</code> (no auth)</td><td>Liveness plus running/queued/return-failure counters, for an external monitor</td></tr>
</table>

<h2>File map (the /data volume is the whole memory — back that up)</h2>
<table>
<tr><th>Path</th><th>What it is</th></tr>
<tr><td><code>results/*.json</code></td><td>Case files: the full record of every investigation — and the episodic memory a new investigation greps first</td></tr>
<tr><td><code>.claude/skills/</code> · <code>.claude/agents/</code></td><td>Skills and roles (project layer). A host library appears as the read-only user layer.</td></tr>
<tr><td><code>CLAUDE.md</code> · <code>system-prompt.md</code> · <code>mcp.json</code></td><td>Environment memory / methodology / MCP config — all three read fresh at every run</td></tr>
<tr><td><code>audit/*.jsonl</code></td><td>The audit ledger; <code>home/</code> holds the resumable session transcripts</td></tr>
</table>

<h2>Safety model (why it can run unattended)</h2>
<p>Read-only in three layers: <b>read-only credentials</b> (the real boundary — only query-grade
identities are mounted) → <b>the bash guard</b> (denies mutating verbs of kubectl/systemctl/
terraform and friends, inside subagents too) → <b>a disposable container</b> (non-root). On top of
that: the <b>budget breaker</b> (once the window's spend hits the ceiling the event door refuses new
investigations — and says so on a card), <b>idempotency</b> (an alert storm funds one investigation,
not N), and <b>failure completes the loop</b> (timeout, crash, restart or refusal all return a
report).</p>
<p>A report's card carries buttons, and <code>POST /hooks/action</code> is where a press lands —
signed by the pipe exactly like the event door, because both are the pipe talking. A press stands in
for the console click on a remediation proposal and for <b>nothing else</b>: the allowlist is a file
an operator edits on the host, no button can reach it, so a press has the same blast radius as a
click and a denial comes back as a denial. Each press is claimed by
<code>(correlation_id, kind, at)</code> before anything runs, so the redelivery an IM platform sends
when it does not hear an answer cannot buy a second turn or approve twice.</p>

<h2>Loop hygiene (the run's context and bill)</h2>
<p>Two advisory guards plus one record — none is a security boundary, all exist because an unattended
run cannot notice it is wasting itself.</p>
<table>
<tr><td><b>repeat reminder</b></td><td>On the <code>HOOKPROBE_REPEAT_REMINDER_AT</code>-th identical
call (3rd by default, and every multiple after) the tool result carries a note: change approach, or
record what stays unknown and move on. The budget breaker stops spending after the fact; this is the
nudge before it costs.</td></tr>
<tr><td><b>command deadlines</b></td><td><code>HOOKPROBE_BASH_TIMEOUT_MS</code> /
<code>HOOKPROBE_BASH_MAX_TIMEOUT_MS</code> cap a single command, so a curl at an unreachable host
cannot hold a slot until the whole run times out.</td></tr>
<tr><td><b>what it cost</b></td><td>Each turn carries its own line — model, tokens in/out, cache reads and writes,
dollars, seconds. The session's running total sits in the header line beside the session key, and the chip top-right
is the whole window's spend (with the ceiling next to it when <code>HOOKPROBE_BUDGET_USD</code> is set).</td></tr>
<tr><td><b>was it worth it</b></td><td>The line under the spend bars — <i>N investigations, $X, M found the
cause</i>. Cost has always been countable and worth was countable nowhere, so "you want me to pay a model per
alert?" had a dollar figure and nothing to put beside it. The rulings come from the <b>Found the cause</b> /
<b>Missed it</b> buttons on the delivered card, and a session that carries one shows it in the list. An
investigation nobody ruled on is unrated, never counted as a miss.</td></tr>
<tr><td><b>context reuse %</b></td><td>Of everything the prompts were made of — fresh input, tokens read back from the cache, tokens written to it — the share that was read back. Writes count as paid, because they are: a turn that writes 120k tokens of tool output into the cache pays for it at the dearer rate whatever it reads later. Dollar figures are the CLI's estimate at its own price table; for a model behind a third-party gateway they are the shape of the bill, not the bill. An investigation carries
about 29k tokens before its alert is even mentioned — the harness's own system prompt and tool schemas, which neither a
smaller tool list nor a different prompt preset shrinks — so reuse is the only lever left. It is high inside a session
and low across them: <b>a follow-up here is roughly ten times cheaper than opening a new investigation</b>, alerts
investigated close together share a warm prefix, and every edit to memory, prompt or skills starts the prefix over.</td></tr>
<tr><td><b>inputs record</b></td><td>Every turn records what it was given — model, skill layers and
names, roles, MCP servers, and digests of the environment memory and appended methodology. Those
files live on a mutable volume; a stale line in <code>CLAUDE.md</code> once made every report come
back in the wrong language while the request looked identical. Open <b>inputs · what the model was
given</b> on any turn.</td></tr>
</table>
<p>Oversized tool output needs no guard here: the harness saves the full copy under the session's
<code>tool-results/</code> and hands the model a short preview plus that path.</p>

<h2>Recipes</h2>
<ul>
<li><b>Install a marketplace skill</b>: unzip it into <code>/data/.claude/skills/&lt;name&gt;/</code> (drop __MACOSX); the next run loads it — read it first, a skill instructs an agent holding your credentials</li>
<li><b>Add a role</b>: open any seeded role in the agents view → copy, rename, save; or drop a .md file in place</li>
<li><b>Wire an MCP server</b>: edit <code>/data/mcp.json</code> (the marketplace config.json dialect works, enabled:false is skipped), confirm on the system view, next run picks it up</li>
<li><b>Control which skills a session sees</b>: the <code>HOOKPROBE_SKILLS</code> allowlist (a big library would otherwise flood the context); layers are switched with <code>HOOKPROBE_SETTING_SOURCES</code></li>
<li><b>Ask "what did it actually do"</b>: the audit view, filtered by session; a single run's feed is under process · N steps in sessions</li>
<li><b>Control the refresh</b>: this page keeps no clock. It holds one streaming connection to <code>/v1/live</code> and refetches what you are currently looking at when the service says something changed — so a burst of escalations is one refetch, not a tick per event. ↻ refetches on demand and the badge beside it reads <b>live</b> or <b>offline</b> (a dropped stream reconnects on its own, backing off). A run you are watching does not depend on that either: its steps are pushed over their own streaming response and stop when it settles</li>
<li><b>Scheduled patrols</b>: a host crontab that POSTs a "patrol due" event to the pipe's front door is enough — the escalation door turns it into a proactive investigation whose report travels the usual channels. Each patrol is its own case file, and cites what the last one found.</li>
</ul>
<p class="dim">Fuller design and deployment notes live in hookprobe/README.md and the repository OVERVIEW.md.</p>
</div>`;
  $("#turns").scrollTop = 0;
}

$("#msg").addEventListener("keydown", (e) => {
  // Enter sends, Shift+Enter breaks the line. This is a chat box before it is a
  // text editor, and the common case should not need a modifier.
  if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
  e.preventDefault();
  $("#composer").requestSubmit();
});

$("#composer").onsubmit = async (ev) => {
  ev.preventDefault();
  const msg = $("#msg").value.trim();
  if (!msg) return;
  $("#send").disabled = true;
  $("#hint").textContent = "";
  try {
    if (sel) {
      const r = await api("/sessions/" + encodeURIComponent(sel) + "/continue",
        { method: "POST", body: JSON.stringify({ message: msg }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
    } else {
      const key = "web:" + new Date().toISOString().replace(/[:.]/g, "-");
      const r = await api("/hooks/agent",
        { method: "POST", body: JSON.stringify({ message: msg, sessionKey: key }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
      sel = key;
      composeMode = false;
    }
    // Echo it before the round trip: the first thing a sender wants to see is
    // their own message, and the run is already spawned by the time we return.
    $("#turns").insertAdjacentHTML(
      "beforeend",
      `<div class="turn">${qHtml(msg)}<div class="proc"></div>` +
      `<div class="pending">investigating</div></div>`,
    );
    $("#turns").scrollTop = $("#turns").scrollHeight;
    $("#msg").value = "";
    watchRun(sel);
    await refreshList();
  } catch (e) {
    $("#hint").textContent = e.message;
    $("#send").disabled = false;
  }
};

if (location.hash.startsWith("#session=")) {
  select(decodeURIComponent(location.hash.slice("#session=".length)));
}
else if (location.hash.startsWith("#skills")) {
  const deepLink = decodeURIComponent(location.hash.slice("#skills".length).replace(/^\//, ""));
  if (deepLink) { leaveSessions("skills"); renderSkill(deepLink); }
  else openSkills();
}
else if (location.hash.startsWith("#agents")) {
  const agentLink = decodeURIComponent(location.hash.slice("#agents".length).replace(/^\//, ""));
  if (agentLink) { leaveSessions("agents"); renderAgent(agentLink); }
  else openAgents();
}
else if (location.hash === "#work") openWork();
else if (location.hash === "#approvals") openApprovals();
else if (location.hash === "#memory") openMemory();
else if (location.hash === "#prompt") openPrompt();
else if (location.hash === "#system") openSystem();
else if (location.hash === "#help") openHelp();
else if (location.hash.startsWith("#audit")) {
  openAudit(decodeURIComponent(location.hash.slice("#audit".length).replace(/^\//, "")));
}
async function refreshBudget() {
  const el = $("#budget");
  try {
    const b = await (await api("/v1/budget")).json();
    el.hidden = false;
    // Spend is shown whether or not a ceiling was set: an operator who declined
    // to cap the window still wants to know what it has cost.
    const spent = `$${Number(b.spent_usd || 0).toFixed(2)} / ${b.window_hours || 24}h`;
    const cache = b.context_reuse === null || b.context_reuse === undefined
      ? ""
      : ` · reuse ${Math.round(b.context_reuse * 100)}%`;
    // A ceiling the breaker cannot see is worse than no ceiling, because the
    // chip reads as reassurance: a codex node showed "$0.00 of $1.00" beside
    // 93,388 tokens actually spent. Say the word instead of the number.
    const blind = b.spend_visibility === "blind";
    el.textContent =
      (b.enabled ? `${spent} of $${Number(b.budget_usd).toFixed(2)}${blind ? " · unmeasured" : ""}` : spent) + cache;
    const made = `read ${fmtTok(b.cache_read_tokens || 0)} · wrote ${fmtTok(b.cache_written_tokens || 0)} · fresh ${fmtTok(b.input_tokens || 0)}`;
    el.title = (b.enabled
      ? "spend in the budget window (the CLI's estimate at its own price table), the ceiling the event door refuses at, and how much of the context was read back from cache rather than paid for — "
      : "spend in the window (the CLI's estimate at its own price table) · no ceiling set (HOOKPROBE_BUDGET_USD) · reuse = context read back from cache rather than paid for — ") + made;
    if (blind) {
      el.title = `this runtime reports tokens and never money, so the $${Number(b.budget_usd).toFixed(2)} ceiling cannot trip: ${b.unpriced_turns} turn(s) in this window went unpriced and the spend beside it is a blank rather than a floor — ` + made;
    }
    el.classList.toggle("hot", !!b.exhausted);
    // Not `hot`, which means "stop": the window is not over budget, it is
    // unmeasured. A separate state, so the two never get read as one.
    el.classList.toggle("unmeasured", blind);
    // The other half of the bill. Printed as the service worded it rather than
    // reassembled here: the sentence gets quoted at people deciding whether to
    // pay for this, and one written in two places eventually says two things.
    const worth = $("#worth");
    if (worth) {
      worth.textContent = b.worth || "";
      worth.title = "investigations in the spend window, what they cost, and how many a person said found the cause"
        + (b.ruled_useless ? ` · ${b.ruled_useless} ruled a miss` : "")
        + " · rulings come from the card buttons on a delivered report";
    }
  } catch { el.hidden = true; }
}

  // ── live control · keep this block identical in all three pages ────────────
  // A board is watched while something is happening, and what it shows changes
  // when the service writes — not when a clock in the browser says so. So there
  // is no clock: the page holds one streaming connection and refetches what it
  // is looking at when the service says something changed. The dropdown this
  // replaces made the operator choose between a stale board and a busy one,
  // which is a choice the service can simply answer.
  //
  // NDJSON over fetch rather than EventSource: every board authenticates its
  // reads with a header, and EventSource cannot send one.
  var liveAbort = null;
  var liveRetry = 0;
  function liveMark(state) {
    var el = document.getElementById("rLive");
    if (!el) return;
    el.className = "live " + state;
    el.textContent = state === "on" ? "live" : "offline";
  }
  function liveConnect(url, headers, onChange) {
    if (liveAbort) liveAbort.abort();
    var controller = new AbortController();
    liveAbort = controller;
    fetch(url, { headers: headers(), signal: controller.signal }).then(function (response) {
      if (!response.ok || !response.body) throw new Error("stream " + response.status);
      liveMark("on");
      liveRetry = 0;
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffered = "";
      return (function pump() {
        return reader.read().then(function (chunk) {
          if (chunk.done) throw new Error("stream closed");
          buffered += decoder.decode(chunk.value, { stream: true });
          var lines = buffered.split("\n");
          buffered = lines.pop();
          lines.forEach(function (line) {
            if (!line.trim()) return;
            var message;
            try { message = JSON.parse(line); } catch (err) { return; }
            if (message.type === "changed") onChange();
          });
          return pump();
        });
      })();
    }).catch(function () {
      if (controller !== liveAbort) return;   // superseded by a newer connection
      liveMark("off");
      liveRetry = Math.min(liveRetry + 1, 6);
      // Backoff, capped: a service that is down should not be hammered, and a
      // board left open overnight should still come back on its own.
      setTimeout(function () {
        if (controller === liveAbort) liveConnect(url, headers, onChange);
      }, Math.pow(2, liveRetry) * 500);
    });
  }
  function wireLiveControl(url, headers, onChange) {
    document.getElementById("rNow").addEventListener("click", function () { onChange(); });
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) onChange();
    });
    onChange();
    liveConnect(url, headers, onChange);
  }
  // ── end live control ──────────────────────────────────────────────────────

// One tick refreshes whatever is on screen: the session list and the open
// session (its live feed included), or the audit tail.
async function tick() {
  await refreshBudget();
  await refreshBoardCounts();
  if (viewMode === "sessions") {
    await refreshList();
    if (sel) await renderDetail(false).catch(() => null);
  } else if (viewMode === "audit" && auditReload) {
    await auditReload();
  } else if (viewMode === "work") {
    await openWork();
  }
  const now = new Date().toTimeString().slice(0, 8);
  $("#stamp").textContent = "refreshed " + now;
}

wireLiveControl("/v1/live", readHeaders, tick);
</script>
