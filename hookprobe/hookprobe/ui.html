<!doctype html>
<!-- The sessions page: list, read, and continue investigations from a browser.
     One file, no build step, no external assets. Served unauthenticated; every
     API call it makes carries the bearer token you paste top-right. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hookprobe · sessions</title>
<style>
  /* ── hookstack design tokens · keep this block identical in all three pages ── */
  :root {
    --bg: #0b0e14; --surface: #11151d; --border: #1f2530; --border-soft: #171c26;
    --text: #d7dde6; --muted: #8b94a3; --accent: #4c8dff;
    --ok: #3dd68c; --warn: #f5a524; --bad: #e5484d;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    /* "PingFang SC" stays in the stack: alert titles arrive in whatever language
       the monitoring system speaks, and they are rendered here verbatim. */
    --ui: 14px/1.55 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
  }
  .rc { display: flex; gap: 6px; align-items: center; }
  .rc button, .rc select { background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 12px;
    cursor: pointer; }
  .rc button:hover, .rc select:hover { border-color: var(--accent); }
  .rc .live { font-size: 11px; color: var(--muted); border: 1px solid var(--border);
    border-radius: 10px; padding: 2px 8px; white-space: nowrap; }
  .rc .live.on { color: var(--ok); border-color: var(--ok); }
  .rc .live.off { color: var(--warn); border-color: var(--warn); }
  /* ── end design tokens ────────────────────────────────────────────────────── */
  /* This page's older token names, aliased onto the shared set above. */
  :root {
    --panel: var(--surface); --line: var(--border); --dim: var(--muted);
    --green: var(--ok); --amber: var(--warn); --red: var(--bad);
  }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;
     font:var(--ui)}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:600}
header h1 span{color:var(--dim);font-weight:400}
#token{margin-left:auto;background:var(--bg);border:1px solid var(--line);color:var(--text);
       border-radius:6px;padding:5px 8px;width:230px;font-family:var(--mono);font-size:12px}
#token.bad{border-color:var(--red)}
#stamp{font-size:11px;color:var(--dim);font-family:var(--mono);white-space:nowrap}
#budget{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:3px 8px;white-space:nowrap}
#budget.hot{color:var(--red);border-color:var(--red)}
button{background:#21262d;border:1px solid #30363d;color:var(--text);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
button:disabled{opacity:.45;cursor:default}
main{flex:1;display:flex;min-height:0}
aside{width:330px;border-right:1px solid var(--line);background:var(--panel);flex-shrink:0;display:flex;flex-direction:column}
#q{margin:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);
   padding:5px 9px;font-size:12px}
#q:focus{outline:none;border-color:var(--accent)}
#list{flex:1;overflow-y:auto}
.item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;border-left:2px solid transparent}
.item:hover{background:#1c2128}
.item.sel{background:#152238;border-left-color:var(--accent)}
.item .key{font-family:var(--mono);font-size:12px;color:var(--accent);word-break:break-all}
.item .title{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.item .meta{display:flex;gap:8px;font-size:11px;color:var(--dim);margin-top:4px;align-items:center;flex-wrap:wrap}
.badge{padding:0 7px;border-radius:10px;font-size:11px;border:1px solid currentColor}
.flag{padding:0 6px;border-radius:9px;font-size:10px;border:1px solid var(--line);color:var(--dim);font-family:var(--mono)}
.flag.sent{color:var(--green);border-color:var(--green)}
.flag.retfail{color:var(--red);border-color:var(--red)}
.kv-grid{display:grid;grid-template-columns:230px 1fr;gap:5px 16px;font-size:12.5px;margin:6px 0 18px}
.kv-grid .k{color:var(--dim);font-family:var(--mono);font-size:12px}
.kv-grid .v{font-family:var(--mono);font-size:12px;word-break:break-all}
.subhead{color:var(--text);font-size:13px;font-weight:600;margin:14px 0 6px}
.audit-bar{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.audit-bar input{background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:5px 9px;font-size:12px;width:280px}
.audit-row{display:flex;gap:10px;font-family:var(--mono);font-size:11.5px;padding:3px 0;border-bottom:1px solid #161b22;align-items:baseline}
.audit-row .ts{color:var(--dim);flex-shrink:0}
.audit-row .a-session{color:var(--accent);flex-shrink:0;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.audit-row .a-tool{color:var(--amber);flex-shrink:0;min-width:70px}
.audit-row .a-detail{color:var(--text);word-break:break-all}
.audit-row.err .a-tool{color:var(--red)}
.help{max-width:860px;font-size:13.5px;line-height:1.65}
.help h2{font-size:15px;margin:20px 0 8px;color:var(--text)}
.help h2:first-child{margin-top:0}
.help p{margin:6px 0;color:var(--text)}
.help .dim{color:var(--dim)}
.help table{border-collapse:collapse;margin:8px 0;width:100%}
.help th,.help td{border:1px solid var(--line);padding:6px 10px;text-align:left;font-size:12.5px;vertical-align:top}
.help th{color:var(--dim);font-weight:600;background:var(--panel)}
.help code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:12px}
.help pre{background:#0b0f14;border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.5}
.help li{margin:3px 0}
.badge.running{color:var(--amber)}
.badge.completed{color:var(--green)}
.badge.failed{color:var(--red)}
section{flex:1;display:flex;flex-direction:column;min-width:0}
#meta{padding:8px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);
      font-family:var(--mono);min-height:36px;word-break:break-all}
#turns{flex:1;overflow-y:auto;padding:16px}
.turn{margin-bottom:20px}
.q,details.q{background:#152238;border:1px solid #1f3a5f;border-radius:8px;padding:8px 12px;margin-bottom:8px;
   white-space:pre-wrap;word-break:break-word;font-size:13px}
details.q summary{cursor:pointer;color:var(--dim);white-space:normal}
.a pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;
       white-space:pre-wrap;word-break:break-word;margin:0;font-family:var(--mono);font-size:12.5px}
.a.err pre{border-color:var(--red)}
.stats{color:var(--dim);font-size:11px;font-family:var(--mono);margin-top:5px;padding-left:2px}
.proc{border-left:2px solid var(--line);margin:6px 0 8px 6px;padding-left:10px}
.ev{font-family:var(--mono);font-size:11.5px;color:var(--dim);padding:2px 0;word-break:break-all}
.ev-tool{color:var(--accent);margin-right:8px}
.ev-ms{color:var(--dim);font-size:10px}
#spend{display:flex;align-items:flex-end;gap:2px;padding:4px 2px 2px;min-height:0}
.spend-bar{width:9px;display:inline-flex;align-items:flex-end;height:24px;cursor:default}
.spend-bar i{display:block;width:100%;background:var(--accent);opacity:.55;border-radius:1px}
.spend-total{color:var(--dim);font-size:10px;font-family:var(--mono);margin-left:6px;align-self:center}
#worth{color:var(--dim);font-size:10px;font-family:var(--mono);padding:0 2px 6px}
.ev-sub{padding-left:16px;opacity:.85}
.ev-err .ev-tool{color:var(--bad)}
.ev-changed{color:var(--amber)}
.tamper{border:1px solid var(--red);border-radius:6px;padding:8px 10px;margin:6px 0}
.tamper-head{color:var(--red);font-size:12px;font-weight:600}
.tamper .proc{border-left-color:var(--red);margin-bottom:0}
.ev-narr{font-family:inherit;font-style:italic;color:#9daebe;white-space:pre-wrap}
.ev-live{font-family:inherit;white-space:pre-wrap;color:var(--text)}
.ev-live.thinking{font-style:italic;color:var(--dim)}
.ev-live::after{content:"▌";color:var(--accent);animation:none}
details.proc-past{margin:6px 0 8px 6px}
details.proc-past summary{cursor:pointer;color:var(--dim);font-size:12px}
.skill{padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;cursor:pointer;background:var(--panel)}
.skill:hover{border-color:var(--accent)}
.skill-name{color:var(--accent);font-family:var(--mono);font-size:13px}
.skill-desc{font-size:13px;margin-top:3px}
.skill-meta{color:var(--dim);font-size:11px;margin-top:5px;font-family:var(--mono)}
.skill-back{color:var(--accent);cursor:pointer;margin-bottom:10px;font-size:13px}
.skill-layer{font-size:10px;border:1px solid var(--line);border-radius:8px;padding:1px 6px;color:var(--dim);margin-left:8px;font-family:var(--mono)}
.skill-layer.user{color:var(--accent);border-color:var(--accent)}
.skill-layer.unreviewed{color:var(--amber);border-color:var(--amber)}
.skill-layer.proposal{color:var(--accent);border-color:var(--accent)}
.rem{border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:8px 10px}
.rem-head{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.rem-cmd{font-family:var(--mono);font-size:11.5px;color:var(--text);margin:2px 0 0 4px}
.rem-roll{font-size:11px;color:var(--dim);margin-left:4px}
.rem-out{font-family:var(--mono);font-size:11px;background:var(--line);border-radius:4px;padding:4px 6px;margin:4px 0 0 4px;white-space:pre-wrap;max-height:180px;overflow:auto}
.rem-status{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.badge.executed{color:var(--ok);border-color:var(--ok)}
.badge.failed,.badge.rejected{color:var(--bad);border-color:var(--bad)}
.badge.running{color:var(--amber);border-color:var(--amber)}
.review-head{font-size:11px;color:var(--amber);margin:10px 2px 4px;text-transform:uppercase;letter-spacing:.4px}
.review-head.quiet{color:var(--dim)}
.hist-diff{color:var(--accent);cursor:pointer;margin-left:8px;text-decoration:underline}
.diff{font-family:var(--mono);font-size:11.5px;margin-top:8px;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.diff-row{white-space:pre-wrap;word-break:break-all;padding:1px 4px}
.diff-row.add{color:var(--ok);background:rgba(61,214,140,.07)}
.diff-row.del{color:var(--bad);background:rgba(229,72,77,.07)}
.diff-row.ctx{color:var(--dim)}
.diff-row.ctx.quiet{text-align:center;font-style:italic}
.skill-bar{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.skill-bar .spacer{flex:1}
.skill-bar .skill-back{margin-bottom:0}
.skill-note{color:var(--dim);font-size:11px}
button.danger{color:var(--red);border-color:var(--red)}
#skillSrc{width:100%;min-height:420px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-family:var(--mono);font-size:12.5px;padding:12px;line-height:1.55}
#skillSrc:focus{outline:none;border-color:var(--accent)}
.ev-todos{font-family:inherit;padding:4px 0}
.ev-todos div{padding:1px 0;color:var(--text);font-size:12.5px}
.ev-todos .todo-done{color:var(--dim);text-decoration:line-through}
.ev-todos .todo-active{color:var(--amber)}
#stopBtn{border-color:var(--red);color:var(--red)}
#memEdit{width:100%;min-height:420px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-family:var(--mono);font-size:12.5px;padding:12px;resize:vertical;box-sizing:border-box}
#memEdit:focus{outline:none;border-color:var(--accent)}
.mem-tip{color:var(--dim);font-size:12px;margin-bottom:10px}
.mem-bar{margin-top:10px;display:flex;gap:12px;align-items:center}
#memStatus{color:var(--green);font-size:12px}
.md{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  font-size:13.5px;line-height:1.65;word-break:break-word}
.a.err .md{border-color:var(--red)}
.md h1,.md h2,.md h3,.md h4{margin:12px 0 6px;line-height:1.3}
.md h1{font-size:16px}.md h2{font-size:15px}.md h3,.md h4{font-size:14px}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:24px}
.md li{margin:2px 0}
.md code{background:#22282f;border:1px solid var(--line);border-radius:4px;padding:0 4px;
  font-family:var(--mono);font-size:12px}
.md pre.code{background:#0b0f14;border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;
  white-space:pre-wrap;word-break:break-word;margin:8px 0}
.md pre.code code{background:none;border:none;padding:0;font-size:12px}
.md table{border-collapse:collapse;margin:8px 0;font-size:12.5px}
.md th,.md td{border:1px solid var(--line);padding:4px 10px;text-align:left}
.md th{background:#1a2027}
.md a{color:var(--accent)}
.pending{color:var(--amber);padding:8px 12px;font-size:13px}
.pending::after{content:"…";animation:dots 1.2s steps(3,end) infinite}
@keyframes dots{0%{content:""}33%{content:"."}66%{content:".."}100%{content:"..."}}
#hint{padding:0 16px 6px;font-size:12px;color:var(--red);min-height:18px}
#composer{display:flex;gap:8px;padding:0 16px 14px}
#msg{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);
     padding:8px 10px;resize:vertical;min-height:46px;font:inherit}
#msg:focus{outline:none;border-color:var(--accent)}
.empty{color:var(--dim);padding:26px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>hookprobe <span>· sessions</span></h1>
  <button id="new">+ new session</button>
  <button id="skillsBtn">skills</button>
  <button id="agentsBtn">agents</button>
  <button id="memBtn">memory</button>
  <button id="promptBtn">prompt</button>
  <button id="sysBtn">system</button>
  <button id="actionsBtn">actions</button>
  <button id="auditBtn">audit</button>
  <button id="helpBtn">help</button>
  <span id="budget" hidden></span>
  <span class="stamp" id="stamp"></span>
  <span class="rc">
    <button id="rNow" title="refresh now">&#8635;</button>
    <span id="rLive" class="live" title="live connection">live</span>
  </span>
  <input id="token" placeholder="bearer token" autocomplete="off">
</header>
<main>
  <aside>
    <input id="q" placeholder="filter sessions…" autocomplete="off">
    <div id="spend" title=""></div>
    <div id="worth"></div>
    <div id="list"><div class="empty">loading…</div></div>
  </aside>
  <section>
    <div id="meta"></div>
    <div id="turns"><div class="empty">select a session on the left, or start a new one</div></div>
    <div id="hint"></div>
    <form id="composer">
      <textarea id="msg" placeholder="new session: describe what to investigate… (Enter sends, Shift+Enter for a new line)"></textarea>
      <button id="stopBtn" type="button" style="display:none">Stop</button>
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </section>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
let sel = null;
let composeMode = false; // "+ new session" pressed: keep the pane free until they send
let viewMode = "sessions"; // or "skills"

  /* ── hookstack token wiring · keep this block identical in all three pages ── */
  /* Three services had three ways to type the same kind of secret: an input box
     here, a window.prompt there, and a third key-naming convention. The visual
     unification pass caught the palette and missed the interaction, so this is
     pinned by scripts/assert_design.py like the palette is.
     A `prompt` is the one shape deliberately not used: it can only be answered
     when the page decides to ask, so replacing a token means clearing
     localStorage by hand. */
  function tokenWire(inputId, buttonId, key, onSaved) {
    var input = document.getElementById(inputId);
    var save = document.getElementById(buttonId);
    if (input) input.value = localStorage.getItem(key) || "";
    if (save) save.addEventListener("click", function () {
      localStorage.setItem(key, (input.value || "").trim());
      onSaved();
    });
  }
  function tokenReveal(needed) {
    var bar = document.getElementById("tokenbar");
    if (bar) bar.classList[needed ? "add" : "remove"]("show");
  }
  /* ── end token wiring ───────────────────────────────────────────────────── */
// Hyphens, like the other two keys. The underscore was a third naming convention
// across three services for one idea. The old key is read once, so a browser that
// already holds a token is not asked to retype it.
const TOKEN_KEY = "hookprobe-token";
const tokenEl = $("#token");
const legacyToken = localStorage.getItem(TOKEN_KEY);
if (legacyToken && !localStorage.getItem(TOKEN_KEY)) {
  localStorage.setItem(TOKEN_KEY, legacyToken);
  localStorage.removeItem("hookprobe_token");
}
// Always visible rather than revealed on 401, and that difference is deliberate:
// this token opens every route on this service, so there is no useful page to
// show without it. The pipe and the brain reveal theirs because their boards
// read fine the moment one is supplied.
tokenEl.value = localStorage.getItem(TOKEN_KEY) || "";
tokenEl.addEventListener("change", () => {
  localStorage.setItem(TOKEN_KEY, tokenEl.value.trim());
  tokenEl.classList.remove("bad");
  refreshList();
});

function readHeaders() {
  const token = tokenEl.value.trim();
  return token ? { Authorization: "Bearer " + token } : {};
}

async function api(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  const t = tokenEl.value.trim();
  if (t) headers["Authorization"] = "Bearer " + t;
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) {
    tokenEl.classList.add("bad");
    throw new Error("unauthorized — paste the bearer token (top right)");
  }
  return r;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
// esc() escapes text nodes, which leaves the double quote alone; attribute
// values need it too.
function attr(s) {
  return esc(s).replace(/"/g, "&quot;");
}
function pretty(t) {
  try { return JSON.stringify(JSON.parse(t), null, 2); } catch { return t; }
}

// --- tiny escape-first markdown renderer ---------------------------------
// Everything is HTML-escaped up front; the only tags in the output are the
// ones these transforms construct, and link hrefs must be http(s).
function mdInline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdToHtml(src) {
  let text = esc(src || "");
  const fences = [];
  text = text.replace(/```[^\n]*\n?([\s\S]*?)```/g, (_, body) => {
    fences.push(body);
    return "" + (fences.length - 1) + "";
  });
  const out = [];
  let list = null;
  let para = [];
  let tbl = [];
  const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
  const flushPara = () => {
    if (para.length) { out.push("<p>" + para.map(mdInline).join("<br>") + "</p>"); para = []; }
  };
  const flushTable = () => {
    if (!tbl.length) return;
    const rows = tbl;
    tbl = [];
    const cells = (r) => r.replace(/^\|/, "").replace(/\|\s*$/, "").split("|").map((c) => mdInline(c.trim()));
    if (rows.length >= 2 && /^[\s|:\-]+$/.test(rows[1])) {
      const head = cells(rows[0]);
      const body = rows.slice(2).map(cells);
      out.push(
        "<table><thead><tr>" + head.map((h) => "<th>" + h + "</th>").join("") + "</tr></thead><tbody>" +
        body.map((r) => "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>").join("") +
        "</tbody></table>",
      );
    } else {
      para.push(...rows);
      flushPara();
    }
  };
  for (const line of text.split("\n")) {
    if (/^\d+\s*$/.test(line)) { flushPara(); flushTable(); closeList(); out.push(line.trim()); continue; }
    if (/^\s*\|/.test(line)) { flushPara(); closeList(); tbl.push(line.trim()); continue; }
    flushTable();
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { flushPara(); closeList(); out.push(`<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`); continue; }
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    if (ul) { flushPara(); if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; } out.push("<li>" + mdInline(ul[1]) + "</li>"); continue; }
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);

  const html = out.join("\n").replace(/(\d+)/g, (_, i) => '<pre class="code"><code>' + fences[Number(i)] + "</code></pre>");

function fmtTime(ts) { return ts ? new Date(ts * 1000).toLocaleString() : ""; }

function returnFlag(x) {

  if (x.return_status === "sent") return '<span class="flag sent">returned</span>';
  return '<span class="flag">relay</span>';
}

// A person's ruling on this investigation, pressed on the card it arrived as.
// Absent until somebody says: an unruled run is unrated, never "not useful",

function rulingFlag(x) {
  if (x.ruling === "useful") return '<span class="flag sent">found the cause</span>';

// Fourteen days of spend as one quiet row of bars — the answer to "what is
// this costing lately" without a metrics stack. Computed from the same list
// the board already fetched; unfiltered on purpose, so searching for a
// session does not appear to change what the month cost.
function renderSpend(runs) {
  const el = $("#spend");
  if (!el) return;
  const day = 86400, now = Date.now() / 1000;
  const days = Array.from({ length: 14 }, (_, i) => {
    const start = (Math.floor(now / day) - (13 - i)) * day;
    return { start, cost: 0, count: 0 };
  });
  for (const x of runs) {
    const idx = Math.floor((x.created_at - days[0].start) / day);
    if (idx >= 0 && idx < 14) { days[idx].cost += Number(x.cost_usd) || 0; days[idx].count += 1; }
  }
  const total = days.reduce((s, d) => s + d.cost, 0);
  if (!days.some((d) => d.count)) { el.innerHTML = ""; return; }
  const peak = Math.max(...days.map((d) => d.cost), 0.0001);
  el.innerHTML =
    days.map((d) => {
      const h = d.cost > 0 ? Math.max(2, Math.round((d.cost / peak) * 22)) : (d.count ? 2 : 0);
      const label = new Date(d.start * 1000).toISOString().slice(5, 10);
      return `<span class="spend-bar" title="${label} · $${d.cost.toFixed(3)} · ${d.count} run${d.count === 1 ? "" : "s"}">` +
        `<i style="height:${h}px"></i></span>`;
    }).join("") +
    `<span class="spend-total">14d $${total.toFixed(2)}</span>`;
}

async function refreshList() {
  try {
    let runs = await (await api("/v1/runs")).json();
    renderSpend(runs);
    const q = ($("#q").value || "").toLowerCase();
    if (q) runs = runs.filter((x) => (x.session_key + " " + (x.title || "")).toLowerCase().includes(q));
    const el = $("#list");
    if (!runs.length) { el.innerHTML = `<div class="empty">${q ? "no sessions match" : "no sessions yet"}</div>`; return; }
    el.innerHTML = runs.map((x) => `
      <div class="item ${x.session_key === sel ? "sel" : ""}" data-key="${esc(x.session_key)}">
        <div class="key">${esc(x.session_key)}</div>
        <div class="title">${esc(x.title || "")}</div>
        <div class="meta">
          <span class="badge ${esc(x.status)}">${esc(x.status)}</span>
          ${returnFlag(x)}
          ${rulingFlag(x)}
          <span>${x.turn_count} turn${x.turn_count > 1 ? "s" : ""}</span>
          ${x.model ? `<span>${esc(String(x.model).replace(/^claude-/, ""))}</span>` : ""}
          ${x.cost_usd ? `<span>$${Number(x.cost_usd).toFixed(3)}</span>` : ""}
          <span>${fmtTime(x.created_at)}</span>
        </div>
      </div>`).join("");
    el.querySelectorAll(".item").forEach((n) => (n.onclick = () => select(n.dataset.key)));
    // Land on the latest investigation, but never steal the pane from a

    if (!sel && !composeMode && viewMode === "sessions" && runs.length) select(runs[0].session_key);

}

async function select(key) {
  stopWatching();          // the previous session's feed is no longer on screen
  sel = key;
  composeMode = false;
  sessionsMode();
  $("#hint").textContent = "";
  refreshList();
  await renderDetail(true);
}

function sessionsMode() {
  viewMode = "sessions";
  $("#composer").style.display = "";
}

function qHtml(m) {
  if (!m) return "";
  if (m.length > 400) {
    return `<details class="q"><summary>${esc(m.slice(0, 180))}…</summary>${esc(m)}</details>`;
  }
  return `<div class="q">${esc(m)}</div>`;
}
function fmtTok(n) {
  n = Number(n) || 0;
  return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(n);
}
function modelLabel(mu) {

  // helpers in as aux with their own bill so the split is obvious.
  const entries = Object.entries(mu || {}).map(([name, v]) => ({
    name: name.replace(/^claude-/, "").replace(/-\d{8}$/, ""),
    cost: Number((v || {}).costUSD ?? (v || {}).cost_usd ?? 0),
    out: Number((v || {}).outputTokens ?? (v || {}).output_tokens ?? 0),

  if (!entries.length) return "";
  entries.sort((a, b) => b.cost - a.cost || b.out - a.out);
  const aux = entries.slice(1).map((e) => (e.cost ? `${e.name} $${e.cost.toFixed(4)}` : e.name));

}
function statsHtml(t) {

  const label = modelLabel(t.model_usage);
  if (label) bits.push(label);
  const tin = pick("input_tokens", "inputTokens"), tout = pick("output_tokens", "outputTokens");
  const cr = pick("cache_read_input_tokens", "cacheReadInputTokens");
  const cw = pick("cache_creation_input_tokens", "cacheCreationInputTokens");
  if (tin != null) bits.push(`in ${fmtTok(tin)}`);
  if (tout != null) bits.push(`out ${fmtTok(tout)}`);
  if (cr != null || cw != null) bits.push(`cache ${fmtTok(cr)}r/${fmtTok(cw)}w`);
  if (t.cost_usd != null) bits.push(`$${Number(t.cost_usd).toFixed(4)}`);
  if (t.duration_ms != null) bits.push(`${(t.duration_ms / 1000).toFixed(1)}s`);

}
function fmtMs(ms) {

}
function eventHtml(e) {
  if (e.type === "tool_use") {

      const mark = { completed: "☑", in_progress: "◐", pending: "☐" };
      const cls = { completed: "todo-done", in_progress: "todo-active", pending: "" };
      return `<div class="ev ev-todos">${e.todos
        .map((t) => `<div class="${cls[t.status] || ""}">${mark[t.status] || "☐"} ${esc(t.content)}</div>`)
        .join("")}</div>`;
    }
    // sub: a tool call the message stream never carried — a subagent's, known
    // only from the hooks. Indented under whichever Task spawned it, without
    // pretending to know which one that was.
    const dur = e.ms != null ? ` <span class="ev-ms">${fmtMs(e.ms)}</span>` : "";
    return `<div class="ev${e.sub ? " ev-sub" : ""}${e.error ? " ev-err" : ""}"${e.id ? ` data-tid="${attr(e.id)}"` : ""}>` +
      `<span class="ev-tool">${e.sub ? "↳ " : ""}${esc(e.name)}</span>${esc(e.detail || "")}${dur}</div>`;
  }

}
// What the model was actually given. The prompt is assembled from files on a
// mutable volume, so the record of which ones were in force is the only way to
// explain a report later.
// A recorded digest is the same string on every run until somebody edits the
// file, so printing it is noise dressed as evidence. The one question it can
// answer is comparative — does this file still say what it said when the run
// used it? — so the digest is compared here against the file as it stands now

    ["model", i.model + (i.resumed ? " · resumed" : "")],

        return `<div class="ev"${cell.title ? ` title="${attr(cell.title)}"` : ""}>` +
          `<span class="ev-tool">${esc(k)}</span>` +
          `<span class="${cell.warn ? "ev-changed" : ""}">${esc(cell.text)}</span></div>`;

}
// A run that edited its own instructions does not get folded away like the

  const rows = list.map((c) => `<div class="ev"><span class="ev-changed">${esc(c)}</span></div>`).join("");

    : "";

    <div class="a ${t.error ? "err" : ""}">${answerHtml(t.text)}</div>${statsHtml(t)}</div>`;

// The open run's steps, pushed rather than polled. The shared refresh control
// owns the only clock on this page and defaults to a minute, which is right for
// a board and wrong for the seconds after you press send — so a run in flight
// is watched over a streaming response instead of by a second timer.
//
// fetch + ReadableStream, not EventSource: every call here carries the bearer
// token as a header, and EventSource cannot send headers.
let runAbort = null;
async function watchRun(key) {
  stopWatching();
  const controller = new AbortController();
  runAbort = controller;
  let response;
  try {
    response = await api("/v1/runs/" + encodeURIComponent(key) + "/stream", { signal: controller.signal });
    if (!response.ok || !response.body) return;
  } catch { return; }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffered = "";
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffered += decoder.decode(value, { stream: true });
      const lines = buffered.split("\n");
      buffered = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        let msg;
        try { msg = JSON.parse(line); } catch { continue; }
        if (key !== sel) return;                      // the operator moved on
        if (msg.type === "ping") continue;
        if (msg.type === "snapshot") { liveReplace(msg.events || []); continue; }
        if (msg.type === "done") { await renderDetail(false); return; }
        liveAppend(msg);
      }
    }

    // brings the run's state in, just later.

}
function stopWatching() {

}
function liveFeedNode() {
  return document.querySelector("#turns .turn:last-child .proc");
}
function liveReplace(events) {
  const node = liveFeedNode();
  if (node) node.innerHTML = events.map(eventHtml).join("");
  $("#turns").scrollTop = $("#turns").scrollHeight;
}
function liveAppend(event) {
  const node = liveFeedNode();
  if (!node) return;
  const atBottom = $("#turns").scrollHeight - $("#turns").scrollTop - $("#turns").clientHeight < 60;
  if (event.type === "delta") {
    // One growing line, not one line per token: the model is writing, and a
    // reader wants a sentence forming rather than a list of fragments.
    let live = node.querySelector(".ev-live:last-child");
    const kind = event.kind === "thinking" ? "thinking" : "answer";
    if (!live || live.dataset.kind !== kind) {
      node.insertAdjacentHTML("beforeend", `<div class="ev-live ${kind === "thinking" ? "thinking" : ""}" data-kind="${kind}"></div>`);
      live = node.querySelector(".ev-live:last-child");
    }
    live.textContent += event.text;
  } else if (event.type === "tool_done") {
    // A duration report for a step already on screen; a step nobody streamed
    // (a subagent's) appears now, indented.
    const step = event.id ? node.querySelector(`[data-tid="${CSS.escape(event.id)}"]`) : null;
    if (step) {
      if (event.ms != null) step.insertAdjacentHTML("beforeend", ` <span class="ev-ms">${fmtMs(event.ms)}</span>`);
      if (event.error) step.classList.add("ev-err");
    } else {
      node.insertAdjacentHTML("beforeend", eventHtml({ ...event, type: "tool_use", sub: true }));
    }

    // A finished block supersedes whatever was streaming into it.
    node.querySelectorAll(".ev-live").forEach((n) => n.remove());
    node.insertAdjacentHTML("beforeend", eventHtml(event));

async function renderDetail(startPolling) {
  if (!sel) return null;
  const r = await api("/v1/runs/" + encodeURIComponent(sel));
  if (r.status === 404) {
    $("#turns").innerHTML = '<div class="empty">session not found (in-flight run lost to a restart?)</div>';
    return null;
  }
  const run = await r.json();
  // What this conversation has cost so far, next to what it is: a follow-up is
  // cheap to ask for and the running total is the only thing that says otherwise.
  const spent = (run.turns || []).reduce((sum, turn) => sum + (Number(turn.cost_usd) || 0), 0);
  const turnCount = (run.turns || []).length;
  // How much of this session's context was reused rather than paid for again.
  // The prefix an investigation carries is the harness's ~29k, not ours to trim,
  // so reuse is the only lever left — which makes this worth a permanent place.
  const tok = (run.turns || []).reduce((acc, turn) => {
    const u = turn.usage || {};
    acc.fresh += Number(u.input_tokens || 0);
    acc.cached += Number(u.cache_read_input_tokens || u.cacheReadInputTokens || 0);
    return acc;
  }, { fresh: 0, cached: 0 });
  const hit = tok.fresh + tok.cached ? Math.round((100 * tok.cached) / (tok.fresh + tok.cached)) : null;
  $("#meta").textContent =
    `${run.session_key} · ${run.status}` +
    (run.model ? ` · ${run.model}` : "") +
    (turnCount ? ` · ${turnCount} turn${turnCount > 1 ? "s" : ""} $${spent.toFixed(4)}` : "") +
    (hit === null ? "" : ` · cache ${hit}%`) +
    ` · engine session ${run.engine_session_id || "—"}` +
    (run.error ? ` · ${run.error}` : "");
  // Recorded prompt inputs are only legible next to the files as they are now.
  const now = run.inputs_now;
  const parts = (run.turns || []).map((t) => turnHtml(t, now));
  if (run.status === "running") {
    const live = (run.events || []).map(eventHtml).join("");
    parts.push(
      `<div class="turn">${qHtml(run.current_message)}${inputsHtml(run.inputs, now)}` +
      `<div class="proc">${live}</div>` +
      `<div class="pending">investigating</div></div>`,
    );
  }
  // What this investigation learned, offered as a runbook draft. Drafted only:
  // saving it is the operator's click, because an investigator that writes its
  // own future instructions is one nobody reviewed.
  if (run.status === "completed" && (run.turns || []).length) {
    parts.push(
      `<div class="mem-bar"><button id="distill">distill into a runbook draft</button>` +
      `<span id="distillStatus" class="dim"></span></div>`,
    );
  }
  $("#turns").innerHTML = parts.join("") || '<div class="empty">no turns yet</div>';
  const distill = $("#distill");
  if (distill) {
    distill.onclick = async () => {
      $("#distillStatus").textContent = "drafting…";
      try {
        const r = await api("/v1/runs/" + encodeURIComponent(sel) + "/distill", { method: "POST" });
        if (!r.ok) { $("#distillStatus").textContent = "failed (" + r.status + ")"; return; }
        const draft = await r.json();
        stopWatching();
        editSkill(draft.name, draft.content);
      } catch (e) { $("#distillStatus").textContent = e.message; }
    };
  }
  $("#turns").scrollTop = $("#turns").scrollHeight;
  $("#send").disabled = run.status === "running";
  $("#stopBtn").style.display = run.status === "running" ? "" : "none";
  $("#msg").placeholder = run.status === "running"
    ? "a turn is in flight…"
    : "follow-up in this session… (Enter sends, Shift+Enter for a new line)";
  // Watch while it runs, let go the moment it settles.
  if (run.status === "running") { if (!runAbort) watchRun(run.session_key); }
  else stopWatching();
  return run;
}

  if (!sel) return;
  try {
    const r = await api("/sessions/" + encodeURIComponent(sel) + "/stop", { method: "POST" });
    if (!r.ok && r.status !== 409) {
      throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
    }

async function openMemory() {
  leaveSessions("memory");
  try {
    const m = await (await api("/v1/memory")).json();
    let pending = [];
    try { pending = (await (await api("/v1/memory/suggestions")).json()).open || []; } catch (e) {}
    $("#meta").textContent = "environment memory · CLAUDE.md · loaded into every investigation";
    // Investigations propose; only a person writes. Suggestions sit above the
    // editor because each one is a pending question, not archive material.
    const sugHtml = pending.length
      ? `<div class="review-head" style="color:var(--amber)">suggested by investigations · ${pending.length}</div>` +
        pending.map((row) =>
          `<div class="ev sug-row" data-id="${attr(row.id)}"><span class="ev-tool">${esc(row.session_key)}</span>` +
          `${esc(row.line)} <a class="hist-diff" data-act="accept">accept</a>` +
          `<a class="hist-diff" data-act="dismiss">dismiss</a></div>`).join("")
      : "";
    $("#turns").innerHTML = sugHtml + `
      <div class="mem-tip">Facts every investigation should start from: cluster topology, known false alarms,
      naming conventions, where the dashboards live. The engine loads this file automatically at each turn.</div>
      <textarea id="memEdit" spellcheck="false"></textarea>
      <div class="mem-bar"><button id="memSave" class="primary">Save</button><span id="memStatus"></span></div>`;
    $("#memEdit").value = m.content || "";
    $("#turns").scrollTop = 0;
    $("#turns").querySelectorAll(".sug-row a").forEach((a) => (a.onclick = async () => {
      const id = a.closest(".sug-row").dataset.id;
      const r = await api(`/v1/memory/suggestions/${encodeURIComponent(id)}/${a.dataset.act}`, { method: "POST" });
      if (r.ok) openMemory(); else $("#hint").textContent = "failed (" + r.status + ")";
    }));
    $("#memSave").onclick = async () => {
      try {
        const r = await api("/v1/memory", { method: "PUT", body: JSON.stringify({ content: $("#memEdit").value }) });
        $("#memStatus").textContent = r.ok ? "saved" : "save failed (" + r.status + ")";
        if (r.ok) setTimeout(() => { $("#memStatus").textContent = ""; }, 2500);
      } catch (e) { $("#memStatus").textContent = e.message; }
    };
  } catch (e) { $("#hint").textContent = e.message; }
}

async function renderSkills() {
  try {
    const skills = await (await api("/v1/skills")).json();
    const proj = skills.filter((s) => s.layer === "project").length;
    const host = skills.length - proj;
    $("#meta").textContent = `runbooks · ${proj} project${host ? ` + ${host} host (read-only)` : ""} · {workdir}/.claude/skills`;
    if (!skills.length) {
      $("#turns").innerHTML =
        '<div class="empty">no skills yet — when an investigation verifies a reusable diagnostic path, it distills a SKILL.md runbook here, and later runs load it automatically</div>';
      return;
    }
    const row = (s) => `
      <div class="skill" data-name="${esc(s.name)}">
        <div class="skill-name">${esc(s.name)}<span class="skill-layer ${esc(s.layer || "project")}">${esc(s.layer || "project")}</span>${
          // A runbook a run wrote is loaded by every later run exactly like one
          // a person wrote. The only place that difference can still be seen is
          // here, so it is said on the row rather than a click away.
          s.written_by === "auto-distill" && !s.reviewed
            ? `<span class="skill-layer unreviewed" title="written automatically from ${attr(s.from_session || "a run")}; nobody has reviewed it">unreviewed</span>`
            : ""}${
          s.proposal
            ? '<span class="skill-layer proposal" title="a consolidation draft is waiting for review">consolidation</span>'
            : ""}</div>
        <div class="skill-desc">${esc(s.description || "(no description)")}</div>
        <div class="skill-meta">${esc((s.files || []).join("  "))} · ${fmtTime(s.modified)}</div>
      </div>`;
    // The review queue comes first: these are loaded into every later run
    // right now, sight unseen, so they are the rows with a decision pending.
    const pending = skills.filter((s) => s.written_by === "auto-distill" && !s.reviewed);
    const rest = skills.filter((s) => !pending.includes(s));
    $("#turns").innerHTML =
      (pending.length
        ? `<div class="review-head">needs review · ${pending.length} — open one, then <b>mark reviewed</b> or edit it</div>` +
          pending.map(row).join("")
        : "") +
      (pending.length && rest.length ? '<div class="review-head quiet">reviewed / hand-written</div>' : "") +
      rest.map(row).join("");
    $("#turns").scrollTop = 0;
    $("#turns").querySelectorAll(".skill").forEach((n) => (n.onclick = () => renderSkill(n.dataset.name)));
  } catch (e) { $("#hint").textContent = e.message; }
}

async function renderSkill(name) {
  const r = await api("/v1/skills/" + encodeURIComponent(name));
  if (!r.ok) { $("#hint").textContent = "skill not found"; return; }
  const s = await r.json();
  const layer = s.layer || "project";
  // Provenance and history ride along; a failure of either must not take the
  // runbook text with it.
  let origin = {}, history = [], proposal = null;
  if (layer === "project") {
    try { origin = await (await api(`/v1/skills/${encodeURIComponent(name)}/origin`)).json(); } catch (e) {}
    try { history = await (await api(`/v1/skills/${encodeURIComponent(name)}/history`)).json(); } catch (e) {}
    try {
      const pr = await api(`/v1/skills/${encodeURIComponent(name)}/proposal`);
      if (pr.ok) proposal = await pr.json();
    } catch (e) {}
  }
  $("#meta").textContent = `skill · ${name}/SKILL.md · ${layer} layer`;
  const body = (s.content || "").replace(/^---[\s\S]*?\n---\n/, ""); // frontmatter is for machines
  const note = layer === "user"
    ? '<span class="skill-note">host library, read-only — saving stores a project copy that shadows it</span>'
    : "";
  const unreviewed = origin.written_by === "auto-distill" && !origin.reviewed;
  const revisions = Array.isArray(origin.revisions) ? origin.revisions : [];
  const provenance = revisions.length
    ? `<details class="proc-past"><summary>provenance · ${revisions.length} revisions${unreviewed ? " · unreviewed" : ""}</summary>
        <div class="proc">${revisions.slice().reverse().map((v) =>
          `<div class="ev"><span class="ev-tool">${esc(v.by || "?")}</span>` +
          `${esc(fmtTime(v.at))}${v.session_key ? " · " + esc(v.session_key) : ""}${v.action ? " · " + esc(v.action) : ""}</div>`
        ).join("")}</div></details>`
    : "";
  const historyHtml = history.length
    ? `<details class="proc-past"><summary>history · ${history.length} displaced versions</summary>
        <div class="proc">${history.map((h) =>
          `<div class="ev"><span class="ev-tool">${esc(fmtTime(h.stamp))}</span>${esc(String(h.bytes))}B ` +
          `<a class="hist-diff" data-stamp="${attr(String(h.stamp))}">diff</a></div>`
        ).join("")}</div></details>`
    : "";
  // A consolidation draft outranks everything else on the page: it is a
  // machine asking permission to rewrite this runbook, and the whole design
  // is that nothing rewrites without a person looking.
  const proposalBar = proposal
    ? `<div class="tamper" style="border-color:var(--amber)"><div class="tamper-head" style="color:var(--amber)">consolidation draft awaiting review</div>
        <div class="proc"><div class="ev">a consolidation run distilled the case pile into one procedure — review the diff, then approve or reject</div></div>
        <div class="skill-bar"><button id="propDiff">diff</button>
        <button id="propApprove" class="primary">approve</button>
        <button id="propReject" class="danger">reject</button></div></div>`
    : "";
  $("#turns").innerHTML = proposalBar +
    `<div class="skill-bar"><span class="skill-back">← all skills</span><span class="spacer"></span>${note}` +
    (unreviewed ? '<button id="skillReview" class="primary">mark reviewed</button>' : "") +
    `<button id="skillEdit">edit</button>` +
    (layer === "project" ? '<button id="skillDelete" class="danger">delete</button>' : "") +
    `</div>` + provenance + historyHtml + mdToHtml(body);
  $("#turns").scrollTop = 0;
  $("#turns").querySelector(".skill-back").onclick = () => renderSkills();
  $("#skillEdit").onclick = () => editSkill(name, s.content || "");
  const review = $("#skillReview");
  if (review) review.onclick = async () => {
    const resp = await api(`/v1/skills/${encodeURIComponent(name)}/review`, { method: "POST" });
    if (resp.ok) renderSkill(name);
    else $("#hint").textContent = "review failed (" + resp.status + ")";
  };
  $("#turns").querySelectorAll(".hist-diff").forEach((n) => (n.onclick = () => renderSkillDiff(name, n.dataset.stamp, s.content || "")));
  if (proposal) {
    $("#propDiff").onclick = () => renderProposalDiff(name, s.content || "", proposal.content || "");
    $("#propApprove").onclick = async () => {
      if (!confirm(`replace "${name}" with the consolidation draft? (the current version goes into history)`)) return;
      const r2 = await api(`/v1/skills/${encodeURIComponent(name)}/proposal/approve`, { method: "POST" });
      if (r2.ok) renderSkill(name); else $("#hint").textContent = "approve failed (" + r2.status + ")";
    };
    $("#propReject").onclick = async () => {
      const r2 = await api(`/v1/skills/${encodeURIComponent(name)}/proposal/reject`, { method: "POST" });
      if (r2.ok) renderSkill(name); else $("#hint").textContent = "reject failed (" + r2.status + ")";
    };
  }
  const del = $("#skillDelete");
  if (del) del.onclick = async () => {
    if (!confirm(`delete skill "${name}"? (a same-named host skill would resurface)`)) return;
    const resp = await api("/v1/skills/" + encodeURIComponent(name), { method: "DELETE" });
    if (resp.ok) renderSkills();
    else $("#hint").textContent = "delete failed (" + resp.status + ")";
  };
}

// Plain LCS line diff. Runbooks are a few hundred lines at most, and what a
// reviewer needs is "what did that write change", not a patch tool.
function lineDiff(oldText, newText) {
  const a = oldText.split("\n"), b = newText.split("\n");
  const n = a.length, m = b.length;
  const lcs = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      lcs[i][j] = a[i] === b[j] ? lcs[i + 1][j + 1] + 1 : Math.max(lcs[i + 1][j], lcs[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { out.push(["ctx", a[i]]); i++; j++; }
    else if (lcs[i + 1][j] >= lcs[i][j + 1]) { out.push(["del", a[i]]); i++; }
    else { out.push(["add", b[j]]); j++; }
  }
  while (i < n) out.push(["del", a[i++]]);
  while (j < m) out.push(["add", b[j++]]);
  return out;
}

function renderProposalDiff(name, currentContent, draftContent) {
  $("#meta").textContent = `skill · ${name} · current → consolidation draft`;
  const rows = lineDiff(currentContent, draftContent);
  let html = "", quiet = 0;
  const flushQuiet = () => { if (quiet > 2) html += `<div class="diff-row ctx quiet">… ${quiet - 2} unchanged lines …</div>`; quiet = 0; };
  for (const [kind, line] of rows) {
    if (kind === "ctx") { quiet++; if (quiet <= 2) html += `<div class="diff-row ctx">${esc(line) || "&nbsp;"}</div>`; continue; }
    flushQuiet();
    html += `<div class="diff-row ${kind}">${kind === "add" ? "+" : "−"} ${esc(line)}</div>`;
  }
  flushQuiet();
  $("#turns").innerHTML =
    `<div class="skill-bar"><span class="skill-back">← ${esc(name)}</span></div>` +
    `<div class="diff">${html || '<div class="diff-row ctx">identical</div>'}</div>`;
  $("#turns").querySelector(".skill-back").onclick = () => renderSkill(name);
}

async function renderSkillDiff(name, stamp, currentContent) {
  const r = await api(`/v1/skills/${encodeURIComponent(name)}/history/${encodeURIComponent(stamp)}`);
  if (!r.ok) { $("#hint").textContent = "version not found"; return; }
  const version = await r.json();
  $("#meta").textContent = `skill · ${name} · ${fmtTime(Number(stamp))} → current`;
  // Context lines collapse to keep the change readable; a reviewer wants the
  // delta, and the full text is one click away on either side.
  const rows = lineDiff(version.content || "", currentContent);
  let html = "", quiet = 0;
  const flushQuiet = () => { if (quiet > 2) html += `<div class="diff-row ctx quiet">… ${quiet - 2} unchanged lines …</div>`; quiet = 0; };
  for (const [kind, line] of rows) {
    if (kind === "ctx") { quiet++; if (quiet <= 2) html += `<div class="diff-row ctx">${esc(line) || "&nbsp;"}</div>`; continue; }
    flushQuiet();
    html += `<div class="diff-row ${kind}">${kind === "add" ? "+" : "−"} ${esc(line)}</div>`;
  }
  flushQuiet();
  $("#turns").innerHTML =
    `<div class="skill-bar"><span class="skill-back">← ${esc(name)}</span><span class="spacer"></span>` +
    `<button id="skillRestore" class="danger">restore this version</button></div>` +
    `<div class="diff">${html || '<div class="diff-row ctx">identical</div>'}</div>`;
  $("#turns").querySelector(".skill-back").onclick = () => renderSkill(name);
  $("#skillRestore").onclick = async () => {
    if (!confirm(`replace the current runbook with the ${fmtTime(Number(stamp))} version? (the current one goes into history)`)) return;
    const resp = await api("/v1/skills/" + encodeURIComponent(name), {
      method: "PUT",
      body: JSON.stringify({ content: version.content || "" }),
    });
    if (resp.ok) renderSkill(name);
    else $("#hint").textContent = "restore failed (" + resp.status + ")";
  };
}

function editSkill(name, content) {
  $("#meta").textContent = `skill · ${name}/SKILL.md · editing (saves to the project layer)`;
  $("#turns").innerHTML = `
    <div class="skill-bar"><span class="skill-back">← cancel</span></div>

  $("#skillSrc").value = content;

  };
}

// ── system: runtime knobs, MCP servers, health — one page ───────────────
function kvGrid(pairs) {
  return '<div class="kv-grid">' + pairs.map(([k, v]) =>
    `<span class="k">${esc(k)}</span><span class="v">${esc(v == null ? "—" : String(v))}</span>`).join("") + "</div>";
}

async function openSystem() {
  leaveSessions("system");
  try {
    const [config, mcp, health, agents] = await Promise.all([
      (await api("/v1/config")).json(),
      (await api("/v1/mcp")).json(),
      (await fetch("/healthz")).json(),
      (await api("/v1/agents")).json(),
    ]);
    $("#meta").textContent = "system · runtime configuration (secrets shown as set/unset, never values)";
    const knobs = kvGrid([
      ["model", config.model],
      ["max_turns / max_concurrent", `${config.max_turns} / ${config.max_concurrent}`],
      ["timeouts (default / max)", `${config.default_timeout_seconds}s / ${config.max_timeout_seconds}s`],
      ["escalate_levels", (config.escalate_levels || []).join(", ")],
      ["budget", config.budget_usd ? `$${config.budget_usd} / ${config.budget_window_hours}h` : "off"],
      ["retention_days", config.retention_days || "keep everything"],
      ["setting_sources", (config.setting_sources || []).join(", ")],
      ["skills filter", config.skills_filter || "engine default"],
      ["system prompt", `${config.system_prompt.path}${config.system_prompt.active ? " (active)" : " (absent)"}`],
      ["subagent roles", `${agents.filter((a) => a.source !== "config").length} from .claude/agents files + ${agents.filter((a) => a.source === "config").length} config-pinned`],
      ["agents_config (optional JSON)", config.agents_config],
      ["mcp_config", config.mcp_config],
      ["return_url", config.return_url],
      ["self-alarm / event secret / return secret", `${config.alarm_configured ? "set" : "—"} / ${config.event_secret_set ? "set" : "—"} / ${config.return_secret_set ? "set" : "—"}`],
      ["workdir", config.workdir],
    ]);
    const servers = Object.entries(mcp.servers || {});
    const mcpHtml = servers.length
      ? servers.map(([name, s]) => kvGrid([
          [name + (s.disabled ? " (disabled)" : ""), [s.command, ...(s.args || [])].filter(Boolean).join(" ") || s.url || s.type || ""],
          ["env keys", (s.env_keys || []).join(", ") || "(none)"],
        ])).join("")
      : `<div class="mem-tip">no MCP servers configured${mcp.config ? ` in ${esc(mcp.config)}` : " — set HOOKPROBE_MCP_CONFIG"} · edits apply to the next run, no restart</div>`;
    const healthHtml = kvGrid([
      ["active runs", health.active_runs],
      ["turns running / queued", `${health.running_turns} / ${health.queued_turns}`],
      ["report returns failed", health.return_failures],
    ]);
    $("#turns").innerHTML =
      '<div class="subhead">runtime</div>' + knobs +
      '<div class="subhead">mcp servers</div>' + mcpHtml +
      '<div class="subhead">health</div>' + healthHtml;
    $("#turns").scrollTop = 0;
  } catch (e) { $("#hint").textContent = e.message; }
}

// ── audit: the flight recorder, filterable, following while open ─────────
let auditReload = null;

async function openActions() {
  leaveSessions("actions");
  try {
    const d = await (await api("/v1/remediations")).json();
    const rows = d.proposals || [];
    $("#meta").textContent = "actions · remediation proposals · nothing runs without your approval";
    if (!rows.length) {
      $("#turns").innerHTML = '<div class="empty">no remediation proposals — an investigation appends a fenced remediation block only when it is confident, and an operator approves each step before it runs</div>';
      return;
    }
    const riskTone = { high: "var(--bad)", medium: "var(--amber)", low: "var(--dim)" };
    $("#turns").innerHTML = rows.map((r) => {
      const steps = (r.steps || []).map((s, i) => {
        const res = (r.results || [])[i];
        const tag = res ? (res.exit === 0 ? '<span class="ev-ms" style="color:var(--ok)">exit 0 · ' + fmtMs(res.ms) + "</span>"
                                          : '<span class="ev-ms" style="color:var(--bad)">exit ' + esc(res.exit) + "</span>") : "";
        return '<div class="ev"><span class="ev-tool" style="color:' + (riskTone[s.risk] || "var(--dim)") + '">' +
          esc(s.risk) + "</span>" + esc(s.action) + " " + tag +
          '<div class="rem-cmd">$ ' + esc(s.command) + "</div>" +
          (s.rollback ? '<div class="rem-roll">undo: ' + esc(s.rollback) + "</div>" : "") +
          (res && res.output ? '<pre class="rem-out">' + esc(res.output) + "</pre>" : "") + "</div>";
      }).join("");
      const bar = r.status === "proposed"
        ? '<div class="skill-bar"><button class="rem-approve primary" data-id="' + attr(r.id) + '">approve &amp; run</button>' +
          '<button class="rem-reject danger" data-id="' + attr(r.id) + '">reject</button></div>'
        : '<div class="rem-status ' + esc(r.status) + '">' + esc(r.status) + "</div>";
      return '<div class="rem" data-id="' + attr(r.id) + '"><div class="rem-head">' +
        '<span class="badge ' + esc(r.status) + '">' + esc(r.status) + "</span>" +
        '<span class="when">from ' + esc(r.session_key) + " · " + esc(fmtTime(r.created_at)) + "</span></div>" +
        '<div class="proc">' + steps + "</div>" + bar + "</div>";
    }).join("");
    $("#turns").querySelectorAll(".rem-approve").forEach((b) => (b.onclick = async () => {
      if (!confirm("approve and run every step of this proposal? each command runs exactly as written.")) return;
      const r = await api("/v1/remediations/" + encodeURIComponent(b.dataset.id) + "/approve", { method: "POST" });
      if (r.ok) openActions();
      else { const e = await r.json().catch(() => ({})); $("#hint").textContent = "approve failed: " + (e.detail || r.status); }
    }));
    $("#turns").querySelectorAll(".rem-reject").forEach((b) => (b.onclick = async () => {
      const r = await api("/v1/remediations/" + encodeURIComponent(b.dataset.id) + "/reject", { method: "POST" });
      if (r.ok) openActions();
    }));
  } catch (e) { $("#hint").textContent = e.message; }
}

async function openAudit(filter) {

    <div class="audit-bar">
      <input id="auditQ" placeholder="filter by session…" autocomplete="off">
      <span class="skill-note" id="auditCount"></span>
    </div>
    <div id="auditRows"></div>`;
  $("#auditQ").value = filter || "";
  const load = async () => {
    if (viewMode !== "audit") return;
    try {
      const q = encodeURIComponent($("#auditQ").value || "");
      const d = await (await api("/v1/audit?limit=300" + (q ? "&session=" + q : ""))).json();
      $("#auditCount").textContent = `${d.count} calls (newest last)`;
      $("#auditRows").innerHTML = d.entries.map((e) => `
        <div class="audit-row ${e.error ? "err" : ""}">
          <span class="ts">${fmtTime(e.ts)}</span>
          <span class="a-session">${esc(e.session)}</span>
          <span class="a-tool">${esc(e.tool)}</span>
          <span class="a-detail">${esc(e.detail || "")}</span>
        </div>`).join("") || '<div class="empty">no tool calls recorded yet — the recorder writes when tools actually run</div>';
    } catch (e) { $("#hint").textContent = e.message; }
  };
  $("#auditQ").oninput = load;
  auditReload = load;
  await load();
}

function openHelp() {
  leaveSessions("help");
  $("#meta").textContent = "help · what hookprobe is and how to use it · start here, human or AI";
  const base = "http://hookprobe:8088";
  $("#turns").innerHTML = `<div class="help">
<h2>What this is</h2>
<p>hookprobe is a <b>read-only alert investigator</b>: given an alert worth digging into, it runs
one tool-using agent investigation (logs, metrics, its own case files, a browser when needed) and
produces a short report with the conclusion first. It normally sits inside the hookstack family —
the pipe (hookrelay) copies important alerts over, and the finished report travels back through
the pipe to the same channels as the verdict — but any OpenClaw-dialect caller can drive it
directly.</p>

<h2>Three steps to start</h2>
<p>1. Paste your <b>bearer token</b> top-right (kept in localStorage, once per browser).<br>
2. Hit <b>+ new session</b> and describe the investigation in a sentence (e.g. "run a read-only
health patrol of this container, conclusion first").<br>
3. Watch the live process feed while it runs and <b>Stop</b> it any time; when it finishes, the box
at the bottom is a <b>follow-up</b> — the same engine session resumes with all of the first
round's evidence intact.</p>

<h2>The seven views</h2>
<table>
<tr><th>View</th><th>What it shows / what you can change</th></tr>
<tr><td><b>sessions</b></td><td>Every investigation: turn by turn, the bill line (model, tokens, cost, duration), the process feed replayed. Relay-born sessions carry their return outcome. The sidebar filters.</td></tr>
<tr><td><b>skills</b></td><td>Diagnostic runbooks (SKILL.md), layer-tagged: project = on the volume and editable, user = a host library, read-only. Saving always lands in the project layer (copy-on-write). What the agent distills lands here too.</td></tr>
<tr><td><b>agents</b></td><td>Subagent roles (.claude/agents/*.md). The main agent delegates to them through the Task tool; copy one of the three seeded examples to make your own.</td></tr>
<tr><td><b>memory</b></td><td>Environment memory (CLAUDE.md): topology, known false alarms, conventions — injected at the start of every investigation.</td></tr>
<tr><td><b>prompt</b></td><td>The system-prompt append: your investigation methodology. Saved edits apply to the next run.</td></tr>
<tr><td><b>system</b></td><td>Runtime panorama: model, budget, retention, layers, every config path (secrets as set/unset) plus MCP servers and health counters.</td></tr>
<tr><td><b>audit</b></td><td>The flight recorder: one line per tool call (subagents included), filterable by session, following every 8s.</td></tr>
</table>

<h2>API quick reference (for an AI or a script)</h2>
<p class="dim">Auth: every request carries <code>Authorization: Bearer &lt;token&gt;</code>. Polling contract:
/final answers 202 while running; on a 200 <code>isFinal</code> is always true — trust the first
confirming read, no stability heuristics needed.<br>
The examples use the <b>docker-network</b> address <code>http://hookprobe:8088</code>; from the host,
use the loopback mapping <code>http://127.0.0.1:8088</code>.</p>
<pre># start an investigation (OpenClaw-compatible contract)
curl -X POST ${base}/hooks/agent -H "Authorization: Bearer $TOKEN" \\
  -H "Content-Type: application/json" \\
  -d '{"message":"what to investigate…","sessionKey":"my:task:1","timeoutSeconds":900}'

# poll for the result (202 = running; 200 => {"isFinal":true,"text":"the full report"})
curl ${base}/sessions/my:task:1/final -H "Authorization: Bearer $TOKEN"

# follow up in the same session / stop the turn in flight
curl -X POST ${base}/sessions/my:task:1/continue -H ... -d '{"message":"a follow-up question"}'
curl -X POST ${base}/sessions/my:task:1/stop -H ...</pre>
<table>
<tr><th>Management endpoint</th><th>Purpose</th></tr>
<tr><td><code>GET /v1/runs</code> · <code>GET /v1/runs/{key}</code></td><td>Session list / full run record (events and bill included)</td></tr>
<tr><td><code>GET/PUT/DELETE /v1/skills[/{name}]</code></td><td>Browse and copy-on-write edit the skills</td></tr>
<tr><td><code>GET/PUT/DELETE /v1/agents[/{name}]</code></td><td>Subagent roles, same semantics</td></tr>
<tr><td><code>GET/PUT /v1/memory</code> · <code>/v1/system-prompt</code></td><td>Environment memory / methodology — saved edits are hot</td></tr>
<tr><td><code>GET /v1/mcp</code> · <code>/v1/config</code> · <code>/v1/budget</code> · <code>/v1/audit</code></td><td>MCP servers (env key names only) / config snapshot / budget arithmetic / audit tail</td></tr>
<tr><td><code>GET /healthz</code> (no auth)</td><td>Liveness plus running/queued/return-failure counters, for an external monitor</td></tr>
</table>

<h2>File map (the /data volume is the whole memory — back that up)</h2>
<table>
<tr><th>Path</th><th>What it is</th></tr>
<tr><td><code>results/*.json</code></td><td>Case files: the full record of every investigation — and the episodic memory a new investigation greps first</td></tr>
<tr><td><code>.claude/skills/</code> · <code>.claude/agents/</code></td><td>Skills and roles (project layer). A host library appears as the read-only user layer.</td></tr>
<tr><td><code>CLAUDE.md</code> · <code>system-prompt.md</code> · <code>mcp.json</code></td><td>Environment memory / methodology / MCP config — all three read fresh at every run</td></tr>
<tr><td><code>audit/*.jsonl</code></td><td>The audit ledger; <code>home/</code> holds the resumable session transcripts</td></tr>
</table>

<h2>Safety model (why it can run unattended)</h2>
<p>Read-only in three layers: <b>read-only credentials</b> (the real boundary — only query-grade
identities are mounted) → <b>the bash guard</b> (denies mutating verbs of kubectl/systemctl/
terraform and friends, inside subagents too) → <b>a disposable container</b> (non-root). On top of
that: the <b>budget breaker</b> (once the window's spend hits the ceiling the event door refuses new
investigations — and says so on a card), <b>idempotency</b> (an alert storm funds one investigation,
not N), and <b>failure completes the loop</b> (timeout, crash, restart or refusal all return a
report).</p>
<p>A report's card carries buttons, and <code>POST /hooks/action</code> is where a press lands —
signed by the pipe exactly like the event door, because both are the pipe talking. A press stands in
for the console click on a remediation proposal and for <b>nothing else</b>: the allowlist is a file
an operator edits on the host, no button can reach it, so a press has the same blast radius as a
click and a denial comes back as a denial. Each press is claimed by
<code>(correlation_id, kind, at)</code> before anything runs, so the redelivery an IM platform sends
when it does not hear an answer cannot buy a second turn or approve twice.</p>

<h2>Loop hygiene (the run's context and bill)</h2>
<p>Two advisory guards plus one record — none is a security boundary, all exist because an unattended
run cannot notice it is wasting itself.</p>
<table>
<tr><td><b>repeat reminder</b></td><td>On the <code>HOOKPROBE_REPEAT_REMINDER_AT</code>-th identical
call (3rd by default, and every multiple after) the tool result carries a note: change approach, or
record what stays unknown and move on. The budget breaker stops spending after the fact; this is the
nudge before it costs.</td></tr>
<tr><td><b>command deadlines</b></td><td><code>HOOKPROBE_BASH_TIMEOUT_MS</code> /
<code>HOOKPROBE_BASH_MAX_TIMEOUT_MS</code> cap a single command, so a curl at an unreachable host
cannot hold a slot until the whole run times out.</td></tr>
<tr><td><b>what it cost</b></td><td>Each turn carries its own line — model, tokens in/out, cache reads and writes,
dollars, seconds. The session's running total sits in the header line beside the session key, and the chip top-right
is the whole window's spend (with the ceiling next to it when <code>HOOKPROBE_BUDGET_USD</code> is set).</td></tr>
<tr><td><b>was it worth it</b></td><td>The line under the spend bars — <i>N investigations, $X, M found the
cause</i>. Cost has always been countable and worth was countable nowhere, so "you want me to pay a model per
alert?" had a dollar figure and nothing to put beside it. The rulings come from the <b>Found the cause</b> /
<b>Missed it</b> buttons on the delivered card, and a session that carries one shows it in the list. An
investigation nobody ruled on is unrated, never counted as a miss.</td></tr>
<tr><td><b>cache %</b></td><td>How much of the context was reused instead of paid for again. An investigation carries
about 29k tokens before its alert is even mentioned — the harness's own system prompt and tool schemas, which neither a
smaller tool list nor a different prompt preset shrinks — so reuse is the only lever left. It is high inside a session
and low across them: <b>a follow-up here is roughly ten times cheaper than opening a new investigation</b>, alerts
investigated close together share a warm prefix, and every edit to memory, prompt or skills starts the prefix over.</td></tr>
<tr><td><b>inputs record</b></td><td>Every turn records what it was given — model, skill layers and
names, roles, MCP servers, and digests of the environment memory and appended methodology. Those
files live on a mutable volume; a stale line in <code>CLAUDE.md</code> once made every report come
back in the wrong language while the request looked identical. Open <b>inputs · what the model was
given</b> on any turn.</td></tr>
</table>
<p>Oversized tool output needs no guard here: the harness saves the full copy under the session's
<code>tool-results/</code> and hands the model a short preview plus that path.</p>

<h2>Recipes</h2>
<ul>
<li><b>Install a marketplace skill</b>: unzip it into <code>/data/.claude/skills/&lt;name&gt;/</code> (drop __MACOSX); the next run loads it — read it first, a skill instructs an agent holding your credentials</li>
<li><b>Add a role</b>: open any seeded role in the agents view → copy, rename, save; or drop a .md file in place</li>
<li><b>Wire an MCP server</b>: edit <code>/data/mcp.json</code> (the marketplace config.json dialect works, enabled:false is skipped), confirm on the system view, next run picks it up</li>
<li><b>Control which skills a session sees</b>: the <code>HOOKPROBE_SKILLS</code> allowlist (a big library would otherwise flood the context); layers are switched with <code>HOOKPROBE_SETTING_SOURCES</code></li>
<li><b>Ask "what did it actually do"</b>: the audit view, filtered by session; a single run's feed is under process · N steps in sessions</li>
<li><b>Control the refresh</b>: this page keeps no clock. It holds one streaming connection to <code>/v1/live</code> and refetches what you are currently looking at when the service says something changed — so a burst of escalations is one refetch, not a tick per event. ↻ refetches on demand and the badge beside it reads <b>live</b> or <b>offline</b> (a dropped stream reconnects on its own, backing off). A run you are watching does not depend on that either: its steps are pushed over their own streaming response and stop when it settles</li>
<li><b>Scheduled patrols</b>: a host crontab that POSTs a "patrol due" event to the pipe's front door is enough — the escalation door turns it into a proactive investigation whose report travels the usual channels. Each patrol is its own case file, and cites what the last one found.</li>
</ul>
<p class="dim">Fuller design and deployment notes live in hookprobe/README.md and the repository OVERVIEW.md.</p>
</div>`;
  $("#turns").scrollTop = 0;
}

$("#msg").addEventListener("keydown", (e) => {
  // Enter sends, Shift+Enter breaks the line. This is a chat box before it is a
  // text editor, and the common case should not need a modifier.
  if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
  e.preventDefault();
  $("#composer").requestSubmit();
});

$("#composer").onsubmit = async (ev) => {
  ev.preventDefault();
  const msg = $("#msg").value.trim();
  if (!msg) return;
  $("#send").disabled = true;
  $("#hint").textContent = "";
  try {
    if (sel) {
      const r = await api("/sessions/" + encodeURIComponent(sel) + "/continue",
        { method: "POST", body: JSON.stringify({ message: msg }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
    } else {
      const key = "web:" + new Date().toISOString().replace(/[:.]/g, "-");
      const r = await api("/hooks/agent",
        { method: "POST", body: JSON.stringify({ message: msg, sessionKey: key }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
      sel = key;
      composeMode = false;
    }
    // Echo it before the round trip: the first thing a sender wants to see is
    // their own message, and the run is already spawned by the time we return.
    $("#turns").insertAdjacentHTML(
      "beforeend",
      `<div class="turn">${qHtml(msg)}<div class="proc"></div>` +
      `<div class="pending">investigating</div></div>`,
    );
    $("#turns").scrollTop = $("#turns").scrollHeight;
    $("#msg").value = "";
    watchRun(sel);
    await refreshList();
  } catch (e) {
    $("#hint").textContent = e.message;
    $("#send").disabled = false;
  }
};

if (location.hash.startsWith("#skills")) {
  const deepLink = decodeURIComponent(location.hash.slice("#skills".length).replace(/^\//, ""));
  if (deepLink) { leaveSessions("skills"); renderSkill(deepLink); }
  else openSkills();

else if (location.hash.startsWith("#agents")) {

  if (agentLink) { leaveSessions("agents"); renderAgent(agentLink); }
  else openAgents();
}
else if (location.hash === "#memory") openMemory();
else if (location.hash === "#prompt") openPrompt();
else if (location.hash === "#system") openSystem();
else if (location.hash === "#help") openHelp();
else if (location.hash.startsWith("#audit")) {
  openAudit(decodeURIComponent(location.hash.slice("#audit".length).replace(/^\//, "")));
}
async function refreshBudget() {
  const el = $("#budget");
  try {
    const b = await (await api("/v1/budget")).json();
    el.hidden = false;
    // Spend is shown whether or not a ceiling was set: an operator who declined
    // to cap the window still wants to know what it has cost.
    const spent = `$${Number(b.spent_usd || 0).toFixed(2)} / ${b.window_hours || 24}h`;
    const cache = b.cache_hit_ratio === null || b.cache_hit_ratio === undefined
      ? ""
      : ` · cache ${Math.round(b.cache_hit_ratio * 100)}%`;
    el.textContent = (b.enabled ? `${spent} of $${Number(b.budget_usd).toFixed(2)}` : spent) + cache;
    el.title = b.enabled
      ? "spend in the budget window, the ceiling the event door refuses at, and how much context was reused rather than re-paid"
      : "spend in the window · no ceiling set (HOOKPROBE_BUDGET_USD) · cache = context reused rather than re-paid";
    el.classList.toggle("hot", !!b.exhausted);
    // The other half of the bill. Printed as the service worded it rather than
    // reassembled here: the sentence gets quoted at people deciding whether to
    // pay for this, and one written in two places eventually says two things.
    const worth = $("#worth");
    if (worth) {
      worth.textContent = b.worth || "";
      worth.title = "investigations in the spend window, what they cost, and how many a person said found the cause"
        + (b.ruled_useless ? ` · ${b.ruled_useless} ruled a miss` : "")
        + " · rulings come from the card buttons on a delivered report";
    }
  } catch { el.hidden = true; }
}

  // ── live control · keep this block identical in all three pages ────────────
  // A board is watched while something is happening, and what it shows changes
  // when the service writes — not when a clock in the browser says so. So there
  // is no clock: the page holds one streaming connection and refetches what it
  // is looking at when the service says something changed. The dropdown this
  // replaces made the operator choose between a stale board and a busy one,
  // which is a choice the service can simply answer.
  //
  // NDJSON over fetch rather than EventSource: every board authenticates its
  // reads with a header, and EventSource cannot send one.
  var liveAbort = null;
  var liveRetry = 0;
  function liveMark(state) {
    var el = document.getElementById("rLive");
    if (!el) return;
    el.className = "live " + state;
    el.textContent = state === "on" ? "live" : "offline";
  }
  function liveConnect(url, headers, onChange) {
    if (liveAbort) liveAbort.abort();
    var controller = new AbortController();
    liveAbort = controller;
    fetch(url, { headers: headers(), signal: controller.signal }).then(function (response) {
      if (!response.ok || !response.body) throw new Error("stream " + response.status);
      liveMark("on");
      liveRetry = 0;
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffered = "";
      return (function pump() {
        return reader.read().then(function (chunk) {
          if (chunk.done) throw new Error("stream closed");
          buffered += decoder.decode(chunk.value, { stream: true });
          var lines = buffered.split("\n");
          buffered = lines.pop();
          lines.forEach(function (line) {
            if (!line.trim()) return;
            var message;
            try { message = JSON.parse(line); } catch (err) { return; }
            if (message.type === "changed") onChange();
          });
          return pump();
        });
      })();
    }).catch(function () {
      if (controller !== liveAbort) return;   // superseded by a newer connection
      liveMark("off");
      liveRetry = Math.min(liveRetry + 1, 6);
      // Backoff, capped: a service that is down should not be hammered, and a
      // board left open overnight should still come back on its own.
      setTimeout(function () {
        if (controller === liveAbort) liveConnect(url, headers, onChange);
      }, Math.pow(2, liveRetry) * 500);
    });
  }
  function wireLiveControl(url, headers, onChange) {
    document.getElementById("rNow").addEventListener("click", function () { onChange(); });
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) onChange();
    });
    onChange();
    liveConnect(url, headers, onChange);
  }
  // ── end live control ──────────────────────────────────────────────────────

// One tick refreshes whatever is on screen: the session list and the open
// session (its live feed included), or the audit tail.
async function tick() {
  await refreshBudget();
  if (viewMode === "sessions") {
    await refreshList();
    if (sel) await renderDetail(false).catch(() => null);
  } else if (viewMode === "audit" && auditReload) {
    await auditReload();
  }
  const now = new Date().toTimeString().slice(0, 8);
  $("#stamp").textContent = "refreshed " + now;
}

wireLiveControl("/v1/live", readHeaders, tick);
</script>
