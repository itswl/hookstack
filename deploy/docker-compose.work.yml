# The WORK deployment: the operator's own attention pipe, on their own machine.
#
#   docker compose -p hookstack-work --env-file .env \
#     -f deploy/docker-compose.work.yml up -d --build
#
# Three containers and a timer. probe-watch reads chat on a schedule and posts
# one signal per finding; the pipe routes each on its own level and kind;
# probe-plan answers the ones that are work. Both watchers use the same poster
# (scripts/post_watch_signal.py, mounted read-only) so the container and a laptop
# send byte-identical signatures through one piece of code.
#
# The timer is NOT here, on purpose: hookprobe/examples/patrols/patrol.sh reads
# the brief from a file at send time, so the round's instructions are editable
# without a restart or a rebuild. See work.yaml's `watch-due` door.
#
# probe-watch ran as a desktop agent before this and the move is not only
# tidiness: it read colleagues' messages — attacker-influenced text, by the
# family's own name for it — with no bash guard, no MCP tool allowlist and no
# budget ceiling. In here it has all three. What it also has, and what no
# boundary in this file removes, is the watch door's signing key: see
# .agents/notes and docs/containment.md for what that means.
#
# Separate from the shadow deployment in every way that can collide: its own
# project name, its own bind-mounted data root (../work-data), its own config
# directory. The two are only alike in binding to 127.0.0.1 — a laptop that
# travels must not carry an open door with it.

name: hookstack-work

services:
  hookrelay:
    build: ../hookrelay
    image: hookrelay:work
    container_name: work-hookrelay
    restart: unless-stopped
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      HOOKRELAY_HOST: 0.0.0.0
      HOOKRELAY_PORT: 8100
      HOOKRELAY_DB: /data/hookrelay.db
      HOOKRELAY_CONFIG: /etc/hookrelay/work.yaml
      HOOKRELAY_WORKER_INTERVAL: "0.5"
      # work.yaml's ${...} refs are expanded by hookrelay from its OWN
      # environment, not by compose — every name used there has to be passed
      # through here or it silently resolves to empty. An empty URL crashes at
      # boot (loud); an empty SECRET just opens the door (quiet), which is why
      # the two that must never be empty use `:?` and fail the `up` instead.
      WATCH_INGEST_SECRET: ${WATCH_INGEST_SECRET:?set WATCH_INGEST_SECRET in .env}
      LARK_WATCH_WEBHOOK: ${LARK_WATCH_WEBHOOK:?set LARK_WATCH_WEBHOOK in .env}
      LARK_PLAN_WEBHOOK: ${LARK_PLAN_WEBHOOK:?set LARK_PLAN_WEBHOOK in .env}
      # Optional: only if the bot has signature verification switched on in
      # Lark. The webhook URL is the credential either way.
      LARK_WATCH_SECRET: ${LARK_WATCH_SECRET:-}
      LARK_PLAN_SECRET: ${LARK_PLAN_SECRET:-}
      # Signs the pipe's delivery to probe-plan's escalation door. Empty leaves
      # that hop unsigned, which is survivable on a private compose network and
      # is still worth setting: it is one line and it is the only thing standing
      # between a local process and a paid investigation.
      PLAN_EVENT_SECRET: ${PLAN_EVENT_SECRET:-}
      # Verifies probe-plan's report on the way back in. `:?` rather than `:-`
      # because this pipe is on a laptop: an empty value here would let any
      # local process post a fabricated plan card into the operator's chat, and
      # that failure is silent — the card just arrives, looking real.
      PLAN_RETURN_SECRET: ${PLAN_RETURN_SECRET:?set PLAN_RETURN_SECRET in .env}
      # The watcher's two, and both `:?` because forgetting them is not a loud
      # failure — it is the exact one the paragraph above describes, and it
      # happened here on the first round: the pair resolved to empty, so the
      # trigger door silently stopped checking signatures (accepting my signed
      # post for the wrong reason) while the delivery to probe-watch went out
      # UNSIGNED and was refused 401 five times. Nothing said either thing; the
      # only symptom was a watcher that never ran.
      WATCH_DUE_SECRET: ${WATCH_DUE_SECRET:?set WATCH_DUE_SECRET in .env}
      WATCH_EVENT_SECRET: ${WATCH_EVENT_SECRET:?set WATCH_EVENT_SECRET in .env}
      # Guards /status, /live and /topology. Empty read token means the ledger
      # answers anyone who can reach the port; empty ADMIN token fails CLOSED,
      # so the admin surface simply does not work until it is set.
      HOOKRELAY_READ_TOKEN: ${WORK_READ_TOKEN:-}
      HOOKRELAY_ADMIN_TOKEN: ${WORK_ADMIN_TOKEN:-}
    volumes:
      # The DIRECTORY, not the file: a single-file bind mount binds an inode,
      # and `git pull` replaces the file rather than writing through it — the
      # container then serves the config from before the pull while looking
      # completely healthy. That cost the shadow two debugging rounds in a day.
      - ./:/etc/hookrelay/:ro
      - ../work-data/hookrelay:/data
    ports:
      - "127.0.0.1:8100:8100"

  # The planner. Same image and same doors as the family's investigator; what
  # makes it "plan" rather than "diagnose" is the `kind: task` its signals
  # carry, which selects the how-would-this-be-done prompt at the door.
  probe-plan:
    build:
      context: ../hookprobe
      args:
        # A build arg rather than a Dockerfile edit, because the Dockerfile says
        # so: a deployment that tracks this repository with `git pull --ff-only`
        # cannot carry a modified one. It also keeps these out of the production
        # investigator's image, which has no use for either.
        #
        # git — read a mounted checkout's history, so "how would this be done"
        # can cite when something last changed rather than only that it exists.
        # `git push` is already denied by the bash guard.
        #
        # awscli — Debian trixie's package is v2 (2.23.6 as built on
        # 2026-09-04), so this needs no architecture-specific installer. The bash
        # guard gained an `aws` rule in the same commit that added this: adding
        # the CLI without it would have quietly weakened the property the
        # Dockerfile states two paragraphs down — that the guard blocks mutating
        # verbs on top of whatever the mounted credential allows.
        APT_EXTRAS: ${PROBE_PLAN_APT_EXTRAS:-git awscli}
    image: hookprobe:work
    container_name: work-probe-plan
    restart: unless-stopped
    mem_limit: 2g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # NO env_file, deliberately — the same rule the production investigator
    # learned: injecting the whole .env put every Lark webhook and every ingest
    # secret one `printenv` away from an agent that runs arbitrary bash. The
    # block below names only what this service reads.
    environment:
      HOOKPROBE_TOKEN: ${HOOKPROBE_TOKEN:?set HOOKPROBE_TOKEN in .env}
      HOOKPROBE_MODEL: ${HOOKPROBE_MODEL:-claude-opus-5}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      # Verifies what the pipe delivers to /hooks/event — the other half of
      # work.yaml's PLAN_EVENT_SECRET, and the same value.
      HOOKPROBE_EVENT_SECRET: ${PLAN_EVENT_SECRET:-}
      # Where the finished plan goes back in. This is the second `hookrelay` in
      # the operator's diagram; without it a report reaches a JSON file on the
      # volume and stops, which is exactly how the shadow's patrol reports were
      # silently going nowhere for a while.
      HOOKPROBE_RETURN_URL: http://hookrelay:8100/hook/plan-notify
      # Signs that report. Same value as the pipe's PLAN_RETURN_SECRET, by the
      # same name, rather than a second variable somebody has to keep equal to
      # it — two names for one value fails as a 401 nobody connects back to the
      # .env line.
      HOOKPROBE_RETURN_SECRET: ${PLAN_RETURN_SECRET:?set PLAN_RETURN_SECRET in .env}
      # The one content judgement the investigator makes. The watcher's
      # vocabulary is high/low, so `high` is what funds a run and every `low`
      # signal reaches Lark without buying anything; `critical` is included as a
      # superset in case a signal ever arrives with it.
      HOOKPROBE_ESCALATE_LEVELS: ${HOOKPROBE_ESCALATE_LEVELS:-critical,high}
      # A ceiling matters MORE here than in production: this runs unattended on
      # a laptop, funded by an agent that decides for itself what is worth
      # reporting. Window spend >= budget refuses new escalations and each
      # refusal reports itself, so the failure is visible rather than silent.
      HOOKPROBE_BUDGET_USD: ${HOOKPROBE_BUDGET_USD:-10}
      HOOKPROBE_BUDGET_WINDOW_HOURS: ${HOOKPROBE_BUDGET_WINDOW_HOURS:-24}
      HOOKPROBE_RETENTION_DAYS: ${HOOKPROBE_RETENTION_DAYS:-}
      # Operator methodology appended to the system prompt, re-read every run —
      # edit it and the next run uses it, no restart. That file is how this
      # instance becomes a PLANNER with opinions rather than a generic
      # investigator. Unset falls back to {workdir}/system-prompt.md, which is
      # the volume below, which is `work-data/probe-plan/system-prompt.md` FROM
      # THE REPOSITORY ROOT — every `../` in this file resolves against deploy/,
      # not against wherever you are standing. Writing it one directory too high
      # produces a file nothing reads and no error anywhere.
      HOOKPROBE_SYSTEM_PROMPT_APPEND: ${HOOKPROBE_SYSTEM_PROMPT_APPEND:-}
      HOOKPROBE_SETTING_SOURCES: ${HOOKPROBE_SETTING_SOURCES:-}
      HOOKPROBE_SKILLS: ${HOOKPROBE_SKILLS:-}
      # Lives inside the volume above, so it is hot-editable like the system
      # prompt and needs no mount of its own. Servers reachable from a container
      # only: an http:// server on the host is `host.docker.internal`, never
      # 127.0.0.1, and a stdio server cannot be reached from here at all.
      HOOKPROBE_MCP_CONFIG: ${HOOKPROBE_MCP_CONFIG:-/data/mcp.json}
      # The closed set of MCP tools this planner may call. EMPTY DENIES ALL —
      # mounting a server is plumbing, naming its tools is policy, and only the
      # second one decides what a colleague's chat message can ask this agent to
      # do on your behalf. Enforced by a PreToolUse hook, not by allowed_tools.
      HOOKPROBE_MCP_TOOLS: ${HOOKPROBE_MCP_TOOLS:-}
      HOOKPROBE_HOST: 0.0.0.0
      HOOKPROBE_PORT: 8088
      HOOKPROBE_WORKDIR: /data
      # Where the AWS CLI looks, pointed at the read-only mount instead of
      # $HOME/.aws. Set once — this says where credentials LIVE, it is not a
      # line per credential, so the drop-a-file convention still holds. The
      # profile is named here too so a plan cannot reach for a different one by
      # forgetting `--profile`; there is only ever one in that file anyway.
      AWS_SHARED_CREDENTIALS_FILE: /data/secrets/aws/credentials
      AWS_CONFIG_FILE: /data/secrets/aws/config
      AWS_PROFILE: ${PROBE_PLAN_AWS_PROFILE:-}
    volumes:
      - ../work-data/probe-plan:/data
      # ── the two conventions that keep this file from growing a line per
      # credential ────────────────────────────────────────────────────────
      #
      # /data/secrets — drop a file in, it is there next run. READ-ONLY, and a
      # CURATED directory rather than a bind of ~/.aws or ~/.atlassian.env
      # directly: those hold whatever profile you happen to have, including the
      # ones that can write. Copy in only the query-grade identity, and put what
      # it is and what it may do in the planner's CLAUDE.md — the agent reads
      # that as memory, so the manifest and the mount stay one thought.
      #
      # This agent reads text other people wrote. Everything under here is
      # reachable by anything anyone types in a watched chat.
      - ${PROBE_PLAN_SECRETS:-../work-data/probe-plan-secrets}:/data/secrets:ro
      #
      # /data/code — the repositories a plan is usually ABOUT. Read-only and
      # credential-free, which is why it is the cheapest useful thing to give a
      # planner: "how would this be done" answered against the actual tree
      # beats the same question answered from a title. Point it at a parent
      # directory of your checkouts; inert until you do.
      - ${PROBE_PLAN_CODE:-../work-data/probe-plan-code}:/data/code:ro
    ports:
      # The sessions page, for watching a plan being written. Loopback only.
      - "127.0.0.1:8088:8088"

  # The watcher. Same image, same doors, a different job — which is the claim
  # the PRD makes about this family and this is the second instance proving it:
  # N roles cost N env blocks and N volumes, not N services.
  #
  # What makes it a WATCHER rather than an investigator is three things, none of
  # them code: the brief patrol.sh posts, the read-only chat tools it is allowed
  # to call, and the absence of a return URL.
  probe-watch:
    build:
      context: ../hookprobe
      args:
        APT_EXTRAS: ${PROBE_PLAN_APT_EXTRAS:-git awscli}
    image: hookprobe:work
    container_name: work-probe-watch
    restart: unless-stopped
    mem_limit: 2g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      HOOKPROBE_TOKEN: ${HOOKPROBE_TOKEN:?set HOOKPROBE_TOKEN in .env}
      HOOKPROBE_MODEL: ${HOOKPROBE_MODEL:-claude-opus-5}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      HOOKPROBE_EVENT_SECRET: ${WATCH_EVENT_SECRET:-}
      # NO return url, deliberately. Its product is the signals it posts during
      # the run, not a summary afterwards — see the to-watcher channel's comment
      # in work.yaml. The round's own text stays in the case file, which is what
      # the next round reads to know where a conversation had got to.
      #
      # Every round is a NEW investigation: coalescing is off because the trigger
      # carries the same source and title each time, so the default 1800s would
      # fold round two into round one's session and carry its context — and the
      # brief's whole first line is that a round is self-contained.
      HOOKPROBE_COALESCE_WINDOW_SECONDS: "0"
      HOOKPROBE_ESCALATE_LEVELS: ${WATCH_ESCALATE_LEVELS:-critical,high}
      # A GUESS until three rounds have been measured, and deliberately not the
      # planner's number: this runs ~24 times a weekday rather than on demand,
      # so the ceiling is a cadence question, not a per-run one. Read
      # `GET /v1/budget` after a day and set it from the arithmetic.
      HOOKPROBE_BUDGET_USD: ${WATCH_BUDGET_USD:-15}
      HOOKPROBE_BUDGET_WINDOW_HOURS: ${WATCH_BUDGET_WINDOW_HOURS:-24}
      HOOKPROBE_MCP_CONFIG: /data/mcp.json
      # Read-only chat tools ONLY. This instance reads colleagues' messages for
      # a living, so the list is the difference between "it can see the thread"
      # and "a message in the thread can post as the operator".
      HOOKPROBE_MCP_TOOLS: ${WATCH_MCP_TOOLS:-}
      # How the agent posts a finding: `echo '<JSON>' | python3
      # /data/bin/post_watch_signal.py`, the same script and the same exit codes
      # the laptop watcher uses. The script reads the signing secret itself, so
      # the brief never has to mention it.
      HOOKSTACK_ENV_FILE: /data/secrets/watch.env
      HOOKSTACK_WATCH_DOOR: http://hookrelay:8100/hook/watch
      # The brief's first instruction is `date`, and the window it checks is
      # the operator's, not UTC. Without this the container reads UTC and every
      # round decides it is outside working hours.
      TZ: ${WATCH_TZ:-Asia/Singapore}
      HOOKPROBE_HOST: 0.0.0.0
      HOOKPROBE_PORT: 8088
      HOOKPROBE_WORKDIR: /data
    volumes:
      - ../work-data/probe-watch:/data
      # Its own secrets, not the planner's: this one needs the watch door's
      # signing key and nothing else, and the planner needs Jira/Grafana/AWS and
      # not that key. Two directories is how "independent credentials per node"
      # stays true once there are two nodes.
      - ../work-data/probe-watch-secrets:/data/secrets:ro
      # The poster, read-only. Mounted rather than reimplemented in the brief so
      # the container and the laptop send byte-identical signatures through one
      # piece of code.
      - ../scripts:/data/bin:ro
      # The operator's own Jira watcher, read-only, ONE source of truth with the
      # laptop rather than a copy that drifts. The directory rather than the
      # file, which this repository learned the hard way elsewhere: a
      # single-file bind mount binds an inode, and most editors replace the file
      # instead of writing through it, so the container would go on running the
      # version from before the edit while looking healthy.
      #
      # Under data/, which is git-ignored — the same category as .env and the
      # secrets directories: operator content that never enters a public
      # repository but needs a stable, repo-relative path. It was briefly put in
      # deploy/ instead, which is tracked; that would have published somebody's
      # ticket tooling and their JQL along with it.
      #
      # What this does and does not buy, stated because the difference matters:
      # the absolute host path leaves .env and the file lives with the rest of
      # the deployment's private content. A fresh clone still will not have it —
      # exactly like .env — so bringing this deployment up on a second machine
      # is "clone, copy data/ and work-data/, up", not "clone and up".
      #
      # The project key and the comment handle are NOT in the script: they come
      # from /data/secrets/atlassian.env, so the file stays publishable even
      # though it is not published.
      - ../data/watch:/data/jira:ro
    ports:
      - "127.0.0.1:8089:8088"

  # The clock. A separate service from the watcher it triggers, because "the
  # timer died" and "the watcher died" want different fixes and a timer living
  # inside its own target cannot tell you which happened.
  #
  # It replaces a host crontab line that could never work: macOS keeps
  # ~/Documents behind TCC and `cron` is not allowed through, so every fire
  # logged "Operation not permitted" while the pipe had no delivery to fail, the
  # investigator sat healthy and idle, and the chat stayed quiet. A watcher that
  # was never triggered looks exactly like a quiet afternoon. Shipping the clock
  # with the deployment removes the whole class: the container carries its own
  # filesystem, and `up -d` starts the timer with the thing it triggers.
  #
  # Reuses hookprobe:work rather than adding an image — it already carries bash,
  # curl and python3, which is the whole dependency list.
  watch-timer:
    image: hookprobe:work
    container_name: work-watch-timer
    restart: unless-stopped
    depends_on: [hookrelay]
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/bash", "/patrols/patrol-timer.sh", "/brief/brief.md", "工作信号盯守"]
    # The image's own check probes hookprobe's port, and this service overrides
    # the entrypoint so nothing listens there — it reported `unhealthy` while
    # firing correctly. A container that is wrong about its own health is worse
    # than one with no check: it teaches whoever reads `docker ps` to skip the
    # column. This one's liveness is its log, one line per tick.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f patrol-timer.sh >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
    environment:
      PATROL_TARGET: relay
      HOOKRELAY_URL: http://hookrelay:8100
      HOOKRELAY_SOURCE: watch-due
      HOOKRELAY_INBOUND_SECRET: ${WATCH_DUE_SECRET:?set WATCH_DUE_SECRET in .env}
      PATROL_STATE: alerting
      PATROL_ENV: work
      # The watch-due door is configured with fields.kind: brief, whose body cap
      # is 16000 rather than an alert's 4000. patrol.sh cannot see the door's
      # kind, so it has to be told; raising it here and not there would let the
      # door truncate silently, which is what its own check exists to prevent.
      PATROL_BODY_MAX: "16000"
      PATROL_EVERY_MINUTES: ${WATCH_EVERY_MINUTES:-20}
      # An economy, not the authority: the brief runs `date` first and answers
      # [SILENT] outside Mon-Fri 09:30-19:30 regardless. Keep this WIDER than
      # the brief's window, never narrower, or the gate moves somewhere nobody
      # reading the brief would think to look.
      PATROL_HOURS: ${WATCH_HOURS:-9-19}
      PATROL_DAYS: ${WATCH_DAYS:-1-5}
      TZ: ${WATCH_TZ:-Asia/Singapore}
    volumes:
      - ../hookprobe/examples/patrols:/patrols:ro
      # The brief, read-only and deliberately NOT inside probe-watch's own
      # volume: a brief the agent could edit is the agent rewriting its own next
      # instructions, which is the persistence vector hookprobe.inputs exists to
      # refuse for CLAUDE.md and skills. The timer reads it; the watcher only
      # ever sees it as an event body.
      - ../work-data/watch-brief:/brief:ro

  # Opt-in, and worth opting into ONCE before the real webhooks go in:
  #
  #   LARK_WATCH_WEBHOOK=http://sink:9000/lark-watch \
  #   LARK_PLAN_WEBHOOK=http://sink:9000/lark-plan \
  #   docker compose -p hookstack-work --env-file .env \
  #     -f deploy/docker-compose.work.yml --profile smoke up -d --build
  #   docker compose -p hookstack-work logs -f sink
  #
  # It prints every card it is handed, laid out. Proving the wiring against a
  # sink costs nothing and cannot post anything into a real chat — and the two
  # failures this deployment is most likely to have (a signal that reaches no
  # channel, a plan that reaches a JSON file on the volume and stops) are both
  # visible here as an absence.
  sink:
    profiles: [smoke]
    image: python:3.14-slim
    container_name: work-sink
    command: ["python", "-u", "/examples/sink.py"]
    volumes:
      - ../hookrelay/examples:/examples:ro
    restart: unless-stopped

# Explicit rather than inherited: the two services find each other by service
# name on this network, which is what work.yaml's http://probe-plan:8088 and
# this file's http://hookrelay:8100 both depend on.
networks:
  default:
    name: work_net
