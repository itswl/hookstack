# Shadow deployment: the pipe and the judge on real production traffic,
# with zero production responsibility. See deploy/shadow.yaml for what that
# means and what is deliberately absent.
#
#   cd /srv/hookstack
#   docker compose --env-file .env -f deploy/docker-compose.shadow.yml up -d --build
#
# .env needs:
#   WW_RELAY_SECRET        — mirror of the platform's FORWARD_RELAY_SECRET
#   SHADOW_INGEST_SECRET   — pipe→judge hop signing (openssl rand -hex 24)
#   ANTHROPIC_AUTH_TOKEN   — already present for the investigator; the judge
#                            reuses the same DeepSeek key on the OpenAI dialect
#
# Ports bind to loopback only: the boards are for an ssh tunnel, the doors are
# for the docker network.

name: hookstack-shadow

services:
  hookrelay:
    build: ../hookrelay
    image: hookrelay:shadow
    container_name: hookrelay
    restart: unless-stopped
    # 12 GB box, no swap, one cgroup OOM on record (2026-08-24). These services
    # idle near 50-90 MB; 256 MB is ~4x headroom and bounds a runaway's blast
    # radius so it cannot take the host (and its neighbours) with it. Only
    # hookprobe was capped before.
    mem_limit: 256m
    # An HTTP server needs no Linux capability and no privilege escalation;
    # drop both. It runs as non-root (uid 10001) from the image — see the
    # Dockerfile and the shadow-data chown note on the bind mount below.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      HOOKRELAY_HOST: 0.0.0.0
      HOOKRELAY_PORT: 8100
      HOOKRELAY_DB: /data/hookrelay.db
      HOOKRELAY_CONFIG: /etc/hookrelay/config.yaml
      HOOKRELAY_WORKER_INTERVAL: "0.5"
      WW_RELAY_SECRET: ${WW_RELAY_SECRET:?mirror FORWARD_RELAY_SECRET into .env}
      SHADOW_INGEST_SECRET: ${SHADOW_INGEST_SECRET:?set SHADOW_INGEST_SECRET in .env}
      # Read by shadow.yaml's to-probe-action channel, so the pipe can sign a
      # card press for the investigator's door. Empty means that channel is
      # unsigned, which the config guard refuses — so the button is simply
      # not configured until this is set.
      HOOKPROBE_EVENT_SECRET: ${HOOKPROBE_EVENT_SECRET:-}
      # Signs the token inside a card button. Without it the buttons render
      # and do nothing — `_mint_card_actions` returns early and every button
      # ships with an empty value. That was the state of this deployment for
      # a day while `ruled: 0` was being read as "nobody answers".
      HOOKRELAY_ACTION_SECRET: ${SHADOW_ACTION_SECRET:-}
      # Guards /status and /live. Empty means the guard passes and the whole
      # ledger — every alert title this deployment has seen — answers anyone
      # who can reach the port. That was survivable while the port was bound
      # to 127.0.0.1 and nothing else; it stops being survivable the moment a
      # reverse proxy is put in front, which is why it is set now.
      HOOKRELAY_READ_TOKEN: ${SHADOW_READ_TOKEN:-}
      # Guards PUT /config, the silence valve and the dead-letter retry.
      # Unlike the read token, an empty value here FAILS CLOSED — token_ok
      # returns False when nothing is configured, so the endpoints refuse
      # everyone rather than admitting anyone. That is why this was missing for
      # weeks without being a hole: the admin surface simply did not work.
      HOOKRELAY_ADMIN_TOKEN: ${SHADOW_ADMIN_TOKEN:-}
    volumes:
      - ./shadow.yaml:/etc/hookrelay/config.yaml:ro
      # Bind mounts at the deployment root, like the investigator's: state in
      # plain sight for the backup script, not inside a named volume. The
      # services now run non-root (uid 10001), and a bind mount keeps host
      # ownership, so these dirs must be owned by 10001:
      #   sudo chown -R 10001:10001 ../shadow-data/{hookrelay,hookjudge,hookjudge-b}
      - ../shadow-data/hookrelay:/data
    ports:
      - "127.0.0.1:8100:8100"

  hookjudge:
    build: ../hookjudge
    image: hookjudge:shadow
    container_name: hookjudge
    restart: unless-stopped
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      HOOKJUDGE_HOST: 0.0.0.0
      HOOKJUDGE_PORT: 8200
      HOOKJUDGE_DB: /data/hookjudge.db
      HOOKJUDGE_INGEST_SECRET: ${SHADOW_INGEST_SECRET:?set SHADOW_INGEST_SECRET in .env}
      # A DIFFERENT secret from the one above on purpose: that one also opens
      # /events, so anything able to sign for it can forge judgements. This
      # signs for /rulings/ai only, and its holder is the investigator.
      # Unset means the ruling door stays shut, which is the safe default.
      HOOKJUDGE_RULING_SECRET: ${SHADOW_RULING_SECRET:-}
      # Brain A returns; brain B stays ledger-only. The asymmetry is the point:
      # a verdict has to reach a human for anyone to rule on it, and two brains
      # both returning would put two cards in the chat for one alert. B's
      # opinion is read from the ledger, where the agreement comparison lives.
      #
      # Empty is still a misconfiguration that alarms; "none" is the deliberate
      # opt-out that brain B keeps.
      HOOKJUDGE_RETURN_URL: ${SHADOW_RETURN_URL:-none}
      HOOKJUDGE_WORKER_INTERVAL: "0.5"
      HOOKJUDGE_REUSE_WINDOW_SECONDS: ${HOOKJUDGE_REUSE_WINDOW_SECONDS:-3600}
      # The investigator's DeepSeek key, on the OpenAI dialect this time. The
      # judge negotiates structured output per model at first use (json_schema
      # is 400 on this endpoint; tools-with-auto works — measured 2026-08-15).
      HOOKJUDGE_AI_BASE_URL: ${HOOKJUDGE_AI_BASE_URL:-https://api.deepseek.com/v1}
      HOOKJUDGE_AI_API_KEY: ${HOOKJUDGE_AI_API_KEY:-${ANTHROPIC_AUTH_TOKEN:-}}
      HOOKJUDGE_AI_MODEL: ${HOOKJUDGE_AI_MODEL:-deepseek-chat}
      # deepseek-chat list price as of the v3.2 cut (USD per 1k tokens); the
      # ledger prices verdicts with these, so re-check on a model change.
      HOOKJUDGE_AI_PRICE_IN_PER_1K: ${HOOKJUDGE_AI_PRICE_IN_PER_1K:-0.00028}
      HOOKJUDGE_AI_PRICE_OUT_PER_1K: ${HOOKJUDGE_AI_PRICE_OUT_PER_1K:-0.00042}
      HOOKJUDGE_READ_TOKEN: ${SHADOW_READ_TOKEN:-}
    volumes:
      - ../shadow-data/hookjudge:/data
    ports:
      - "127.0.0.1:8200:8200"

  # The second brain. Same traffic, a different model, its own ledger — the
  # pipe's fan-out exists exactly so two judges can be compared on the same
  # events. Rows where judge-a, judge-b and the platform disagree three ways
  # are the most label-worthy alerts in the building.
  hookjudge-b:
    build: ../hookjudge
    image: hookjudge:shadow
    container_name: hookjudge-b
    restart: unless-stopped
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      HOOKJUDGE_HOST: 0.0.0.0
      HOOKJUDGE_PORT: 8200
      HOOKJUDGE_DB: /data/hookjudge.db
      HOOKJUDGE_INGEST_SECRET: ${SHADOW_INGEST_SECRET:?set SHADOW_INGEST_SECRET in .env}
      # A DIFFERENT secret from the one above on purpose: that one also opens
      # /events, so anything able to sign for it can forge judgements. This
      # signs for /rulings/ai only, and its holder is the investigator.
      # Unset means the ruling door stays shut, which is the safe default.
      HOOKJUDGE_RULING_SECRET: ${SHADOW_RULING_SECRET:-}
      HOOKJUDGE_RETURN_URL: "none"
      HOOKJUDGE_WORKER_INTERVAL: "0.5"
      HOOKJUDGE_REUSE_WINDOW_SECONDS: ${HOOKJUDGE_REUSE_WINDOW_SECONDS:-3600}
      HOOKJUDGE_AI_BASE_URL: ${HOOKJUDGE_B_AI_BASE_URL:-https://api.deepseek.com/v1}
      # Its own key, falling back to A's. Every other B-side knob is
      # independently settable, and the key was not — so pointing brain B at a
      # second provider meant editing HOOKJUDGE_AI_API_KEY, which is brain A's
      # key too, and the comparison quietly became one model against itself. The
      # fallback keeps the common case (same provider, two models) a one-line
      # .env, while HOOKJUDGE_B_AI_API_KEY is all it takes to cross providers.
      HOOKJUDGE_AI_API_KEY: ${HOOKJUDGE_B_AI_API_KEY:-${HOOKJUDGE_AI_API_KEY:-${ANTHROPIC_AUTH_TOKEN:-}}}
      HOOKJUDGE_AI_MODEL: ${HOOKJUDGE_B_AI_MODEL:-deepseek-reasoner}
      # Reasoner list price (USD per 1k) as of the v3.2 cut; re-check on change.
      HOOKJUDGE_AI_PRICE_IN_PER_1K: ${HOOKJUDGE_B_AI_PRICE_IN_PER_1K:-0.00028}
      HOOKJUDGE_AI_PRICE_OUT_PER_1K: ${HOOKJUDGE_B_AI_PRICE_OUT_PER_1K:-0.00042}
      HOOKJUDGE_READ_TOKEN: ${SHADOW_READ_TOKEN:-}
    volumes:
      - ../shadow-data/hookjudge-b:/data
    ports:
      - "127.0.0.1:8201:8200"


  # The Lark adapter, deliberately outside the pipe. Two directions:
  #   out  the pipe's `feishu` channel POSTs a rendered card here, and this
  #        sends it through the Lark API as the APPLICATION. A custom-bot
  #        webhook can only send, so buttons on its cards have nowhere to call
  #        back to — and every feedback number the family grew this week needs
  #        a press to be receivable.
  #   in   card.action.trigger arrives over a LONG CONNECTION (the bridge dials
  #        out), so a press needs no public route in. hookrelay's public front
  #        door was rolled back on 2026-08-07 and this does not reopen it.
  lark-bridge:
    build: ./lark-bridge
    image: lark-bridge:shadow
    container_name: lark-bridge
    restart: unless-stopped
    mem_limit: 256m
    environment:
      LARK_APP_ID: ${LARK_APP_ID:?set LARK_APP_ID in .env}
      LARK_APP_SECRET: ${LARK_APP_SECRET:?set LARK_APP_SECRET in .env}
      LARK_BRAND: ${LARK_BRAND:-lark}
      # The private chat the cards land in. One member, so this is a push to a
      # person and not a group notification.
      LARK_CHAT_ID: ${LARK_CHAT_ID:?set LARK_CHAT_ID in .env}
      RELAY_ACTION_URL: http://hookrelay:8100/card-action
    volumes:
      # lark-cli's credential file and event cursor. A named volume rather than
      # a bind: nothing in here is worth reading from the host, and the
      # credential is written from the environment at every start.
      - lark-bridge-config:/config
    # No published port. Only the pipe beside it on hookstack_net can reach it.
    depends_on:
      - hookrelay

volumes:
  lark-bridge-config:

networks:
  default:
    # Owned by the platform's app compose; the same wire the investigator and
    # the platform's forwarder already share.
    name: hookstack_net
    external: true
