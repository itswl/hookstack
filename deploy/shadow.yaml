# The pipe's config for the SHADOW deployment (deploy/docker-compose.shadow.yml).
#
# Shadow means: real production traffic, zero production responsibility. The
# platform (WebhookWise) forwards every alert it has already analyzed through
# its feishu_relay channel — the PROCESSED-EVENT dialect, HMAC-timestamped —
# and this pipe hands it to the judge, whose verdict lands in the ledger and
# goes NOWHERE else.
#
# What that buys, before anyone trusts the family with a real delivery:
#   - the adapters and the door run against real traffic shapes, not fixtures;
#   - every event arrives with the platform's own verdict in it
#     (meta.importance), so the ledger accumulates judge-vs-platform
#     disagreements — labelled comparison data, at production rates, for free;
#   - reuse/recovery routes are exercised by real storms, not synthetic ones.
#
# What is deliberately ABSENT:
#   - notification channels: a shadow that can page somebody is not a shadow;
#   - probe escalation: the investigator already serves the platform's own
#     deep-analysis leg, and a second door onto the same runs would double the
#     model bill for no new information;
#   - a judge return door: HOOKJUDGE_RETURN_URL is empty, so the verdict stops
#     in the judge's ledger instead of coming back as an event this config
#     would then have to route into silence.
#
# Caveat, stated where the data will be read: the judge sees the platform's
# {alert title + AI summary}, not the raw webhook — the platform's feishu_relay
# envelope carries the RESULT by design. Agreements are cheap confirmation;
# disagreements are the interesting rows and need the case pulled up before
# anyone calls either side wrong.

sources:
  # WebhookWise's feishu_relay channel, mode `processed`. The signature is the
  # timestamped form ("{ts}.{body}", X-Hook-Timestamp beside it) with the
  # platform's FORWARD_RELAY_SECRET — mirrored into .env as WW_RELAY_SECRET.
  - name: ww
    secret: ${WW_RELAY_SECRET}
    title: "{meta.alert_name}"
    body: "{analysis.summary}"
    level: "{meta.importance}"
    # The platform states the fact; top-level flag, never a field (identity).
    recovery: "{meta.is_recovery}"
    # Fields feed the judge's IDENTITY. Anything that differs between a
    # firing and its recovery (a recovery flag, an event_type that flips to
    # 恢复, the reminder bit) would split the pair into two identities and the
    # recovery route could never find its firing — the exact defect the
    # judge's contract documents. The platform's forward-rule name is a
    # constant and says nothing. One stable attribute stays.
    fields:
      origin: "{meta.source}"
      # Non-identity by the judge contract: three-way comparison data
      # (platform importance / platform triage / judge importance).
      triage_verdict: "{analysis.triage_verdict}"
      triage_confidence: "{analysis.triage_confidence}"

  # The attention watcher's signals — work chat / tickets that need the operator,
  # already judged by the watcher itself. It arrives from OUTSIDE this compose
  # (a laptop cron reaching the server), which is exactly the day the comment
  # below says a door should stop being unsigned, so this one is signed.
  #
  # Deliberately NOT fed to the brains: the judges are calibrated on alerts
  # (severity keywords, recovery semantics, flap suppression) and would re-judge
  # a colleague's question with vocabulary that means nothing here. The watcher's
  # own verdict is final; the pipe is transport and ledger for it, not a second
  # opinion. Its route is terminal for the same reason verdict-to-me is.
  - name: watch
    secret: ${WATCH_INGEST_SECRET}
    title: "{signal.title}"
    body: "{signal.detail}"
    level: "{signal.level}"
    fields:
      origin: "{signal.origin}"

  # Brain A's verdict, coming back to be dressed as a card. Unsigned: it is a
  # loopback hop inside hookstack_net between two containers of one deployment,
  # and the platform's own door above is the one that faces outward. Give it a
  # secret the day this deployment stops being a single compose file.
  - name: judge-notify
    secret: ""
    title: "{meta.alert_name}"
    body: "{analysis.summary}"
    level: "{meta.importance}"
    recovery: "{meta.is_recovery}"
    fields:
      origin: "{meta.source}"
      # The judge's second axis: does a person need to ACT on this now.
      # "yes" / "no" / "" when the model did not answer. Extracted so the
      # quiet-wake-no stage below can route on it — the answer was paid for,
      # and until this line nothing used it.
      wake: "{meta.wake_someone}"

  # The investigator's report, coming back to be dressed as a card. Unsigned for
  # the same reason as the door above: a loopback hop inside hookstack_net.
  #
  # HOOKPROBE_RETURN_URL has always pointed here and this door has never existed,
  # so the POST 404'd — invisible, because the platform POLLS /final for the
  # investigations it starts and never needed the return. A patrol has nobody
  # polling it, so its report reached a JSON file on the volume and stopped.
  - name: probe-notify
    secret: ""
    title: "{meta.alert_name}"
    body: "{report.summary}"
    level: "{meta.importance}"
    fields:
      origin: "{meta.source}"
      session: "{meta.session_key}"

channels:
  - name: to-judge
    type: generic
    url: http://hookjudge:8200/events
    secret: ${SHADOW_INGEST_SECRET}
    options: {payload: normalized}

  - name: to-judge-b
    type: generic
    url: http://hookjudge-b:8200/events
    secret: ${SHADOW_INGEST_SECRET}
    options: {payload: normalized}

  - name: to-judge-c
    type: generic
    url: http://hookjudge-c:8200/events
    secret: ${SHADOW_INGEST_SECRET}
    options: {payload: normalized}

  # Where a card press bound for the investigator lands. `payload: raw` for the
  # same reason as the judge's feedback channel below: the action envelope IS the
  # content.
  #
  # This is a channel pointing AT the investigator, which the header of this file
  # lists as deliberately absent. That exclusion is about escalation — feeding it
  # alerts, which would double the model bill for no new information. A callback
  # for a report the investigator itself sent is the opposite direction and buys
  # something the exclusion was never protecting: the only path by which a line
  # the shape check refused can ever be adopted.
  # The investigator's ESCALATION door (not the button door below). Every watch
  # signal is handed over and the probe decides by level whether it is worth a
  # paid investigation — settings.py states that division: escalate_levels is
  # the investigator's judgement to make, and the pipe stays content-blind.
  - name: to-probe
    type: generic
    url: http://hookprobe:8088/hooks/event
    secret: ${HOOKPROBE_EVENT_SECRET}
    options: {payload: normalized}

  - name: to-probe-action
    type: generic
    url: http://hookprobe:8088/hooks/action
    # The investigator's OWN event secret by name, not a second variable that
    # has to be kept equal to it. Two names for one value is a footgun that
    # fails as a 401 nobody connects back to the .env line.
    secret: ${HOOKPROBE_EVENT_SECRET}
    options: {payload: raw}

  # Where a ruling lands. `payload: raw` because the action envelope IS the
  # content — the pipe recorded the press as an event carrying it, and the brain
  # wants those bytes rather than a normalized alert built around them.
  - name: to-judge-feedback
    type: generic
    url: http://hookjudge:8200/feedback
    secret: ${SHADOW_INGEST_SECRET}
    options: {payload: raw}

  # Rendered by the pipe's own feishu builder and handed to the bridge, which
  # re-sends it as the application so its buttons can be pressed.
  # The watcher's own bot, posted to DIRECTLY — no bridge hop. The bridge exists
  # so cards can carry callback buttons (a press has to reach hookrelay), and a
  # work signal has nothing to press: it is read and acted on outside this
  # system. One less hop, and the watcher's signals land in their own chat
  # instead of the alert card's.
  #
  # No secret: this bot has signature verification off (verified by an unsigned
  # POST succeeding on 2026-09-03). Turn it on in Lark and set the value here —
  # build_feishu adds {timestamp, sign} the moment a secret exists.
  #
  # Default options (payload: normalized) on purpose: the watcher sends a
  # normalized event, not a judged RESULT, so the card is built from
  # title/body/level/fields rather than a processed envelope.
  - name: to-me-watch
    type: feishu
    url: ${WATCH_FEISHU_WEBHOOK}
    # Explicitly empty, not omitted: this bot has signature verification OFF
    # (an unsigned POST to it succeeded on 2026-09-03). The URL is the whole
    # credential, which is why it lives in .env and never in this file.
    secret: ""

  - name: to-me
    type: feishu
    # Signs the card handed to the bridge. This hop shares a network with the
    # platform's containers, so an unsigned door let any neighbour post a card
    # into the operator's chat as the app. With a secret set, the feishu builder
    # adds {timestamp, sign} and the bridge (BRIDGE_INBOUND_SECRET, same value)
    # refuses anything that cannot prove it. Empty (default) keeps the old
    # unsigned behaviour, and the bridge accepts it — so this is off until the
    # .env line is set on both sides.
    secret: ${LARK_BRIDGE_SECRET}
    url: http://lark-bridge:9100/
    options: {payload: processed}

routes:
  # Both brains, every event: the fan-out IS the experiment. Their ledgers
  # disagree with each other and with the platform independently.
  # A verdict coming back goes to the card and STOPS. Without stop: true it
  # would fall through to shadow-to-judges and be judged again — the pipe
  # feeding a brain its own output, which is the loop the family's docs warn
  # about and the reason returns take a higher-priority terminal route.
  - name: verdict-to-me
    source: judge-notify
    send_to: [to-me]
    priority: 100
    stop: true

  # Same shape and the same reason as verdict-to-me: a report that fell through
  # to shadow-to-judges would be handed to a brain as though it were an alert.
  - name: report-to-me
    source: probe-notify
    send_to: [to-me]
    priority: 100
    stop: true

  # The bypass. Same shape and the same reason as verdict-to-me: without a
  # higher-priority terminal route this would fall through to shadow-to-judges
  # and be handed to three brains that have nothing useful to say about it.
  - name: watch-to-me
    source: watch
    send_to: [to-me-watch, to-probe]
    priority: 100
    stop: true

  - name: shadow-to-judges
    source: ww
    send_to: [to-judge, to-judge-b, to-judge-c]
    priority: 0

# The judge does the noise accounting (reuse/recovery are the point of the
# shadow), so the pipe's own dedup stays off — same posture as the family
# stack, for the same reason: two counters and neither ledger true.
# `filter` before the rest: a verdict the judge marked "nobody needs to act on
# this now" is dropped HERE, by name, with skip_code wake_no on the event's own
# trace — not deleted: the judge's board keeps every row, this only stops the
# card. Measured the week this was added: 440 interruptions, 95% repeats, and
# the two loudest rules answered wake=no every time they were asked.
#
# '' (unanswered) deliberately does not match: only an explicit "no" quiets.
# A parse failure or a pre-wake row fails open into a card, never into silence.
# Recoveries ride along by inheritance: a resolution card for a firing nobody
# was interrupted for would be the same interruption one step later.
pipeline:
  - name: quiet-wake-no
    type: filter
    when: {source: "judge-notify", wake: "no"}
    skip_code: wake_no
  - silence
  - routes

# The buttons a card carries. hookjudge DECLARES which ones a verdict deserves
# (silence plus the useful/useless pair); this decides which the deployment
# actually offers and where a press goes.
#
# `useful`/`useless` are the whole reason the shadow exists: it can already say
# the two brains agreed 84% of the time, and cannot say which one was RIGHT.
# A press is that missing datum, and it lands in the judge's own ledger where
# /labels/export can turn it into an eval row.
#
# `silence` is offered but points at nothing here on purpose — the pipe owns
# silences and a press would quiet the SHADOW's copy of an alert, not the
# platform's notification. Muting a shadow is muting the observer, and that is
# not something to make one click away.
card_actions:
  useful:
    forward_to: to-judge-feedback
  useless:
    forward_to: to-judge-feedback
  # One tap to adopt a memory line the investigator proposed. Every line that
  # gets this far was REFUSED by the shape check in hookprobe.suggestions — the
  # safe ones apply themselves — so this is the button for the residue, and the
  # residue is precisely what deserves a person. What it removes is the login.
  remember:
    forward_to: to-probe-action
