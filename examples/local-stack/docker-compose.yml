# The whole family, locally: pipe + brain + a downstream you can read.
#
#   docker compose up -d --build
#
# A STUB model is wired by default so the paid routes (`ai`, and the `reuse`
# that only ever follows an ai verdict) are visible without a key or a bill.
# It is not a model: it returns canned verdicts and reports itself as
# `stub-4o-mini`. Put real credentials in .env to replace it.
#
# Both images build from local source — the GHCR image is private, so a
# published tag would just fail to pull.

name: hookstack

services:
  hookrelay:
    build: ${HOOKRELAY_PATH:-../../../hookrelay}
    container_name: hs-hookrelay
    environment:
      HOOKRELAY_HOST: 0.0.0.0
      HOOKRELAY_PORT: 8100
      HOOKRELAY_DB: /data/hookrelay.db
      HOOKRELAY_CONFIG: /etc/hookrelay/config.yaml
      HOOKRELAY_WORKER_INTERVAL: "0.5"
      HOOKRELAY_READ_TOKEN: ""
    volumes:
      - ./relay.yaml:/etc/hookrelay/config.yaml:ro
      - relay-data:/data
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      - sink

  hookjudge:
    build: ../..
    container_name: hs-hookjudge
    environment:
      HOOKJUDGE_HOST: 0.0.0.0
      HOOKJUDGE_PORT: 8200
      HOOKJUDGE_DB: /data/hookjudge.db
      HOOKJUDGE_READ_TOKEN: ""
      HOOKJUDGE_RETURN_URL: http://hookrelay:8100/hook/judge-notify
      HOOKJUDGE_WORKER_INTERVAL: "0.5"
      HOOKJUDGE_REUSE_WINDOW_SECONDS: "3600"
      # Defaults to the stub. Leaving these empty instead would send every
      # event to the rule floor, and `reuse` — which only ever follows an ai
      # verdict — would never happen, hiding half the cost policy.
      HOOKJUDGE_AI_BASE_URL: ${HOOKJUDGE_AI_BASE_URL:-http://stub-ai:8300/v1}
      HOOKJUDGE_AI_API_KEY: ${HOOKJUDGE_AI_API_KEY:-stub-key}
      HOOKJUDGE_AI_MODEL: ${HOOKJUDGE_AI_MODEL:-stub-4o-mini}
      HOOKJUDGE_AI_PRICE_IN_PER_1K: ${HOOKJUDGE_AI_PRICE_IN_PER_1K:-0.00015}
      HOOKJUDGE_AI_PRICE_OUT_PER_1K: ${HOOKJUDGE_AI_PRICE_OUT_PER_1K:-0.0006}
    volumes:
      - judge-data:/data
    ports:
      - "127.0.0.1:8200:8200"
    depends_on:
      - stub-ai

  # The last link, otherwise invisible locally: `docker compose logs -f sink`
  # shows what an operator would actually have received.
  sink:
    image: python:3.14-slim
    container_name: hs-sink
    command: ["python", "-u", "/app/sink.py"]
    volumes:
      - ./services/sink.py:/app/sink.py:ro

  # Canned verdicts over a real OpenAI-compatible endpoint, so the client, the
  # JSON-in-content convention and the token accounting are all exercised.
  # Unused the moment HOOKJUDGE_AI_BASE_URL points somewhere real.
  stub-ai:
    image: python:3.14-slim
    container_name: hs-stub-ai
    command: ["python", "-u", "/app/stub_ai.py"]
    volumes:
      - ./services/stub_ai.py:/app/stub_ai.py:ro

volumes:
  relay-data:
  judge-data:
