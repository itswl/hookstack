[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Import the package from the repo root regardless of how pytest is invoked
# (`pytest` does not put cwd on sys.path; `python -m pytest` does).
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

# One rule set across all three services, so a file reads the same wherever it
# lives: pycodestyle, pyflakes, import order, pyupgrade, bugbear, simplify.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
