# hookrelay routing configuration.
#
# Copy to config.yaml and adjust. Secrets are written as ${ENV_NAME} and
# resolve from the environment at startup — this file stays commit-safe.

sources:
  # Grafana alerting webhook. The extraction templates walk the payload with
  # dotted paths; a missing path renders as "" instead of failing the event.
  - name: grafana
    secret: ${GRAFANA_HOOK_SECRET}
    title: "{title}"
    body: "{message}"
    level: "{state}"
    level_map:
      alerting: high
      ok: info
    # Optional: a template whose truthy rendering marks the event a RECOVERY
    # (top-level is_recovery, never a field — fields build identity, and a
    # flag that flips between firing and recovery would split the pair).
    # recovery: "{meta.is_recovery}"
    fields:
      state: "{state}"
    fingerprint_fields: [title]     # repeats of the same alert dedup on title
    dedup_window_seconds: 120

  # A generic JSON producer on a trusted network — no secret, accepted
  # unsigned. Do this only when the network itself is the boundary.
  - name: ci
    secret: ""
    title: "{pipeline} · {status}"
    body: "{detail}"
    level: "{status}"
    level_map:
      failed: high
      success: info

channels:
  # People: a card MODEL to a chat bridge (docs/bridge-protocol.md), which
  # renders it for its platform and posts it — as an app (buttons that call
  # back, replies in threads) or through a custom bot's webhook. The pipe
  # itself names no platform; swapping the chat is swapping the sidecar.
  - name: ops-chat
    type: bridge
    url: http://lark-bridge:9100/
    secret: ${BRIDGE_SECRET}           # same value as the bridge's BRIDGE_INBOUND_SECRET
    max_per_minute: 20
    options: {thread_replies: true}    # a report naming fields.thread_root answers in that thread

  # Markdown webhooks are dialects, and dialects are plugins: these two types
  # come from examples/plugins/chat_markdown_channels.py, loaded from
  # HOOKRELAY_PLUGINS. Actions on them are LINKS (HOOKRELAY_PUBLIC_URL).
  - name: ops-dingtalk
    type: dingtalk
    url: ${DINGTALK_WEBHOOK_URL}
    secret: ${DINGTALK_WEBHOOK_SECRET}

  - name: ops-wecom
    type: wecom
    url: ${WECOM_WEBHOOK_URL}

  - name: archive
    type: generic
    url: ${ARCHIVE_WEBHOOK_URL}
    secret: ${ARCHIVE_OUT_SECRET}      # outbound X-Hook-Signature for the receiver

  # Transparent edge: forward the ORIGINAL payload into your platform's own
  # per-source ingest — WW unchanged, hookrelay's ledger in front.
  # - name: to-platform
  #   type: generic
  #   url: https://your-platform/v1/webhook/grafana
  #   secret: ${PLATFORM_SECRET}
  #   signature_header: X-Webhook-Signature
  #   options: {payload: raw}

  # Feed such a platform directly: same generic type, its signature dialect.
  # - name: platform
  #   type: generic
  #   url: https://your-platform/v1/webhook
  #   secret: ${PLATFORM_SECRET}
  #   signature_header: X-Webhook-Signature

# Optional: reorder/extend the processing pipeline (default: dedup, silence,
# routes). See README for the http-processor contract.
# pipeline:
#   - dedup
#   - silence
#   - {type: http, name: triage, url: ${BRAIN_URL}, on_error: pass}
#   - routes

routes:
  # Highest priority first. `stop: true` ends the walk after a match.
  - name: high-everywhere
    source: "*"
    when:
      level: [high, critical]
    send_to: [ops-chat, ops-dingtalk]
    priority: 100

  - name: grafana-default
    source: grafana
    send_to: [ops-chat]
    priority: 10

  - name: everything-to-archive
    source: "*"
    send_to: [archive]
    priority: 0
