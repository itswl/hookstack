<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hookrelay</title>
<style>
  /* One file, no build, no CDN. Dark-first; colour is EARNED by state —
     a healthy board reads quiet. */
  :root {
    --bg: #0b0e14; --surface: #11151d; --border: #1f2530; --border-soft: #171c26;
    --text: #d7dde6; --muted: #8b94a3; --accent: #4c8dff;
    --ok: #3dd68c; --warn: #f5a524; --bad: #e5484d;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.55 -apple-system, "PingFang SC", "Segoe UI", sans-serif; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .stamp { margin-left: auto; color: var(--muted); font-size: 12px; font-family: var(--mono); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card .label { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .card .value { font-size: 26px; font-weight: 650; font-family: var(--mono); }
  .card.dead-alarm { border-left: 3px solid var(--bad); }
  .card.dead-alarm .value { color: var(--bad); }

  h2 { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .06em;
       text-transform: uppercase; margin: 26px 0 10px; }
  .silence { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--warn);
             border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-size: 13px; }
  .silence .note { color: var(--muted); }

  .event { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
           margin-bottom: 10px; overflow: hidden; }
  .event summary { list-style: none; cursor: pointer; padding: 10px 14px;
                   display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .event summary::-webkit-details-marker { display: none; }
  .event[open] summary { border-bottom: 1px solid var(--border-soft); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .dot.high, .dot.critical { background: var(--bad); }
  .dot.warning, .dot.medium { background: var(--warn); }
  .dot.info, .dot.low { background: var(--accent); }
  .eid { font-family: var(--mono); color: var(--muted); font-size: 12px; }
  .etitle { font-weight: 600; overflow-wrap: anywhere; }
  .esrc { color: var(--muted); font-size: 12px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border);
           color: var(--muted); font-family: var(--mono); }
  .badge.routed { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .badge.skipped { color: var(--muted); }
  .etime { margin-left: auto; color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 10px; }
  .chip { font-size: 11px; font-family: var(--mono); padding: 2px 8px; border-radius: 6px;
          border: 1px solid var(--border); color: var(--muted); }
  .chip.sent { color: var(--ok); }
  .chip.dead { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .chip.queued { color: var(--warn); }
  .trace { margin: 0; padding: 12px 14px; background: #0a0d13; color: #aeb7c4;
           font-family: var(--mono); font-size: 12px; overflow-x: auto; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }

  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .tab { background: none; border: 0; color: var(--muted); padding: 8px 14px; cursor: pointer;
         font: inherit; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .btn { background: var(--surface); border: 1px solid var(--border); color: var(--text);
         border-radius: 8px; padding: 7px 14px; cursor: pointer; font: inherit; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.tiny { padding: 1px 8px; font-size: 11px; border-radius: 6px; }
  .editor { width: 100%; min-height: 380px; background: #0a0d13; color: #d7dde6;
            border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
            font-family: var(--mono); font-size: 12.5px; line-height: 1.6; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  .row input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
               color: var(--text); padding: 7px 10px; font-family: var(--mono); }
  .msg { font-size: 12.5px; font-family: var(--mono); padding: 8px 12px; border-radius: 8px;
         border: 1px solid var(--border); display: none; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.show { display: block; }
  .msg.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .msg.err { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .hint { color: var(--muted); font-size: 12px; }

  .tokenbar { display: none; gap: 8px; margin-bottom: 16px; }
  .tokenbar.show { display: flex; }
  .tokenbar input { flex: 1; background: var(--surface); border: 1px solid var(--border);
                    border-radius: 8px; color: var(--text); padding: 8px 12px; font-family: var(--mono); }
  .tokenbar button { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
                     padding: 8px 16px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>hookrelay</h1>
    <span class="sub">收 → 判 → 发,每一步有交代</span>
    <span class="stamp" id="stamp">加载中…</span>
  </header>

  <div class="tokenbar" id="tokenbar">
    <input id="tokenInput" type="password" placeholder="X-Read-Token">
    <button id="tokenSave">进入</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="events">事件</button>
    <button class="tab" data-tab="config">配置</button>
  </div>

  <div id="panel-events">
  <div class="cards">
    <div class="card"><div class="label">排队中</div><div class="value" id="cQueued">–</div></div>
    <div class="card"><div class="label">已送达</div><div class="value" id="cSent">–</div></div>
    <div class="card" id="deadCard"><div class="label">死信</div><div class="value" id="cDead">–</div></div>
  </div>

  <div id="silences"></div>

  <h2>最近事件 · 点开看决策链</h2>
  <div id="events"><div class="empty">…</div></div>
  </div><!-- /panel-events -->

  <div id="panel-config" style="display:none">
    <div class="row">
      <input id="adminToken" type="password" placeholder="X-Admin-Token(仅存本机 localStorage)" style="flex:1">
      <button class="btn" id="adminSave">记住</button>
    </div>

    <h2>config.yaml · 文件即真源,这里只是它的编辑器</h2>
    <textarea class="editor" id="cfgEditor" spellcheck="false" placeholder="加载中…"></textarea>
    <div class="row">
      <button class="btn primary" id="cfgSave">校验并保存(热生效)</button>
      <button class="btn" id="cfgReload">从文件重载</button>
      <span class="hint">校验不过 = 什么都不改;秘密请写 ${ENV} 引用,值放 .env</span>
    </div>
    <div class="msg" id="cfgMsg"></div>

    <h2>新建静音</h2>
    <div class="row">
      <input id="silSource" placeholder="来源名,或 * 表示全部" style="width:200px">
      <input id="silMinutes" type="number" value="60" min="1" style="width:90px">
      <span class="hint">分钟</span>
      <input id="silNote" placeholder="备注(可选)" style="flex:1">
      <button class="btn primary" id="silCreate">静音</button>
    </div>
    <div class="msg" id="silMsg"></div>
  </div><!-- /panel-config -->
</div>

<script>
(function () {
  "use strict";
  var TOKEN_KEY = "hookrelay-read-token";

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }
  function fmtTime(ts) {
    var d = new Date(ts * 1000);
    function p(n) { return n < 10 ? "0" + n : String(n); }
    return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  function render(data) {
    document.getElementById("cQueued").textContent = data.queue.queued;
    document.getElementById("cSent").textContent = data.queue.sent;
    document.getElementById("cDead").textContent = data.queue.dead;
    // Alarm colour is earned: dead=0 stays quiet.
    document.getElementById("deadCard").className = "card" + (data.queue.dead > 0 ? " dead-alarm" : "");

    var silences = data.silences || [];
    document.getElementById("silences").innerHTML = silences.length
      ? "<h2>生效中的静音</h2>" + silences.map(function (s) {
          return '<div class="silence">#' + esc(s.id) + " · " + esc(s.source) +
            ' · 至 ' + esc(fmtTime(s.until_ts)) +
            (s.note ? ' · <span class="note">' + esc(s.note) + "</span>" : "") +
            ' <button class="btn tiny" data-lift-silence="' + esc(s.id) + '">解除</button></div>';
        }).join("")
      : "";

    var events = data.recent || [];
    if (!events.length) {
      document.getElementById("events").innerHTML = '<div class="empty">还没有事件 — 投一条试试:examples/try.sh</div>';
      return;
    }
    document.getElementById("events").innerHTML = events.map(function (e) {
      var badge = e.outcome === "routed"
        ? '<span class="badge routed">routed → ' + esc((e.channels || []).join(", ")) + "</span>"
        : '<span class="badge skipped">skipped · ' + esc(e.skip_code || "?") + "</span>";
      var chips = (e.deliveries || []).map(function (d) {
        var extra = d.status === "dead" || d.last_error
          ? ' title="' + esc(d.last_error || "") + '"' : "";
        var retryBtn = d.status === "dead"
          ? ' <button class="btn tiny" data-retry-delivery="' + esc(d.id) + '">重试</button>' : "";
        return '<span class="chip ' + esc(d.status) + '"' + extra + ">" +
          esc(d.channel) + " · " + esc(d.status) + (d.attempts ? " ×" + esc(d.attempts) : "") + "</span>" + retryBtn;
      }).join("");
      return '<details class="event">' +
        '<summary>' +
          '<span class="dot ' + esc(e.level) + '"></span>' +
          '<span class="eid">#' + esc(e.id) + "</span>" +
          '<span class="etitle">' + esc(e.title) + "</span>" +
          '<span class="esrc">' + esc(e.source) + "</span>" + badge +
          '<span class="etime">' + esc(fmtTime(e.received_at)) + "</span>" +
        "</summary>" +
        (chips ? '<div class="chips">' + chips + "</div>" : "") +
        '<pre class="trace">' + esc(JSON.stringify(e.steps || [], null, 2)) + "</pre>" +
      "</details>";
    }).join("");
  }

  function refresh() {
    if (document.hidden) return;
    var headers = {};
    var token = localStorage.getItem(TOKEN_KEY);
    if (token) headers["X-Read-Token"] = token;
    fetch("/status", { headers: headers }).then(function (res) {
      if (res.status === 401) {
        document.getElementById("tokenbar").classList.add("show");
        document.getElementById("stamp").textContent = "需要读取令牌";
        return null;
      }
      document.getElementById("tokenbar").classList.remove("show");
      return res.json();
    }).then(function (data) {
      if (!data) return;
      render(data);
      document.getElementById("stamp").textContent = "刷新于 " + new Date().toTimeString().slice(0, 8);
    }).catch(function () {
      document.getElementById("stamp").textContent = "连接失败,重试中…";
    });
  }

  document.getElementById("tokenSave").addEventListener("click", function () {
    localStorage.setItem(TOKEN_KEY, document.getElementById("tokenInput").value.trim());
    refresh();
  });

  // ── tabs ──
  var ADMIN_KEY = "hookrelay-admin-token";
  document.querySelectorAll(".tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll(".tab").forEach(function (t) { t.classList.toggle("active", t === tab); });
      var which = tab.getAttribute("data-tab");
      document.getElementById("panel-events").style.display = which === "events" ? "" : "none";
      document.getElementById("panel-config").style.display = which === "config" ? "" : "none";
      if (which === "config") loadConfig();
    });
  });

  function adminHeaders() {
    var token = localStorage.getItem(ADMIN_KEY) || "";
    return token ? { "X-Admin-Token": token } : {};
  }
  function showMsg(id, ok, text) {
    var el = document.getElementById(id);
    el.className = "msg show " + (ok ? "ok" : "err");
    el.textContent = text;
  }

  var adminInput = document.getElementById("adminToken");
  adminInput.value = localStorage.getItem(ADMIN_KEY) || "";
  document.getElementById("adminSave").addEventListener("click", function () {
    localStorage.setItem(ADMIN_KEY, adminInput.value.trim());
    showMsg("cfgMsg", true, "令牌已保存在本机");
    loadConfig();
  });

  // ── config editor: GET → edit → PUT (validate-or-nothing) ──
  function loadConfig() {
    fetch("/config", { headers: adminHeaders() }).then(function (res) {
      if (res.status === 403) { showMsg("cfgMsg", false, "需要管理令牌(.env 里的 HOOKRELAY_ADMIN_TOKEN)"); return null; }
      if (!res.ok) { return res.json().then(function (d) { showMsg("cfgMsg", false, d.detail || res.status); return null; }); }
      return res.json();
    }).then(function (data) {
      if (data) { document.getElementById("cfgEditor").value = data.yaml; showMsg("cfgMsg", true, "已加载 " + data.path); }
    });
  }
  document.getElementById("cfgSave").addEventListener("click", function () {
    fetch("/config", { method: "PUT", headers: adminHeaders(), body: document.getElementById("cfgEditor").value })
      .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); })
      .then(function (r) {
        if (r.ok) {
          showMsg("cfgMsg", true, "已保存并热生效\nsources: " + r.d.sources.join(", ") +
            "\npipeline: " + r.d.pipeline.join(" → ") + "\nroutes: " + r.d.routes.join(", "));
          refresh();
        } else { showMsg("cfgMsg", false, "校验失败,未做任何更改:\n" + r.d.detail); }
      });
  });
  document.getElementById("cfgReload").addEventListener("click", function () {
    fetch("/config/reload", { method: "POST", headers: adminHeaders() })
      .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); })
      .then(function (r) {
        if (r.ok) { showMsg("cfgMsg", true, "已从文件重载"); loadConfig(); refresh(); }
        else { showMsg("cfgMsg", false, r.d.detail || "重载失败"); }
      });
  });

  // ── silences: create here, lift from the list ──
  document.getElementById("silCreate").addEventListener("click", function () {
    fetch("/silences", {
      method: "POST",
      headers: Object.assign({ "content-type": "application/json" }, adminHeaders()),
      body: JSON.stringify({
        source: document.getElementById("silSource").value.trim() || "*",
        minutes: parseInt(document.getElementById("silMinutes").value, 10) || 60,
        note: document.getElementById("silNote").value.trim()
      })
    }).then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); })
      .then(function (r) {
        showMsg("silMsg", r.ok, r.ok ? ("已静音 #" + r.d.id + " · " + r.d.source) : (r.d.detail || "失败"));
        refresh();
      });
  });

  // Delegated actions on the events panel (lift silence / retry dead).
  document.addEventListener("click", function (e) {
    var lift = e.target.closest("[data-lift-silence]");
    if (lift) {
      fetch("/silences/" + lift.getAttribute("data-lift-silence"), { method: "DELETE", headers: adminHeaders() })
        .then(function (res) { if (!res.ok) alert("解除失败:需要管理令牌(配置页设置)"); refresh(); });
    }
    var retry = e.target.closest("[data-retry-delivery]");
    if (retry) {
      fetch("/deliveries/" + retry.getAttribute("data-retry-delivery") + "/retry", { method: "POST", headers: adminHeaders() })
        .then(function (res) { if (!res.ok) alert("重试失败:需要管理令牌(配置页设置)"); refresh(); });
    }
  });

  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
