# The pipe's config for the whole-stack compose at the repo root.
#
#   upstream ──► /hook/inbound | /hook/alertmanager ──► hookjudge
#   sink ◄── /hook/judge-notify ◄── hookjudge
#
# Secrets are empty on purpose: this is a private docker network, and a local
# trial should not need key management to show you the shape of the thing.

sources:
  # A plain JSON door — the easiest thing to curl.
  - name: inbound
    secret: ""
    title: "{title}"
    body: "{message}"
    level: "{state}"
    level_map: {alerting: high, ok: info}
    fields:
      env: "{env}"
      status: "{state}"

  # Alertmanager. Two conventions that are easy to get wrong:
  #  1. dotted INDEX for arrays — `alerts[0]...` resolves to nothing, silently.
  #  2. carry `status` as a FIELD: Alertmanager signals recovery with
  #     status=resolved, level_map turns that into `info`, and its resolved
  #     text contains no recovery word — so without this the brain sees no
  #     recovery at all and judges the resolve as a brand-new alert.
  - name: alertmanager
    secret: ""
    title: "{alerts.0.annotations.summary|alerts.0.labels.alertname|commonLabels.alertname}"
    body: "{alerts.0.annotations.description|alerts.0.annotations.summary}"
    level: "{alerts.0.status|status}"
    level_map: {firing: high, resolved: info}
    fields:
      status: "{alerts.0.status|status}"
      env: "{alerts.0.labels.env|commonLabels.env}"
      service: "{alerts.0.labels.service}"
      alertname: "{alerts.0.labels.alertname|commonLabels.alertname}"

  # The return door: the brain posts its judgement back here.
  - name: judge-notify
    secret: ""
    title: "{meta.alert_name}"
    body: "{analysis.summary}"
    level: "{meta.importance}"

  # The investigator's return door: hookprobe posts its finished report here.
  # The summary is the card; the full report stays on the probe's session.
  # The investigator speaks the same PROCESSED-EVENT dialect as the judge
  # (meta.alert_name / analysis.summary), so `payload: processed` channels
  # dress its reports without knowing who wrote them.
  - name: probe-notify
    secret: ""
    title: "{meta.alert_name}"
    body: "{analysis.summary}"
    level: "{meta.importance}"
    fields:
      session: "{meta.session_key}"
      probe_status: "{meta.status}"
      cost_usd: "{meta.cost_usd}"

channels:
  - name: to-judge
    type: generic
    url: http://hookjudge:8200/events
    options: {payload: normalized}   # the brain wants the event, not a card

  # Resolved from the environment: the plain stack points this at the sink's
  # /probe-standin (so the escalation SHAPE is visible without a model key),
  # and `--profile probe` points it at the real investigator. See the
  # hookprobe service in the root compose.
  # Where a card press goes. `payload: raw` because the action envelope IS the
  # content — the pipe recorded the press as an event carrying it, and the brain
  # wants those bytes, not a normalized alert built around them. Unsigned like
  # every other hop in this demo (the brain's ingest_secret is empty here); a
  # real deployment signs both doors with the same secret.
  - name: to-judge-feedback
    type: generic
    url: http://hookjudge:8200/feedback
    options: {payload: raw}

  # Resolved from the environment: the plain stack points this at the sink's
  # /probe-standin (so the escalation SHAPE is visible without a model key),
  # and `--profile probe` points it at the real investigator. See the
  # hookprobe service in the root compose.
  - name: to-probe
    type: generic
    url: ${HOOKPROBE_EVENT_URL}
    options: {payload: normalized}   # the investigator wants the event too

  - name: ops-feishu
    type: feishu
    url: http://sink:9000/feishu
    options: {payload: processed}    # the brain judged, the pipe dresses

  - name: ops-dingtalk
    type: dingtalk
    url: http://sink:9000/dingtalk
    options: {payload: processed}

routes:
  # ORDER IS LOAD-BEARING. Routes accumulate unless one stops, and `to-brain`
  # is source "*" — which also matches judge-notify. Without this
  # higher-priority stop, the brain's own judgement would be fed back to the
  # brain, judged again, returned again, forever.
  # The investigator's report goes straight to the channels — and must stop
  # here: to-brain matches "*", and a report judged again would loop.
  - name: probe-report-out
    source: probe-notify
    send_to: [ops-feishu, ops-dingtalk]
    priority: 110
    stop: true

  - name: judged-out
    source: judge-notify
    send_to: [ops-feishu, ops-dingtalk]
    priority: 100
    stop: true

  # Escalation: the real front doors ALSO copy every event to the
  # investigator. The pipe stays content-blind — whether an event deserves a
  # paid investigation is the probe's own call (level gate, default
  # critical/high), which is why these routes fan out and do not stop.
  - name: escalate-inbound
    source: inbound
    send_to: [to-probe]
    priority: 50
  - name: escalate-alertmanager
    source: alertmanager
    send_to: [to-probe]
    priority: 50

  - name: to-brain
    source: "*"                      # every front door feeds the brain
    send_to: [to-judge]
    priority: 0

# Paired posture: the brain does the noise accounting, so the pipe's dedup
# stays OFF — otherwise both count and neither ledger describes reality.
pipeline: [silence, routes]

# The card's way back. A verdict DECLARES which buttons it deserves (that is
# judgement, and hookjudge's); this decides which of those the demo actually
# offers and where a press goes. `silence` is the pipe's own job, so it needs no
# channel to reach. `approve` is absent on purpose: it runs commands, so it is
# opt-in per deployment and the demo has nothing to approve.
#
# Only takes effect with HOOKRELAY_ACTION_SECRET set — the compose file sets a
# demo value. Empty means no card carries a button at all, because an unsigned
# button is a URL anyone in the group chat can press on your behalf.
card_actions:
  silence:
  useful:
    forward_to: to-judge-feedback
  useless:
    forward_to: to-judge-feedback
