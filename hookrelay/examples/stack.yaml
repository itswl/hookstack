# The pipe's config for the whole-stack compose at the repo root.
#
#   upstream ──► /hook/inbound | /hook/alertmanager ──► hookjudge
#   sink ◄── /hook/judge-notify ◄── hookjudge
#
# Secrets are empty on purpose: this is a private docker network, and a local
# trial should not need key management to show you the shape of the thing.

sources:
  # A plain JSON door — the easiest thing to curl.
  - name: inbound
    secret: ""
    title: "{title}"
    body: "{message}"
    level: "{state}"
    level_map: {alerting: high, ok: info, resolved: info}
    # A stated recovery reaches the investigator as a fact about work it has
    # already done (it verifies the run and spends nothing); a keyword in the
    # title is a judgement and stays the brain's. `state: resolved` says it;
    # `state: ok` only lowers the level.
    recovery: "{state}"
    fields:
      env: "{env}"
      status: "{state}"

  # Alertmanager. Two conventions that are easy to get wrong:
  #  1. dotted INDEX for arrays — `alerts[0]...` resolves to nothing, silently.
  #  2. carry `status` as a FIELD: Alertmanager signals recovery with
  #     status=resolved, level_map turns that into `info`, and its resolved
  #     text contains no recovery word — so without this the brain sees no
  #     recovery at all and judges the resolve as a brand-new alert.
  - name: alertmanager
    secret: ""
    title: "{alerts.0.annotations.summary|alerts.0.labels.alertname|commonLabels.alertname}"
    body: "{alerts.0.annotations.description|alerts.0.annotations.summary}"
    level: "{alerts.0.status|status}"
    level_map: {firing: high, resolved: info}
    # Alertmanager states the fact: status=resolved is the recovery flag, which
    # is what lets the investigator verify the work its firing started.
    recovery: "{alerts.0.status|status}"
    fields:
      status: "{alerts.0.status|status}"
      env: "{alerts.0.labels.env|commonLabels.env}"
      service: "{alerts.0.labels.service}"
      alertname: "{alerts.0.labels.alertname|commonLabels.alertname}"

  # The return door: the brain posts its judgement back here.
  - name: judge-notify
    secret: ""
    title: "{meta.alert_name}"
    body: "{analysis.summary}"
    level: "{meta.importance}"
    recovery: "{meta.is_recovery}"
    # What closes the round trip on the board: the judge echoes the pipe's
    # correlation id, so its verdict lands in the chain of the alert it judged
    # (one chain per alert on /timeline), and chains that share a judge burst
    # are grouped into one incident. Same shape as the production config.
    fields:
      origin: "{meta.source}"
      wake: "{meta.wake_someone}"
      correlation_id: "{meta.correlation_id}"
      burst_id: "{meta.burst_id}"

  # The investigator's return door: hookprobe posts its finished report here.
  # The summary is the card; the full report stays on the probe's session.
  # The investigator speaks the same PROCESSED-EVENT dialect as the judge
  # (meta.alert_name / analysis.summary), so `payload: processed` channels
  # dress its reports without knowing who wrote them.
  - name: probe-notify
    secret: ""
    title: "{meta.alert_name}"
    body: "{analysis.summary}"
    level: "{meta.importance}"
    fields:
      session: "{meta.session_key}"
      probe_status: "{meta.status}"
      cost_usd: "{meta.cost_usd}"
      # The event id the investigator was handed, which is what puts the
      # report in the alert's chain (the pipe resolves the bare id and its own
      # hr- spelling alike). The report also echoes `meta.correlation_id`, the
      # pipe's hr- handle from the delivery header — that one the pipe reads
      # when it cuts the report's buttons, so a press lands in the alert's
      # chain; a door written for an older investigator keeps working.
      correlation_id: "{meta.event_id}"

channels:
  - name: to-judge
    type: generic
    url: http://hookjudge:8200/events
    options: {payload: normalized}   # the brain wants the event, not a card

  # Resolved from the environment. The compose points this at the
  # investigator's door, which is up by default on the rehearsal; point it at
  # the sink's /probe-standin to see the escalation SHAPE alone.
  # Where a card press goes. `payload: raw` because the action envelope IS the
  # content — the pipe recorded the press as an event carrying it, and the brain
  # wants those bytes, not a normalized alert built around them. Unsigned like
  # every other hop in this demo (the brain's ingest_secret is empty here); a
  # real deployment signs both doors with the same secret.
  - name: to-judge-feedback
    type: generic
    url: http://hookjudge:8200/feedback
    options: {payload: raw}

  # Resolved from the environment: the investigator's event door (see the
  # hookprobe service in the root compose and in the quickstart).
  - name: to-probe
    type: generic
    url: ${HOOKPROBE_EVENT_URL}
    options: {payload: normalized}   # the investigator wants the event too

  # Where a press on the investigator's card goes: approve, follow-up and
  # remember all ride this channel back to its action door. `payload: raw` for
  # the same reason as the judge's feedback channel — the envelope IS the
  # content. Unsigned in this demo (HOOKPROBE_EVENT_SECRET is empty); a real
  # deployment signs it with the same secret as the event door.
  - name: to-probe-action
    type: generic
    url: ${HOOKPROBE_ACTION_URL}
    options: {payload: raw}

  # People. The pipe sends a card MODEL to the chat bridge (docs/bridge-protocol.md);
  # the bridge renders the Feishu card and posts it — here, in webhook mode, to
  # the sink the way it would to a custom bot's URL. The pipe names no platform.
  - name: ops-feishu
    type: bridge
    url: http://lark-bridge:9100/
    secret: demo-bridge-secret       # the bridge's BRIDGE_INBOUND_SECRET (compose)
    options: {payload: processed}    # the brain judged, the pipe models, the bridge dresses

  # A second dialect from the same judgement — a plugin: the compose mounts
  # examples/plugins as HOOKRELAY_PLUGINS, and this type comes from
  # chat_markdown_channels.py there. Actions on it are links (HOOKRELAY_PUBLIC_URL).
  - name: ops-dingtalk
    type: dingtalk
    url: http://sink:9000/dingtalk
    options: {payload: processed}

routes:
  # ORDER IS LOAD-BEARING. Routes accumulate unless one stops, and `to-brain`
  # is source "*" — which also matches judge-notify. Without this
  # higher-priority stop, the brain's own judgement would be fed back to the
  # brain, judged again, returned again, forever.
  # The investigator's report goes straight to the channels — and must stop
  # here: to-brain matches "*", and a report judged again would loop.
  - name: probe-report-out
    source: probe-notify
    send_to: [ops-feishu, ops-dingtalk]
    priority: 110
    stop: true

  - name: judged-out
    source: judge-notify
    send_to: [ops-feishu, ops-dingtalk]
    priority: 100
    stop: true

  # Escalation: the real front doors ALSO copy every event to the
  # investigator. The pipe stays content-blind — whether an event deserves a
  # paid investigation is the probe's own call (level gate, default
  # critical/high), which is why these routes fan out and do not stop.
  - name: escalate-inbound
    source: inbound
    send_to: [to-probe]
    priority: 50
  - name: escalate-alertmanager
    source: alertmanager
    send_to: [to-probe]
    priority: 50

  - name: to-brain
    source: "*"                      # every front door feeds the brain
    send_to: [to-judge]
    priority: 0

# Paired posture: the brain does the noise accounting, so the pipe's dedup
# stays OFF — otherwise both count and neither ledger describes reality.
pipeline: [silence, routes]

# The card's way back. A node DECLARES which buttons its report deserves (that
# is judgement, and the judge's or the investigator's); this decides which of
# those the deployment actually offers and where a press goes. A kind absent
# here is dropped silently at delivery — which is how the retired production
# pipe, whose list stopped at `remember`, delivered 741 cards without one
# approve or follow-up button while the investigator declared them on every
# report that proposed something. `silence` is the pipe's own job, so it needs
# no channel to reach.
#
# `approve` runs commands, so it stays a per-deployment decision: this demo
# offers it because the investigator's allowlist admits only two observations
# (hookprobe/replays/rehearsal-allowlist) and the press is the thing the demo
# exists to show. Copying this block into a real deployment is arming a door;
# read the note above before doing it.
#
# Only takes effect with HOOKRELAY_ACTION_SECRET set — the compose file sets a
# demo value. Empty means no card carries a button at all, because an unsigned
# button is a URL anyone in the group chat can press on your behalf.
card_actions:
  silence:
  useful:
    forward_to: to-judge-feedback
  useless:
    forward_to: to-judge-feedback
  followup:
    forward_to: to-probe-action
  approve:
    forward_to: to-probe-action
  remember:
    forward_to: to-probe-action
