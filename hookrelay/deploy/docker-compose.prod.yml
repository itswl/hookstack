# Production shape: hookrelay as the single alert front door, joined to
# WebhookWise's docker network so senders (Grafana / Alertmanager) reach it
# by DNS name and it reaches WW's ingest the same way.
#
#   cd /opt/docker-compose/hookrelay
#   docker compose -f hookrelay/deploy/docker-compose.prod.yml up -d --build
#
# Paths are deliberately asymmetric: the BUILD context is this service's
# directory, but `.env` and `data/` are read from the deployment root two
# levels up. They are runtime state — the live ledger, config.yaml, plugins —
# not source, and moving them when the source tree was reorganised would have
# turned a directory rename into a production data migration.
#
# Differences from the laptop compose, each deliberate:
#   - no sink toy service
#   - port bound to 127.0.0.1 only (senders live on the docker network;
#     the host binding exists for ssh-tunnel access to the status page)
#   - joins webhookwise_webhook_net (external) under the DNS name `hookrelay`

services:
  hookrelay:
    build:
      context: ..
    container_name: hookrelay
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ../../data:/data
    env_file:
      - ../../.env
    environment:
      HOOKRELAY_PLUGINS: /data/plugins
    restart: unless-stopped

networks:
  default:
    name: webhookwise_webhook_net
    external: true
