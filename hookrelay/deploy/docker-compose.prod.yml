# Production shape: hookrelay as the single alert front door, joined to the
# docker network of the platform it feeds, so senders (Grafana / Alertmanager)
# reach it by DNS name and it reaches that platform's ingest the same way.
# The external network name below is this deployment's actual network — set
# yours in the `networks:` block at the bottom.
#
#   cd /srv/hookstack
#   docker compose -f hookrelay/deploy/docker-compose.prod.yml up -d --build
#
# That directory is the checkout of this repository, and it is the one name all
# four deployment files have to agree on: `.env`, `data/` and `probe-data/` are
# read from it by relative path, and scripts/backup_probe_data.sh defaults to it
# when it goes looking for state to tar. The prod files used to say `hookrelay`
# here, from when this repository was only the pipe.
#
# Paths are deliberately asymmetric: the BUILD context is this service's
# directory, but `.env` and `data/` are read from the deployment root two
# levels up. They are runtime state — the live ledger, config.yaml, plugins —
# not source, and moving them when the source tree was reorganised would have
# turned a directory rename into a production data migration.
#
# Differences from the laptop compose, each deliberate:
#   - no sink toy service
#   - port bound to 127.0.0.1 only (senders live on the docker network;
#     the host binding exists for ssh-tunnel access to the status page)
#   - joins webhookwise_webhook_net (external) under the DNS name `hookrelay`

# Explicit, because compose otherwise derives the project name from the compose
# FILE's directory — which is `deploy` for this file and `deploy` for the
# investigator's prod file too. Two production deployments then share one
# project name, and a `docker compose down` aimed at either one is aimed at
# both.
name: hookrelay-prod

services:
  hookrelay:
    build:
      context: ..
    container_name: hookrelay
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ../../data:/data
    env_file:
      - ../../.env
    environment:
      HOOKRELAY_PLUGINS: /data/plugins
    restart: unless-stopped

networks:
  default:
    name: webhookwise_webhook_net
    external: true
